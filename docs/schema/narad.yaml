  LongitudinalPlacementParamGroup:
    name: LongitudinalPlacementParamGroup
    definition_uri: https://pals-project.readthedocs.io/LongitudinalPlacementParamGroup
    description: "Mixin for an element's extent and position along the longitudinal\
      \ (beam-direction, \"s\") axis. \nCorresponds to PALS's ungrouped element parameters\
      \ `length` and `s_position`.\nOne (or both) `length` or `s_position` must be\
      \ present."
    from_schema: https://w3id.org/accelerator-core
    slots:
    - length
    - longitudinalPlacementParamGroup__s_position
    attributes:
      s_position:
        name: s_position
        description: Longitudinal position of the element along the beamline.
        slot_uri: pals:s_position
        range: float
    class_uri: pals:LongitudinalPlacementParamGroup
    rules:
    - preconditions:
        slot_conditions:
          id:
            name: id
            value_presence:
              text: PRESENT
      postconditions:
        any_of:
        - slot_conditions:
            length:
              name: length
              value_presence:
                text: PRESENT
        - slot_conditions:
            s_position:
              name: s_position
              value_presence:
                text: PRESENT
      description: An element must have a length and/or a position along the beamline.
