classes:
  PALSAccelerator:
    name: PALSAccelerator
    definition_uri: https://pals-project.readthedocs.io/PALSAccelerator
    description: Root container for accelerator core components, semantic signals,
      and local bindings.
    from_schema: https://w3id.org/accelerator-core
    slots:
    - kind
    - description
    - affiliation
    - pALSAccelerator__version
    - pALSAccelerator__authors
    - pALSAccelerator__notes
    - pALSAccelerator__facility
    attributes:
      version:
        name: version
        description: Version of the representation of a particle accelerator and its
          operations.
        range: string
        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
      authors:
        name: authors
        description: Contains the authorship information for this representation of
          an accelerator facility and its operations.
        range: Author
        multivalued: true
        inlined_as_list: true
      notes:
        name: notes
        description: Additional notes or comments about the representation of a particle
          accelerator and its operations.
        range: string
        multivalued: true
        inlined_as_list: true
      facility:
        name: facility
        description: A facility that contains lattice elements (physical and virtual),
          beamlines, parameter set commands, signals, etc.
        range: Facility
    class_uri: pals:PALSAccelerator
    tree_root: true
  Author:
    name: Author
    definition_uri: https://pals-project.readthedocs.io/Author
    description: Contains authorship information for a representation of an accelerator
      facility and its operations.
    from_schema: https://w3id.org/accelerator-core
    slots:
    - name
    - affiliation
    - author__email
    - author__orcid
    attributes:
      email:
        name: email
        description: The email address of the author.
        range: string
        pattern: ^[^@]+@[^@]+\.[^@]+$
      orcid:
        name: orcid
        description: The ORCID identifier of the author.
        range: string
        pattern: ^https://orcid\.org/\d{4}-\d{4}-\d{4}-\d{3}[\dX]$
    class_uri: pals:Author
  Facility:
    name: Facility
    definition_uri: https://pals-project.readthedocs.io/Facility
    description: A facility that houses one or more accelerators.
    from_schema: https://w3id.org/accelerator-core
    slots:
    - identifiers
    - facility__components
    - facility__beamlines
    - facility__signals
    - facility__signal_bindings
    - facility__component_relations
    attributes:
      components:
        name: components
        description: A list of physical components in the accelerator system.
        range: Component
        multivalued: true
        inlined_as_list: true
      beamlines:
        name: beamlines
        description: A list of beamlines in the accelerator system.
        range: BeamLine
        multivalued: true
        inlined_as_list: true
      signals:
        name: signals
        description: A list of signals in the accelerator system.
        range: Signal
        multivalued: true
        inlined_as_list: true
      signal_bindings:
        name: signal_bindings
        description: A list of signal bindings in the accelerator system (Component
          <-> Signal relationships).
        range: SignalBinding
        multivalued: true
        inlined_as_list: true
      component_relations:
        name: component_relations
        description: A list of component relations in the accelerator system (Component
          <-> Component relationships).
        range: ComponentRelation
        multivalued: true
        inlined_as_list: true
    class_uri: pals:Facility
  Affiliation:
    name: Affiliation
    definition_uri: https://pals-project.readthedocs.io/Affiliation
    description: Contains affiliation information for an author or component, such
      as a ROR.
    from_schema: https://w3id.org/accelerator-core
    slots:
    - id
    - name
    - identifiers
    class_uri: pals:Affiliation
  Identifier:
    name: Identifier
    definition_uri: https://pals-project.readthedocs.io/Identifier
    description: A unique, and ideally persistent, identifier for a facility, such
      as a DOI or ROR.
    from_schema: https://w3id.org/accelerator-core
    slots:
    - identifier__identifier_type
    - identifier__identifier_value
    attributes:
      identifier_type:
        name: identifier_type
        description: The type of identifier, such as DOI | PURL | ROR | LOCAL | URL
          | ARK.
        range: IdentifierTypeEnum
      identifier_value:
        name: identifier_value
        description: The value of the identifier.
        range: string
    class_uri: pals:Identifier
  HasMetaP:
    name: HasMetaP
    definition_uri: https://pals-project.readthedocs.io/HasMetaP
    from_schema: https://w3id.org/accelerator-core
    mixin: true
    slots:
    - hasMetaP__MetaP
    attributes:
      MetaP:
        name: MetaP
        description: A mixin for metadata parameters that are aligned with PALS MetaP
          (Metadata Parameters) for interoperability with the Particle Accelerator
          Language Standard (PALS).
        range: MetaParamGroup
        inlined: true
    class_uri: pals:HasMetaP
  MetaParamGroup:
    name: MetaParamGroup
    definition_uri: https://pals-project.readthedocs.io/MetaParamGroup
    description: Mixin class for metadata parameters that are aligned with PALS MetaP
      (Metadata Parameters) for interoperability with the Particle Accelerator Language
      Standard (PALS).
    from_schema: https://w3id.org/accelerator-core
    broad_mappings:
    - pals:MetaP
    slots:
    - description
    - alias
    - metaParamGroup__label
    - metaParamGroup__additional_metadata
    attributes:
      label:
        name: label
        description: A label string.
        slot_uri: pals:label
        range: string
      additional_metadata:
        name: additional_metadata
        description: Additional metadata or annotations for the instance.
        range: AdditionalMetadata
        multivalued: true
        inlined_as_list: true
    class_uri: pals:MetaParamGroup
