  VirtualComponent:
    name: VirtualComponent
    definition_uri: https://pals-project.readthedocs.io/VirtualComponent
    description: A virtual or logical component that represents a concept, function,
      or role in the accelerator  beamline operation but does not have a physical
      instantiation.  This can be used to capture abstract components, such as Markers,
      BeamLineSections, and FacilitySpaces that are important for understanding the
