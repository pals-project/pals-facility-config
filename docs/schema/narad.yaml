        range: float
      Es:
        name: Es
        description: Skew component of the field.
        broad_mappings:
        - pals:EsN
        range: float
      EnL:
        name: EnL
        description: Length-integrated normal component.
        broad_mappings:
        - pals:EnNL
        range: float
      EsL:
        name: EsL
        description: Length-integrated skew component.
        broad_mappings:
        - pals:EsNL
        range: float
      Bn:
        name: Bn
