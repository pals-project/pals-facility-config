        broad_mappings:
        - pals:BnN
        range: float
      Bs:
        name: Bs
        description: Skew component of the magnetic field.
        broad_mappings:
        - pals:BsN
        range: float
      Kn:
        name: Kn
        description: Normalized normal component.
        broad_mappings:
        - pals:KnN
        range: float
      Ks:
