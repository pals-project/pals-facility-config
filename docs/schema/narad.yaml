name: accelerator_core
description: A lightweight LinkML schema for facility-agnostic accelerator components,
  their beamline relationships, and associated control-system signals.
title: Accelerator Core Ontology
id: https://w3id.org/accelerator-core
imports:
- linkml:types
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  acc:
    prefix_prefix: acc
    prefix_reference: https://example.org/accelerator-core/
  quantitykind:
    prefix_prefix: quantitykind
    prefix_reference: http://qudt.org/vocab/quantitykind/
  sosa:
    prefix_prefix: sosa
    prefix_reference: http://www.w3.org/ns/sosa/
  RO:
    prefix_prefix: RO
    prefix_reference: http://purl.obolibrary.org/obo/RO_
  BFO:
    prefix_prefix: BFO
    prefix_reference: http://purl.obolibrary.org/obo/BFO_
  saref:
    prefix_prefix: saref
    prefix_reference: https://saref.etsi.org/core/v4.1.1/
  pals:
    prefix_prefix: pals
    prefix_reference: https://pals-project.readthedocs.io/
  inst:
    prefix_prefix: inst
    prefix_reference: https://example.org/narad-instance/
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: pals
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  IdentifierTypeEnum:
    name: IdentifierTypeEnum
    definition_uri: https://pals-project.readthedocs.io/IdentifierTypeEnum
    description: Controlled values for identifier types.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      DOI:
        text: DOI
        description: Digital Object Identifier.
        meaning: http://purl.org/spar/datacite/doi
      PURL:
        text: PURL
        description: Persistent Uniform Resource Locator.
        meaning: http://purl.org/spar/datacite/purl
      ROR:
        text: ROR
        description: Research Organization Registry identifier.
        meaning: http://purl.org/spar/datacite/ror
      LOCAL:
        text: LOCAL
        description: Local identifier, specific to the facility or source system.
        meaning: http://purl.org/spar/datacite/local-resource-identifier-scheme
      URL:
        text: URL
        description: Uniform Resource Locator.
        meaning: http://purl.org/spar/datacite/url
      ARK:
        text: ARK
        description: Archival Resource Key.
        meaning: http://purl.org/spar/datacite/ark
  SourceSystemEnum:
    name: SourceSystemEnum
    definition_uri: https://pals-project.readthedocs.io/SourceSystemEnum
    description: Controlled values for facility-local source systems.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      EPICS:
        text: EPICS
        description: EPICS control system.
      EPICS_ChannelAccess:
        text: EPICS_ChannelAccess
        description: EPICS Channel Access source.
      PALS_Ext:
        text: PALS_Ext
        description: PALS-Ext or middle-layer channel/export system.
      MYA:
        text: MYA
        description: MYA archive or historical channel service.
      ElementDatabase:
        text: ElementDatabase
        description: Facility element database.
      ChannelDatabase:
        text: ChannelDatabase
        description: Facility channel database.
      Simulation:
        text: Simulation
        description: Simulation or model-derived signal source.
      Other:
        text: Other
        description: Other source system.
  PhysicalRelationEnum:
    name: PhysicalRelationEnum
    definition_uri: https://pals-project.readthedocs.io/PhysicalRelationEnum
    description: Controlled values for physical relation to the beamline.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      Inline:
        text: Inline
        description: Beam passes through the physical component or beamline aperture.
          The physical component is physically on the beamline.
      AttachedToPipe:
        text: AttachedToPipe
        description: Mechanically attached to the beam pipe or vacuum envelope.
      NearBeamLine:
        text: NearBeamLine
        description: Near and operationally associated with the beamline.
      SupportingFacility:
        text: SupportingFacility
        description: Supports accelerator operation without a specific beam-pipe placement.
  VirtualRelationEnum:
    name: VirtualRelationEnum
    definition_uri: https://pals-project.readthedocs.io/VirtualRelationEnum
    description: Controlled values for virtual relation to the beamline.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      Inline:
        text: Inline
        description: Beam passes through the virtual component. Used for virtual components
          like Markers that represent important locations on the beamline but don't
          have a physical instantiation.
      AssociatedWithBeamLine:
        text: AssociatedWithBeamLine
        description: Not inline with the beamline but still operationally associated
          with it.  Used for virtual components that are important for understanding
          the BeamLine structure and function but don't have a direct physical relationship
          to the beam path,  such as BeamLineSections or Markers that are not inline
          with the beam.
      NotAssociatedWithBeamLine:
        text: NotAssociatedWithBeamLine
        description: Not inline with the BeamLine and not operationally associated
          with it.  Used for virtual components that are more abstract and don't have
          a specific relationship  to the BeamLine, such as a virtual component representing
          a control system function  or role that is important for understanding the
          overall accelerator system but doesn't have a direct relationship to the
          BeamLine structure.
  PhysicalFunctionEnum:
    name: PhysicalFunctionEnum
    definition_uri: https://pals-project.readthedocs.io/PhysicalFunctionEnum
    description: Broad device-level functions.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      Focusing:
        text: Focusing
        description: Focuses or defocuses the beam.
      Steering:
        text: Steering
        description: Steers the beam in a transverse plane.
      BeamPositionMeasurement:
        text: BeamPositionMeasurement
        description: Measures transverse beam position.
      VacuumGeneration:
        text: VacuumGeneration
        description: Generates or maintains vacuum.
      RadiationMonitoring:
        text: RadiationMonitoring
        description: Monitors radiation dose or dose rate.
      Measurement:
        text: Measurement
        description: Measures beam or machine state.
      BeamAcceleration:
        text: BeamAcceleration
        description: Accelerates the beam.
      BeamLossDetection:
        text: BeamLossDetection
        description: Detects beam loss.
      BeamCurrentMeasurement:
        text: BeamCurrentMeasurement
        description: Measures beam current or intensity.
      BeamProfileMeasurement:
        text: BeamProfileMeasurement
        description: Measures beam profile.
      MachineProtection:
        text: MachineProtection
        description: Supports machine protection.
      TimingSynchronization:
        text: TimingSynchronization
        description: Supports timing or synchronization.
  FacilityFunctionEnum:
    name: FacilityFunctionEnum
    definition_uri: https://pals-project.readthedocs.io/FacilityFunctionEnum
    description: Broad structural or support functions.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      Support:
        text: Support
        description: Provides mechanical support for accelerator operations.
      Alignment:
        text: Alignment
        description: Supports alignment of accelerator components.
      PowerSupply:
        text: PowerSupply
        description: Provides electrical power to accelerator components.
      ControlRack:
        text: ControlRack
        description: Houses control electronics for accelerator components.
      Cooling:
        text: Cooling
        description: Provides cooling for accelerator components.
      Diagnostics:
        text: Diagnostics
        description: Provides diagnostic capabilities for accelerator components,
          such as monitoring or measurement.
      Detection:
        text: Detection
        description: Provides detection capabilities for accelerator components, such
          as radiation or particle detection.
  VirtualFunctionEnum:
    name: VirtualFunctionEnum
    definition_uri: https://pals-project.readthedocs.io/VirtualFunctionEnum
    description: Broad virtual component functions or roles.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      BeamLineSection:
        text: BeamLineSection
        description: A section of the BeamLine used for organizational or functional
          grouping of components, such as a linac section, transfer line, or ring
          sector.
        meaning: pals:BeamLine
      Mark:
        text: Mark
        description: A virtual component representing an important location on the
          beamline,  such as a reference point for beam-based alignment, a location
          of a known aperture restriction,  or a location of a critical diagnostic
          device.
        meaning: pals:Marker
      Fork:
        text: Fork
        description: A virtual component representing a branching point in the beamline,  such
          as a beamline fork or switchyard.
        meaning: pals:Fork
      Control:
        text: Control
        description: A virtual component representing a control system function or
          role that is important for understanding the overall accelerator system  but
          doesn't have a direct relationship to the beamline structure,  such as the
          EPICS control system that manages device process variables across the accelerator.
  PlaneEnum:
    name: PlaneEnum
    definition_uri: https://pals-project.readthedocs.io/PlaneEnum
    description: Controlled values for transverse plane.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      Horizontal:
        text: Horizontal
        description: Horizontal transverse plane.
      Vertical:
        text: Vertical
        description: Vertical transverse plane.
  SignalRoleEnum:
    name: SignalRoleEnum
    definition_uri: https://pals-project.readthedocs.io/SignalRoleEnum
    description: Roles for control-system signals.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      Setpoint:
        text: Setpoint
        description: Requested or configured value.
        meaning: sosa:ActuatableProperty
      Readback:
        text: Readback
        description: Measured or reported value.
        meaning: sosa:ObservableProperty
      Status:
        text: Status
        description: State or condition indicator.
      Command:
        text: Command
        description: Command or action trigger.
        meaning: sosa:ActuatableProperty
      MinimumLimit:
        text: MinimumLimit
        description: Minimum allowed signal value.
        meaning: xsd:minInclusive
      MaximumLimit:
        text: MaximumLimit
        description: Maximum allowed signal value.
        meaning: xsd:maxInclusive
  CanonicalSignalTypeEnum:
    name: CanonicalSignalTypeEnum
    definition_uri: https://pals-project.readthedocs.io/CanonicalSignalTypeEnum
    description: Portable semantic meanings for important signals.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      HorizontalBeamPosition:
        text: HorizontalBeamPosition
        description: Horizontal beam position signal.
      VerticalBeamPosition:
        text: VerticalBeamPosition
        description: Vertical beam position signal.
      HorizontalBeamPositionOffset:
        text: HorizontalBeamPositionOffset
        description: Horizontal beam position offset signal.
      VerticalBeamPositionOffset:
        text: VerticalBeamPositionOffset
        description: Vertical beam position offset signal.
      BeamIntensity:
        text: BeamIntensity
        description: Beam intensity or current signal.
      DeviceStatus:
        text: DeviceStatus
        description: Device status signal.
      GradientSetpoint:
        text: GradientSetpoint
        description: Cavity accelerating gradient setpoint signal.
      GradientReadback:
        text: GradientReadback
        description: Cavity accelerating gradient readback signal.
      MagnetCurrentSetpoint:
        text: MagnetCurrentSetpoint
        description: Magnet current setpoint signal.
      MagnetCurrentReadback:
        text: MagnetCurrentReadback
        description: Magnet current readback signal.
      MagnetFieldSetpoint:
        text: MagnetFieldSetpoint
        description: Magnet field setpoint signal.
      IntegratedFieldSetpoint:
        text: IntegratedFieldSetpoint
        description: Integrated magnetic field setpoint signal.
      IntegratedFieldReadback:
        text: IntegratedFieldReadback
        description: Integrated magnetic field readback signal.
      VacuumPressure:
        text: VacuumPressure
        description: Vacuum pressure signal.
      IonPumpCurrent:
        text: IonPumpCurrent
        description: Ion pump current signal.
      IonPumpVoltage:
        text: IonPumpVoltage
        description: Ion pump voltage signal.
      GammaDoseRate:
        text: GammaDoseRate
        description: Gamma radiation dose-rate signal.
      NeutronDoseRate:
        text: NeutronDoseRate
        description: Neutron radiation dose-rate signal.
      Status:
        text: Status
        description: Generic status signal for a device.
  QuantityKindEnum:
    name: QuantityKindEnum
    definition_uri: https://pals-project.readthedocs.io/QuantityKindEnum
    description: Physical quantity kinds for signals.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      BeamPosition:
        text: BeamPosition
        description: Beam transverse position.
      State:
        text: State
        description: Device state or condition.
        meaning: sosa:ObservableProperty
      ElectricCurrent:
        text: ElectricCurrent
        description: Electric current.
        meaning: quantitykind:ElectricCurrent
      IntegratedMagneticField:
        text: IntegratedMagneticField
        description: Integrated magnetic field.
        meaning: quantitykind:MagneticFluxPerLength
      MagneticField:
        text: MagneticField
        description: Magnetic field.
        meaning: quantitykind:MagneticFluxDensity
      Pressure:
        text: Pressure
        description: Gas or vacuum pressure.
        meaning: quantitykind:Pressure
      DoseRate:
        text: DoseRate
        description: Radiation dose rate.
        meaning: quantitykind:AbsorbedDoseRate
      Voltage:
        text: Voltage
        description: Electric potential difference.
        meaning: quantitykind:Voltage
      Power:
        text: Power
        description: Power.
        meaning: quantitykind:Power
      CavityPhase:
        text: CavityPhase
        description: Cavity phase.
        meaning: quantitykind:PhaseAngle
      CavityGradient:
        text: CavityGradient
        description: Cavity accelerating gradient.
        meaning: quantitykind:ElectricFieldStrength
  UnitEnum:
    name: UnitEnum
    definition_uri: https://pals-project.readthedocs.io/UnitEnum
    description: Engineering units using ASCII-safe enum names. Values map to QUDT
      unit IRIs with the LinkML meaning field when an exact QUDT unit is available.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      A:
        text: A
        description: ampere
      degree:
        text: degree
        description: degree
      eV:
        text: eV
        description: electron volt
      eV_per_c:
        text: eV_per_c
        description: momentum in electron volts per speed of light
      eV_per_c2:
        text: eV_per_c2
        description: mass in electron volts per speed of light squared
      fundamental_charge:
        text: fundamental_charge
        description: fundamental charge
      G_per_cm:
        text: G_per_cm
        description: gauss per centimeter
      Hz:
        text: Hz
        description: hertz
      kW:
        text: kW
        description: kilowatt
      m:
        text: m
        description: meter
      mm:
        text: mm
        description: millimeter
      mrem_per_h:
        text: mrem_per_h
        description: millirem per hour. Kept as a local accelerator unit value because
          QUDT publishes related radiation units but no exact millirem-per-hour unit
          in the checked vocabulary.
      MV_per_m:
        text: MV_per_m
        description: megavolt per meter
      PA:
        text: PA
        description: pascal
      randians_pi2:
        text: randians_pi2
        description: radians divided by 2 pi - angles and phases
      rem_per_h:
        text: rem_per_h
        description: rem per hour. Kept as a local accelerator unit value because
          QUDT publishes rem and rem-per-second but no exact rem-per-hour unit in
          the checked vocabulary.
      seconds:
        text: seconds
        description: second
      T:
        text: T
        description: tesla
      T_M:
        text: T_M
        description: tesla meter
      Torr:
        text: Torr
        description: torr
      V:
        text: V
        description: volt
      V_per_m:
        text: V_per_m
        description: volt per meter
      unitless:
        text: unitless
        description: dimensionless numeric value
      none:
        text: none
        description: no unit or not applicable
  DataTypeEnum:
    name: DataTypeEnum
    definition_uri: https://pals-project.readthedocs.io/DataTypeEnum
    description: Data types for parameter values.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      String:
        text: String
        description: string data type
        meaning: xsd:string
      Integer:
        text: Integer
        description: integer data type
        meaning: xsd:integer
      Float:
        text: Float
        description: floating-point data type
        meaning: xsd:float
      Boolean:
        text: Boolean
        description: boolean data type
        meaning: xsd:boolean
  ComponentRelationPredicateEnum:
    name: ComponentRelationPredicateEnum
    definition_uri: https://pals-project.readthedocs.io/ComponentRelationPredicateEnum
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      precedes:
        text: precedes
        description: Subject occurs immediately before object in the sequence/beamline
          order.
        meaning: BFO:0000063
      follows:
        text: follows
        description: Subject occurs after object in the sequence/beamline order.
        meaning: BFO:0000062
      contains:
        text: contains
        description: Subject spatially or mereologically contains object.
        meaning: BFO:0000051
      contained_in:
        text: contained_in
        description: Subject is spatially or mereologically contained in object.
        meaning: BFO:0000050
      connected_to:
        text: connected_to
        description: Subject and object are physically connected. a is connected to
          b if and only if a and b are discrete structure,  and there exists some
          connecting structure c, such that c connects a and b
        meaning: RO:0002170
      controls:
        text: controls
        description: Subject controls the state or behavior of object.
        meaning: saref:controls
      is_controlled_by:
        text: is_controlled_by
        description: Subject is controlled by object.
        meaning: saref:isControlledBy
      is_part_of:
        text: is_part_of
        description: Subject is a part of object.
        meaning: BFO:0000050
      has_part:
        text: has_part
        description: Subject has part object.
        meaning: BFO:0000051
      adjacent_to:
        text: adjacent_to
        description: Subject and object are spatially adjacent, without overlapping.
        meaning: RO:0002220
      overlaps:
        text: overlaps
        description: Subject and object share at least one part in common.
        meaning: RO:0002131
      mounted_on:
        text: mounted_on
        description: Subject is mounted on object.
        meaning: pals:mounted_on
      intersects:
        text: intersects
        description: Subject intersects with object.
        meaning: pals:intersects
      nearest_to:
        text: nearest_to
        description: Subject is nearest to object.
        meaning: pals:nearest_to
  SignalBindingPredicateEnum:
    name: SignalBindingPredicateEnum
    definition_uri: https://pals-project.readthedocs.io/SignalBindingPredicateEnum
    description: Controlled predicates for Component-to-Signal bindings.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      has_signal:
        text: has_signal
        description: Generic association between a component and one of its signals.
          The specific role (setpoint, readback, status, etc.) is carried by the Signal's
          own signal_role field, not the predicate.
      has_status_signal:
        text: has_status_signal
        description: Subject has the given signal as its status indicator.
      has_setpoint_signal:
        text: has_setpoint_signal
        description: Subject has the given signal as its setpoint.
      has_readback_signal:
        text: has_readback_signal
        description: Subject has the given signal as its readback.
      has_command_signal:
        text: has_command_signal
        description: Subject has the given signal as a command trigger.
      has_limit_signal:
        text: has_limit_signal
        description: Subject has the given signal as a limit/constraint value.
  RelationContextEnum:
    name: RelationContextEnum
    definition_uri: https://pals-project.readthedocs.io/RelationContextEnum
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      beamline_order:
        text: beamline_order
      Euclidean_3D:
        text: Euclidean_3D
      Euclidean_2D:
        text: Euclidean_2D
      floorplan:
        text: floorplan
      containment:
        text: containment
      installation_mounting:
        text: installation_mounting
  ReferenceFrameEnum:
    name: ReferenceFrameEnum
    definition_uri: https://pals-project.readthedocs.io/ReferenceFrameEnum
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      beam_direction:
        text: beam_direction
      facility_coordinates:
        text: facility_coordinates
      local_component_frame:
        text: local_component_frame
      tunnel_stationing:
        text: tunnel_stationing
  AxisEnum:
    name: AxisEnum
    definition_uri: https://pals-project.readthedocs.io/AxisEnum
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      x:
        text: x
      y:
        text: y
      z:
        text: z
      s:
        text: s
  DirectionEnum:
    name: DirectionEnum
    definition_uri: https://pals-project.readthedocs.io/DirectionEnum
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      upstream:
        text: upstream
      downstream:
        text: downstream
      positive:
        text: positive
      negative:
        text: negative
  MultipoleGeometryEnum:
    name: MultipoleGeometryEnum
    definition_uri: https://pals-project.readthedocs.io/MultipoleGeometryEnum
    description: The geometric configuration of the multipole field.  Sets the geometry
      used to calculate multipoles.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      follows_ref_geometry:
        text: follows_ref_geometry
        description: Use geometry equivalent to the setting of `ref_geometry`.
      vertically_pure:
        text: vertically_pure
        description: Vertically pure multipoles with arc geometry.
      horizontally_pure:
        text: horizontally_pure
        description: Horizontally pure multipoles with arc geometry.
      chord:
        text: chord
        description: Z-axis is the chord connecting the entrance origin point to the
          exit origin point.
      entrance_coords:
        text: entrance_coords
        description: Rectangular coordinates commensurate with the entrance coordinates.
      exit_coords:
        text: exit_coords
        description: Rectangular coordinates commensurate with the exit coordinates.
  ReferenceGeometryEnum:
    name: ReferenceGeometryEnum
    definition_uri: https://pals-project.readthedocs.io/ReferenceGeometryEnum
    description: The reference geometry used to calculate multipoles.  Sets the geometry
      used to calculate multipoles.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      arc:
        text: arc
        description: Default. Reference are the curvelinear arc coordinates.
      chord:
        text: chord
        description: Z-axis is the chord connecting the entrance origin point to the
          exit origin point.
      entrance_coords:
        text: entrance_coords
        description: Rectangular coordinates commensurate with the entrance coordinates.
      exit_coords:
        text: exit_coords
        description: Rectangular coordinates commensurate with the exit coordinates.
  CavityTypeEnum:
    name: CavityTypeEnum
    definition_uri: https://pals-project.readthedocs.io/CavityTypeEnum
    description: The type of cavity, which determines the field configuration and
      mode structure.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      STANDING_WAVE:
        text: STANDING_WAVE
        description: Default. A cavity that supports standing wave modes, typically
          with fixed geometry and resonant frequencies.
      TRAVELING_WAVE:
        text: TRAVELING_WAVE
        description: A cavity that supports traveling wave modes, typically with a
          waveguide structure and phase velocity matching the beam.
  ZeroPhaseEnum:
    name: ZeroPhaseEnum
    definition_uri: https://pals-project.readthedocs.io/ZeroPhaseEnum
    description: The zero phase reference for the cavity, which determines the phase
      of the RF field at the entrance of the cavity.
    from_schema: https://w3id.org/accelerator-core
    permissible_values:
      ACCELERATING:
        text: ACCELERATING
        description: Default. The zero phase is the maximum accelerating phase, where
          the beam gains energy.
      BELOW_TRANSITION:
        text: BELOW_TRANSITION
        description: Zero phase is at the stable zero crossing for particles below
          transition.
      ABOVE_TRANSITION:
        text: ABOVE_TRANSITION
        description: Zero phase is at the stable zero crossing for particles above
          transition..
slots:
  id:
    name: id
