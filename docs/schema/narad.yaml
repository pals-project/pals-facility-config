    - physicalComponent__beamline_relation
    - hasFloorP__FloorP
    - hasLongitudinalPlacementP__LongitudinalPlacementP
    attributes:
      functions:
        name: functions
        description: The function of the physical component,  which can be used to
          identify the component across different source systems.
        slot_uri: pals:physical_function
        range: PhysicalFunctionEnum
        required: true
        multivalued: true
      beamline_relation:
        name: beamline_relation
        description: The relationship of the physical component to the beamline,  which
          can be used to identify the component across different source systems.
        slot_uri: pals:physical_beamline_relation
