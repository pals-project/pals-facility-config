  PhysicalComponent:
    name: PhysicalComponent
    definition_uri: https://pals-project.readthedocs.io/PhysicalComponent
    description: A physical item that participates in or supports accelerator operation.  This
      can be used to capture physical components, such as magnets, cavities, diagnostics,
      vacuum devices, and racks that are important for understanding the structure
      and function of the accelerator system.
