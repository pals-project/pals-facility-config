  BeamLine:
    name: BeamLine
    definition_uri: https://pals-project.readthedocs.io/BeamLine
    description: PALS element for an ordered sequence of beamline elements defining
      a beam path.
    from_schema: https://w3id.org/accelerator-core
    exact_mappings:
    - pals:BeamLine
    is_a: VirtualComponent
    slots:
    - id
    - kind
    - component__native_types
    - hasMetaP__MetaP
    - virtualComponent__functions
    - virtualComponent__beamline_relation
    - hasFloorP__FloorP
    - BeamLine_length
    - description
    - beamLine__multipass
    - beamLine__periodic
    - beamLine__repeat
    - beamLine__direction
    slot_usage:
      length:
        name: length
        description: The total length of the BeamLine. For pals interoperability,
          use m as the unit of length.
    attributes:
      multipass:
        name: multipass
        description: Indicates whether the BeamLine is a multipass BeamLine, where
          the beam passes through the same physical elements multiple times. If not
          provided, the default assumption is that the BeamLine is single-pass.
        slot_uri: pals:multipass
        range: boolean
      periodic:
        name: periodic
        description: Indicates whether orbit and Twiss parameters periodic. If not
          provided, the default assumption is that the BeamLine is not periodic.
        slot_uri: pals:periodic
        range: boolean
      repeat:
        name: repeat
        description: 'Repetition count. If not provided, the default assumption is
          that the beamline is not repeated and the value is 1.

          If value is greater than 1, the beamline is repeated that many times.'
        slot_uri: pals:repeat
        range: integer
      direction:
        name: direction
        description: 'Beam direction along the BeamLine: +1 or -1. Longitudinal orientation.
          Default is +1.'
        slot_uri: pals:direction
        range: integer
    class_uri: pals:BeamLine
