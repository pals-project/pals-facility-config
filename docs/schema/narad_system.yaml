    is_usage_slot: true
    usage_slot_name: is_instance_of
    range: string
    multivalued: true
  System_has_sub_system:
    name: System_has_sub_system
    definition_uri: https://w3id.org/narad_linkml/schema/narad/has_sub_system
    description: "Relates a System to one of its subsystems (SSN alignment). Use for\
      \ facility \u2192 control-system, facility \u2192 device, and device \u2192\
      \ component decomposition.\n"
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
