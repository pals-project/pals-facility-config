name: narad-system-schema
description: "LinkML schema for representing NARAD control-system semantics, facility-level\
  \ signal templates, and facility-specific instance bindings aligned with SSN, SSN-System,\
  \ and SOSA ontologies. \nMain modeling layers:\n  - NaradModel \u2014 top-level\
  \ document containing NaradConfig, beamlines, and elements\n    - NaradConfig \u2014\
  \ top-level NARAD-system container for the capability layer and signal layer\n \
  \     - ControlCapabilityLayer \u2014 reusable control-profile families, shared\
  \ capabilities\n      - InstrumentLayer \u2014 facility-specific instrument definitions\
  \ -> their  capabilities\n      - SignalLayer \u2014 facility-specific signal suffix\
  \ templates for system/device types and instance bindings keyed by semantic signal\
  \ name, linked to the\n        device type\n  - Beamline / BeamlineElement \u2014\
  \ ordered machine layout of the beamline/line\n  - Element instances \u2014 individual\
  \ beamline elements with applied profiles and instance signal\n    bindings, parameters,\
  \ and optional facility-specific parameters\n\nSystem hierarchy:\n  - System\n \
  \   - ControlSystem\n    - Magnet\n      - Quadrupole, Corrector, Dipole, Solenoid\n\
  \    - Instrument\n      - BPM\n    - RFCavity\n    - Marker\n    - Drift\n\nControl\
  \ Capability hierarchy:\n  - SystemCapability\n    - MagnetControlCapability\n \
  \     - QuadrupoleStrengthControlCapability, CorrectorKickControlCapability, DipoleBendControlCapability\n\
  \    - InstrumentControlCapability\n    - BPMControlCapability\n    - CavityGradientControlCapability\n\
  \nSignal modeling:\n  - Signal \u2014 abstract control-system quantity\n    - ObservableSignal\
  \ \u2014 readback, constraint, and status quantities\n    - ActuatableSignal \u2014\
  \ writable/control setpoints\n  - SignalBinding \u2014 signal template or suffix\
  \ definition in the signal layer\n  - InstanceSignalBinding \u2014 facility-specific\
  \ PV binding attached to a beamline element\n\nSerialization conventions:\n  - beamlines\
  \ are keyed by beamline name\n  - signals are keyed by semantic signal name\n  -\
  \ instance_signal_bindings are keyed by semantic signal name\n\nAlignments with\
  \ PALS (Particle Accelerator Language Standard):\n  - Beamline aligns with pals:BeamLine\n\
  \  - BeamlineElement aligns with pals:Element\n  - Instrument aligns with pals:Instrument\n\
  \  - Dipole aligns with pals:Multipole\n  - Quadrupole aligns with pals:Quadrupole\n\
  \  - Solenoid aligns with pals:Solenoid\n  - RFCavity aligns with pals:RFCavity\n\
  \nAdditional Notes on Usage: 1. On Signal, SignalBinding, and InstanceSignalBinding:\
  \ These classes represent different levels of abstraction in the signal modeling.\
  \  Signal defines the abstract control-system quantity (e.g. current_readback),\
  \ SignalBinding captures the control system suffix convention for that signal (e.g.\
  \ .R for EPICS readback),  and InstanceSignalBinding represents the concrete binding\
  \ of that signal to a specific beamline element instance, for example, MQWK202.S\
  \ or RK11:GSET, depending on the facility naming convention.  The semantic signal\
  \ name (e.g. current_readback) is the key that links these layers together, while\
  \ the control-system suffix (e.g. .R)  is captured in the SignalBinding. 2. On the\
  \ distinction between is_instance_of, facility_element_type, and device_type:\n\
  \  - BeamlineElement.is_instance_of identifies the element\u2019s semantic class,\
  \ device_type classifies capability or signal-definition scope, and facility_element_type\
  \ records facility-local designation.\n  - facility_element_type (FacilityParamSet.facility_element_type)\
  \ is an optional slot for recording the facility-specific type designation for this\
  \ element, if it differs from the generic element_kind. \n  - device_type (ControlCapability.device_type)\
  \ is the generic element type used for capability profile matching \n  and signal\
  \ definition scoping, while facility_element_type captures the facility-specific\
  \ type designation that may be used in the control system naming convention \n \
  \ or for other facility-specific purposes.\n  For example, a facility might have\
  \ its own naming convention for magnet types that doesn't align one-to-one with\
  \ the ElementKindEnum values.\n3. Expected CURIE usage for is_instance_of, is_hosted_by,\
  \ and is_property_of: \n  - is_instance_of typically points to the semantic class\
  \ instantiated by the binding or element, using a CURIE such as narad:CavityGradientCapability\
  \ if that is your intended convention.\n  - is_hosted_by typically points to the\
  \ FacilitySystem this binding belongs to, e.g. narad:UITF.\n  - is_property_of typically\
  \ points to the ControlSystem that implements this binding, e.g. narad:epics.\n\
  4. Open and constrained vocabularies:\n  - ElementKindEnum provides a controlled\
  \ vocabulary for key classification slots, but the schema is designed to be extensible\
  \ \n  with new enum values as needed.\n  - SystemTypeEnum is a high-level classification\
  \ for systems that can be used for querying and filtering, \n  but it is not intended\
  \ to capture all the nuance of device types or capabilities.\n  - DataTypeEnum and\
  \ SignalRoleEnum provide a controlled vocabulary for signal data types and roles,\
  \ \n  but the schema allows for additional values to be added as needed.\n  - IdentifierTypeEnum\
  \ provides a controlled vocabulary for types of identifiers used in FacilityIdentifier,\
  \ \n  but it can be extended to apply to other entities, and with additional identifier\
  \ types as needed.\n  - The properties slot in FacilityParamSet allows for open-ended\
  \ key-value pairs to capture any additional \n  facility-specific parameters that\
  \ don't fit into the predefined schema structure.\n\nNeeded Custom Validations:\n\
  \  - Validation to ensure that the element_kind of a BeamlineElement matches the\
  \ device_type of the DeviceSystem it is an instance of.\n  - Validation to ensure\
  \ that the value of is_property_of in InstanceSignalBinding matches one of the control\
  \ systems listed in narad_config.has_sub_system.\n  - Validation that each signal_layer\
  \ -> facilities -> FacilitySystem -> control_system value has a corresponding entry\
  \ in narad_config.has_sub_system to ensure that all control systems referenced in\
  \ the signal layer are defined in the capability layer.\n  - Validation that the\
  \ signal_bindings defined for a given device_type in the signal layer align with\
  \ the signals defined in the capability profiles and instrument systems for that\
  \ device type.\n"
id: https://w3id.org/narad_linkml/schema/narad/system
imports:
- linkml:types
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  narad:
    prefix_prefix: narad
    prefix_reference: https://w3id.org/narad_linkml/schema/narad/
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  owl:
    prefix_prefix: owl
    prefix_reference: http://www.w3.org/2002/07/owl#
  ssn:
    prefix_prefix: ssn
    prefix_reference: http://www.w3.org/ns/ssn/
  ssn-system:
    prefix_prefix: ssn-system
    prefix_reference: http://www.w3.org/ns/ssn/systems/
  sosa:
    prefix_prefix: sosa
    prefix_reference: http://www.w3.org/ns/sosa/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  qudt:
    prefix_prefix: qudt
    prefix_reference: http://qudt.org/schema/qudt/
  si-unit:
    prefix_prefix: si-unit
    prefix_reference: http://qudt.org/vocab/unit/
  ncit:
    prefix_prefix: ncit
    prefix_reference: http://purl.obolibrary.org/obo/ncit.owl
  ro:
    prefix_prefix: ro
    prefix_reference: http://purl.obolibrary.org/obo/RO_
  pals:
    prefix_prefix: pals
    prefix_reference: https://pals-project.readthedocs.io/en/latest/overview.html
default_prefix: narad
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ElementKindEnum:
    name: ElementKindEnum
    definition_uri: https://w3id.org/narad_linkml/schema/narad/ElementKindEnum
    description: 'Controlled vocabulary for beamline element types, shared between
      the capability layer (CapabilityProfile.device_type) and the element layer (BeamlineElement.kind).
      Keeping the enum here keeps profile device_type values in sync with element
      kind values without circular imports. Values must stay aligned with CapabilityProfile.device_type.
      NOTE: The element_kind of this BeamlineElement must match the device_type of
      the DeviceSystem referenced by is_instance_of.'
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    permissible_values:
      Drift:
        text: Drift
        description: A field-free drift space between elements.
        exact_mappings:
        - pals:Drift
      Marker:
        text: Marker
        description: A zero-length reference point or survey marker.
        exact_mappings:
        - pals:Marker
      BPM:
        text: BPM
        description: Beam Position Monitor.
        broad_mappings:
        - pals:Instrument
      Corrector:
        text: Corrector
        description: Dipole corrector magnet for orbit correction.
      Dipole:
        text: Dipole
        description: Dipole bending magnet.
        broad_mappings:
        - pals:Multipole
      Quadrupole:
        text: Quadrupole
        description: Quadrupole focusing/defocusing magnet.
        exact_mappings:
        - pals:Quadrupole
      Solenoid:
        text: Solenoid
        description: Solenoid magnet.
        exact_mappings:
        - pals:Solenoid
      CavityGradient:
        text: CavityGradient
        description: Accelerating or bunching cavity.
      RFCavity:
        text: RFCavity
        description: Radio-frequency accelerating or bunching cavity.
        exact_mappings:
        - pals:RFCavity
      Instrument:
        text: Instrument
        description: Generic beam diagnostic instrument (halo monitor, viewer, etc.).
        exact_mappings:
        - pals:Instrument
      Magnet:
        text: Magnet
        description: Generic powered magnet device (supertype for all magnet kinds).
  SystemTypeEnum:
    name: SystemTypeEnum
    definition_uri: https://w3id.org/narad_linkml/schema/narad/SystemTypeEnum
    description: High-level system type for classification and querying. This is a
      broad categorization that can be used for filtering or grouping systems without
      needing to traverse the has_sub_system and has_system_capability edges.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    permissible_values:
      Facility:
        text: Facility
        description: A physical facility or installation (e.g. BTA, CEBAF, or UITF).
      ControlSystem:
        text: ControlSystem
        description: A control system (e.g. epics) that manages device process variables.
      Magnet:
        text: Magnet
        description: A powered magnet device/system (generic supertype for all magnet
          kinds).
    inherits:
    - ElementKindEnum
  DataTypeEnum:
    name: DataTypeEnum
    definition_uri: https://w3id.org/narad_linkml/schema/narad/DataTypeEnum
    description: Allowed data types for signal values.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    permissible_values:
      int:
        text: int
        description: Integer.
        meaning: ncit:C47840
      float:
        text: float
        description: Single-precision floating-point.
        meaning: ncit:C48150
      double:
        text: double
        description: Double-precision floating-point.
        meaning: ncit:C48870
      string:
        text: string
        description: Text string.
        meaning: ncit:C45253
      boolean:
        text: boolean
        description: True/false value.
        meaning: ncit:C45254
      coded_value:
        text: coded_value
        description: A code referenced from an external coding system.
        meaning: ncit:C95637
  SignalRoleEnum:
    name: SignalRoleEnum
    definition_uri: https://w3id.org/narad_linkml/schema/narad/SignalRoleEnum
    description: Controlled vocabulary for the semantic role of a signal within a
      capability.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    permissible_values:
      control:
        text: control
        description: A writable signal that commands a device setpoint.
        broad_mappings:
        - sosa:ActuatableProperty
      readback:
        text: readback
        description: A readable signal that reports a measured or monitored quantity.
          Differs from status in that it typically indicates a continuous measurement
          (e.g. current readback, beam position) rather than discrete states.
        broad_mappings:
        - sosa:ObservableProperty
      constraint:
        text: constraint
        description: A signal that defines an operational limit or boundary on a control
          quantity.
      status:
        text: status
        description: A signal reporting the device or system operational state. Differs
          from readback in that it typically indicates discrete states (e.g. fault,
          standby, ready) rather than a continuous measurement.
        broad_mappings:
        - sosa:ObservableProperty
  IdentifierTypeEnum:
    name: IdentifierTypeEnum
    definition_uri: https://w3id.org/narad_linkml/schema/narad/IdentifierTypeEnum
    description: Allowed identifier types for facilities and other entities.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    permissible_values:
      doi:
        text: doi
        description: Digital Object Identifier (DOI).
      ark:
        text: ark
        description: Archival Resource Key (ARK).
      handle:
        text: handle
        description: Handle System identifier.
      url:
        text: url
        description: Uniform Resource Locator (URL).
      local:
        text: local
        description: Local identifier unique within a specific context or namespace.
      other:
        text: other
        description: Any other type of identifier not covered by the above categories.
slots:
  name:
    name: name
    definition_uri: https://w3id.org/narad_linkml/schema/narad/name
    description: Human-readable name or local string key for the entity.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slot_uri: narad:name
    identifier: true
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
    required: true
  description:
    name: description
    definition_uri: https://w3id.org/narad_linkml/schema/narad/description
    description: Detailed description of the entity.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slot_uri: narad:description
    owner: NamedThing
    domain_of:
    - NamedThing
    range: string
  has_sub_system:
    name: has_sub_system
    definition_uri: https://w3id.org/narad_linkml/schema/narad/has_sub_system
    description: "Relates a System to one of its subsystems (SSN alignment). Use for\
      \ facility \u2192 control-system, facility \u2192 device, and device \u2192\
      \ component decomposition.\n"
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn-system:hasSubSystem
    domain: System
    slot_uri: narad:has_sub_system
    owner: DeviceSystem
    domain_of:
    - NaradConfig
    - System
    - DeviceSystem
    range: System
    multivalued: true
  control_capability:
    name: control_capability
    definition_uri: https://w3id.org/narad_linkml/schema/narad/control_capability
    description: Cross-reference to the specific control capability applied to this
      element.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slot_uri: narad:control_capability
    range: ControlCapability
    inlined: false
  has_system_capability:
    name: has_system_capability
    definition_uri: https://w3id.org/narad_linkml/schema/narad/has_system_capability
    description: 'Relates a System to a SystemCapability it supports (SSN-System alignment).
      Prefer this over directly attaching signals to systems when capability context
      matters.

      '
