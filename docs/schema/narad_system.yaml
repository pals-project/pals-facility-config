    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn-system:hasSystemCapability
    is_a: has_system_capability
    domain: System
    slot_uri: narad:has_system_capability
    alias: has_system_capability
    owner: System
    domain_of:
    - System
    is_usage_slot: true
    usage_slot_name: has_system_capability
    range: SystemCapability
    multivalued: true
    inlined: true
    inlined_as_list: false
  DeviceSystem_has_sub_system:
    name: DeviceSystem_has_sub_system
    definition_uri: https://w3id.org/narad_linkml/schema/narad/has_sub_system
    description: "Relates a System to one of its subsystems (SSN alignment). Use for\
      \ facility \u2192 control-system, facility \u2192 device, and device \u2192\
      \ component decomposition.\n"
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn-system:hasSubSystem
    is_a: System_has_sub_system
    domain: DeviceSystem
    slot_uri: narad:has_sub_system
    alias: has_sub_system
    owner: DeviceSystem
    domain_of:
    - DeviceSystem
    is_usage_slot: true
    usage_slot_name: has_sub_system
    range: System
    multivalued: true
    inlined: true
    inlined_as_list: true
  DeviceSystem_has_system_capability:
    name: DeviceSystem_has_system_capability
    definition_uri: https://w3id.org/narad_linkml/schema/narad/has_system_capability
    description: 'Relates a System to a SystemCapability it supports (SSN-System alignment).
      Prefer this over directly attaching signals to systems when capability context
      matters.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn-system:hasSystemCapability
    is_a: System_has_system_capability
    domain: DeviceSystem
    slot_uri: narad:has_system_capability
    alias: has_system_capability
    owner: DeviceSystem
    domain_of:
    - DeviceSystem
    is_usage_slot: true
    usage_slot_name: has_system_capability
    range: SystemCapability
    multivalued: true
    inlined: false
  SystemCapability_for_property:
    name: SystemCapability_for_property
    definition_uri: https://w3id.org/narad_linkml/schema/narad/for_property
    description: "SystemCapability \u2192 Signal: the capability can expose, monitor,\
      \ control, or actuate that signal.\n"
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:forProperty
    is_a: for_property
    domain: SystemCapability
    slot_uri: narad:for_property
    alias: for_property
    owner: SystemCapability
    domain_of:
    - SystemCapability
    is_usage_slot: true
    usage_slot_name: for_property
    range: string
    multivalued: true
  InstanceSignalBinding_is_instance_of:
    name: InstanceSignalBinding_is_instance_of
    definition_uri: https://w3id.org/narad_linkml/schema/narad/is_instance_of
    description: 'NARAD alias for rdf:type. Links a facility-specific instance node
      to the LinkML class or semantic class it instantiates. In the graph this edge
      is labelled narad:isInstanceOf. Values are typically the rdf:type of the Class
      that implements the signal binding.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - rdf:type
    is_a: is_instance_of
    domain: InstanceSignalBinding
    slot_uri: narad:is_instance_of
    alias: is_instance_of
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: is_instance_of
    range: string
    multivalued: true
  InstanceSignalBinding_is_hosted_by:
    name: InstanceSignalBinding_is_hosted_by
    definition_uri: https://w3id.org/narad_linkml/schema/narad/is_hosted_by
    description: 'Links an InstanceSignalBinding to the FacilitySystem it belongs
      to. This is the edge that connects the facility-specific bindings to the Facility
      node in the graph.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - ssn-system:hasSubSystem
    - ssn:isHostedBy
    is_a: is_hosted_by
    domain: InstanceSignalBinding
    slot_uri: narad:is_hosted_by
    alias: is_hosted_by
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: is_hosted_by
    range: string
    multivalued: false
  InstanceSignalBinding_is_property_of:
    name: InstanceSignalBinding_is_property_of
    definition_uri: https://w3id.org/narad_linkml/schema/narad/is_property_of
    description: 'Inverse of for_property: links the Class Signal to the Class of
      SignalBinding Procedure that implements it. This can also link the Instance
      of a SignalBinding to the ControlSystem that implements it. This is the edge
      that connects the signal definitions to the facility-specific bindings in the
      graph. Values are typically the ControlSystem that implements this binding,
      e.g. narad:epics (for EPICS control system). NOTE: The value of this slot must
      match one of the values in narad_config.has_sub_system.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - ssn:isPropertyOf
    is_a: is_property_of
    domain: InstanceSignalBinding
    slot_uri: narad:is_property_of
    alias: is_property_of
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: is_property_of
    range: string
    multivalued: false
  InstanceSignalBinding_for_property:
    name: InstanceSignalBinding_for_property
    definition_uri: https://w3id.org/narad_linkml/schema/narad/for_property
    description: "SystemCapability \u2192 Signal: the capability can expose, monitor,\
      \ control, or actuate that signal.\n"
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:forProperty
    is_a: for_property
    domain: InstanceSignalBinding
    slot_uri: narad:for_property
    alias: for_property
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: for_property
    range: string
    multivalued: true
classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/narad_linkml/schema/narad/NamedThing
    description: Abstract base class providing identity and human-readable metadata.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    abstract: true
    slots:
    - name
    - description
    class_uri: narad:NamedThing
  NaradModel:
    name: NaradModel
    definition_uri: https://w3id.org/narad_linkml/schema/narad/NaradModel
    description: Top-level NARAD document container.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - narad_config
    - beamlines
    - elements
    class_uri: narad:NaradModel
    tree_root: true
  NaradConfig:
    name: NaradConfig
    definition_uri: https://w3id.org/narad_linkml/schema/narad/NaradConfig
    description: 'A top-level NARAD-system container for the: capability layer + signal
      layer.'
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - ssn:Deployment
    slots:
    - NaradConfig_schema_version
    - intent
    - NaradConfig_deployed_system
    - NaradConfig_has_sub_system
    - control_capability_layer
    - NaradConfig_device_layer
    - NaradConfig_signal_layer
    slot_usage:
      schema_version:
        name: schema_version
        description: Version of the NARAD schema used in this document.
        range: string
        required: true
      deployed_system:
        name: deployed_system
        description: Identifier of the deployed system this configuration describes.
        range: FacilitySystem
        required: true
        multivalued: false
      has_sub_system:
        name: has_sub_system
        description: Identifier of the control system (e.g. epics) this configuration
          describes.
        range: ControlSystem
        required: true
        multivalued: true
      device_layer:
        name: device_layer
        description: Device Capability definitions keyed by capability name.
        range: DeviceSystem
        required: true
        multivalued: true
        inlined: true
      signal_layer:
        name: signal_layer
        description: Signal-layer container for facility-specific signal bindings.
        range: SignalLayer
        required: true
        inlined: false
    class_uri: narad:NaradConfig
  CapabilityLayer:
    name: CapabilityLayer
    definition_uri: https://w3id.org/narad_linkml/schema/narad/CapabilityLayer
    description: Capability-layer container for control profile families.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - control_capabilities
    class_uri: narad:CapabilityLayer
  ControlCapability:
    name: ControlCapability
    definition_uri: https://w3id.org/narad_linkml/schema/narad/ControlCapability
    description: A reusable device-type control profile that extends a generic shared
      capability with type-specific signals (e.g. QuadrupoleCurrentControlProfile).
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: NamedThing
    slots:
    - name
    - description
    - device_type
    - subclass_of
    - ControlCapability_signals
    slot_usage:
      signals:
        name: signals
        required: true
    class_uri: narad:ControlCapability
  SignalLayer:
    name: SignalLayer
    definition_uri: https://w3id.org/narad_linkml/schema/narad/SignalLayer
    description: Signal-layer container for facility-specific signal bindings.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - facilities
    class_uri: narad:SignalLayer
  FacilitySystem:
    name: FacilitySystem
    definition_uri: https://w3id.org/narad_linkml/schema/narad/FacilitySystem
    description: Facility-specific signal binding configuration.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: System
    slots:
    - name
    - description
    - system_type
    - System_has_sub_system
    - System_has_system_capability
    - facility_identifier
    - control_system
    - naming_convention
    - signal_definitions
    class_uri: narad:FacilitySystem
  FacilityIdentifier:
    name: FacilityIdentifier
    definition_uri: https://w3id.org/narad_linkml/schema/narad/FacilityIdentifier
    description: A globally unique identifier for an entity (e.g., facility), with
      a specified type (e.g. DOI, ROR, ARK, local).
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - identifier_type
    - identifier_value
    class_uri: narad:FacilityIdentifier
  SignalDefinitions:
    name: SignalDefinitions
    definition_uri: https://w3id.org/narad_linkml/schema/narad/SignalDefinitions
    description: Signal binding set scoped to a device type or device domain.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: NamedThing
    slots:
    - name
    - description
    - device_type
    - SignalDefinitions_signal_bindings
    slot_usage:
      signal_bindings:
        name: signal_bindings
        multivalued: true
        inlined: true
    class_uri: narad:SignalDefinitions
  SignalBinding:
    name: SignalBinding
    definition_uri: https://w3id.org/narad_linkml/schema/narad/SignalBinding
    description: A named control system suffix definition for one semantic signal.
      The suffix is used within in a template naming convention to construct the full
      control system PV name for a given device instance.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: NamedThing
    slots:
    - name
    - description
    - control_system_suffix
    class_uri: narad:SignalBinding
  Beamline:
    name: Beamline
    definition_uri: https://w3id.org/narad_linkml/schema/narad/Beamline
    description: A top-level NARAD-system for an ordered sequence of beamline elements
      defining a beam path.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - pals:BeamLine
    is_a: NamedThing
    slots:
    - name
    - description
    - multipass
    - length
    - zero_point
    - periodic
    - line
    class_uri: narad:Beamline
  BeamlineElement:
    name: BeamlineElement
    definition_uri: https://w3id.org/narad_linkml/schema/narad/BeamlineElement
    description: A single element in a beamline with its kind and optional NARAD capability
      annotations.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - pals:Element
    is_a: NamedThing
