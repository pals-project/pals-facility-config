    in_subset:
    - relationship
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn-system:hasSubSystem
    is_a: System_has_sub_system
    domain: Device
    slot_uri: narad:has_sub_system
    alias: has_sub_system
    owner: Device
    domain_of:
    - Device
    is_usage_slot: true
    usage_slot_name: has_sub_system
    range: System
    multivalued: true
    inlined: true
    inlined_as_list: true
  Device_has_system_capability:
    name: Device_has_system_capability
    definition_uri: https://example.org/narad_linkml/schema/narad/has_system_capability
    description: 'Relates a System to a SystemCapability it supports (SSN-System alignment).
      Prefer this over directly attaching signals to systems when capability context
      matters.

      '
    in_subset:
    - relationship
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn-system:hasSystemCapability
    is_a: System_has_system_capability
    domain: Device
    slot_uri: narad:has_system_capability
    alias: has_system_capability
    owner: Device
    domain_of:
    - Device
    is_usage_slot: true
    usage_slot_name: has_system_capability
    range: SystemCapability
    multivalued: true
    inlined: false
  NamingConventionExample_example:
    name: NamingConventionExample_example
    definition_uri: https://example.org/narad_linkml/schema/narad/example
    description: A single example of how this naming convention is applied to a specific
      device instance and signal.
    in_subset:
    - label
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: example
    domain: NamingConventionExample
    slot_uri: narad:example
    identifier: true
    alias: example
    owner: NamingConventionExample
    domain_of:
    - NamingConventionExample
    is_usage_slot: true
    usage_slot_name: example
    range: string
    required: true
  SystemCapability_for_property:
    name: SystemCapability_for_property
    definition_uri: https://example.org/narad_linkml/schema/narad/for_property
    description: "SystemCapability \u2192 Signal: the capability can expose, monitor,\
      \ control, or actuate that signal.\n"
    in_subset:
    - relationship
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:forProperty
    is_a: for_property
    domain: SystemCapability
    slot_uri: narad:for_property
    alias: for_property
    owner: SystemCapability
    domain_of:
    - SystemCapability
    is_usage_slot: true
    usage_slot_name: for_property
    range: string
    multivalued: true
  TemplateExample_example:
    name: TemplateExample_example
    definition_uri: https://example.org/narad_linkml/schema/narad/example
    description: A single example of how this naming convention is applied to a specific
      device instance and signal.
    in_subset:
    - label
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: example
    domain: TemplateExample
    slot_uri: narad:example
    identifier: true
    alias: example
    owner: TemplateExample
    domain_of:
    - TemplateExample
    is_usage_slot: true
    usage_slot_name: example
    range: string
    required: true
  InstanceSignalBinding_is_instance_of:
    name: InstanceSignalBinding_is_instance_of
    definition_uri: https://example.org/narad_linkml/schema/narad/is_instance_of
    description: 'NARAD alias for rdf:type. Links a facility-specific instance node
      to the LinkML class or semantic class it instantiates. In the graph this edge
      is labelled narad:isInstanceOf. Values are typically the rdf:type of the Class
      that implements the signal binding.

      '
    in_subset:
    - relationship
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - rdf:type
    is_a: is_instance_of
    domain: InstanceSignalBinding
    slot_uri: narad:is_instance_of
    alias: is_instance_of
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: is_instance_of
    range: Signal
    multivalued: true
  InstanceSignalBinding_is_hosted_by:
    name: InstanceSignalBinding_is_hosted_by
    definition_uri: https://example.org/narad_linkml/schema/narad/is_hosted_by
    description: 'Links an InstanceSignalBinding to the FacilitySystem it belongs
      to. This is the edge that connects the facility-specific bindings to the Facility
      node in the graph.

      '
    in_subset:
    - relationship
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - ssn-system:hasSubSystem
    - ssn:isHostedBy
    is_a: is_hosted_by
    domain: InstanceSignalBinding
    slot_uri: narad:is_hosted_by
    alias: is_hosted_by
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: is_hosted_by
    range: string
    multivalued: false
  InstanceSignalBinding_is_property_of:
    name: InstanceSignalBinding_is_property_of
    definition_uri: https://example.org/narad_linkml/schema/narad/is_property_of
    description: 'Inverse of for_property: links the Class Signal to the Class of
      SignalBinding Procedure that implements it. This can also link the Instance
      of a SignalBinding to the ControlSystem that implements it. This is the edge
      that connects the signal definitions to the facility-specific bindings in the
      graph. Values are typically the ControlSystem that implements this binding,
      e.g. narad:epics (for EPICS control system). NOTE: The value of this slot must
      match one of the values in narad_config.has_sub_system.

      '
    in_subset:
    - relationship
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - ssn:isPropertyOf
    is_a: is_property_of
    domain: InstanceSignalBinding
    slot_uri: narad:is_property_of
    alias: is_property_of
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: is_property_of
    range: ControlSystem
    multivalued: false
  InstanceSignalBinding_for_property:
    name: InstanceSignalBinding_for_property
    definition_uri: https://example.org/narad_linkml/schema/narad/for_property
    description: "SystemCapability \u2192 Signal: the capability can expose, monitor,\
      \ control, or actuate that signal.\n"
    in_subset:
    - relationship
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:forProperty
    is_a: for_property
    domain: InstanceSignalBinding
    slot_uri: narad:for_property
    alias: for_property
    owner: InstanceSignalBinding
    domain_of:
    - InstanceSignalBinding
    is_usage_slot: true
    usage_slot_name: for_property
    range: SignalBinding
    multivalued: true
classes:
  NamedThing:
    name: NamedThing
    definition_uri: https://example.org/narad_linkml/schema/narad/NamedThing
    description: Abstract base class providing identity and human-readable metadata.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    abstract: true
    slots:
    - name
    - description
    class_uri: narad:NamedThing
  NaradModel:
    name: NaradModel
    definition_uri: https://example.org/narad_linkml/schema/narad/NaradModel
    description: Top-level NARAD document container.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - narad_config
    - beamlines
    - elements
    class_uri: narad:NaradModel
    tree_root: true
  NaradConfig:
    name: NaradConfig
    definition_uri: https://example.org/narad_linkml/schema/narad/NaradConfig
    description: 'A top-level NARAD-system container for the: capability layer + signal
      layer.'
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - ssn:Deployment
    slots:
    - NaradConfig_schema_version
    - intent
    - NaradConfig_deployed_system
    - NaradConfig_control_system
    - capability_layer
    - NaradConfig_device_layer
    - NaradConfig_signal_layer
    slot_usage:
      schema_version:
        name: schema_version
        description: Version of the NARAD schema used in this document.
        range: string
        required: true
      deployed_system:
        name: deployed_system
        description: Identifier of the deployed system this configuration describes.
        range: DeployedSystem
        required: true
        multivalued: false
        inlined: true
      control_system:
        name: control_system
        description: Identifier of the control system (e.g. epics) this configuration
          describes.
        range: ControlSystem
        required: true
        multivalued: false
      device_layer:
        name: device_layer
        description: Device Capability definitions keyed by capability name.
        range: Device
        required: true
        multivalued: true
        inlined: true
      signal_layer:
        name: signal_layer
        description: Signal-layer container for facility-specific signal bindings.
        range: SignalLayer
        required: true
        inlined: false
    class_uri: narad:NaradConfig
  CapabilityLayer:
    name: CapabilityLayer
    definition_uri: https://example.org/narad_linkml/schema/narad/CapabilityLayer
    description: Capability-layer container for control profile families.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - capabilities
    class_uri: narad:CapabilityLayer
  Capability:
    name: Capability
    definition_uri: https://example.org/narad_linkml/schema/narad/Capability
    description: A reusable device-type control profile that extends a generic shared
      capability with type-specific signals (e.g. QuadrupoleCurrentControlProfile).
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: NamedThing
    slots:
    - name
    - description
    - device_type
    - Capability_subclass_of
    - Capability_has_signal
    - Capability_is_property_of
    slot_usage:
      has_signal:
        name: has_signal
        required: true
      is_property_of:
        name: is_property_of
        description: Links the capability layer to the control systems it applies
          to via ssn:isPropertyOf.
        range: ControlSystem
        multivalued: false
        inlined: false
      subclass_of:
        name: subclass_of
        description: Links a type-specific capability to the generic capability it
          extends via rdfs:subClassOf.
        range: Capability
        multivalued: false
        inlined: false
    class_uri: narad:Capability
  SignalLayer:
    name: SignalLayer
    definition_uri: https://example.org/narad_linkml/schema/narad/SignalLayer
    description: Signal-layer container for facility-specific signal bindings.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - facilities
    class_uri: narad:SignalLayer
  FacilitySystem:
    name: FacilitySystem
    definition_uri: https://example.org/narad_linkml/schema/narad/FacilitySystem
    description: Facility-specific signal binding configuration.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: System
    slots:
    - name
    - description
    - system_type
    - System_has_sub_system
    - System_has_system_capability
    - has_control_system
    - hosts_device
    class_uri: narad:FacilitySystem
  FacilityIdentifier:
    name: FacilityIdentifier
    definition_uri: https://example.org/narad_linkml/schema/narad/FacilityIdentifier
    description: A globally unique identifier for an entity (e.g., facility), with
      a specified type (e.g. DOI, ROR, ARK, local).
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - identifier_type
    - identifier_value
    class_uri: narad:FacilityIdentifier
  SignalBinding:
    name: SignalBinding
    definition_uri: https://example.org/narad_linkml/schema/narad/SignalBinding
    description: A named control system suffix definition for one semantic signal.
      The suffix is used within in a template naming convention to construct the full
      control system PV name for a given device instance.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: NamedThing
    slots:
    - name
    - description
    - signal_code_suffix
    class_uri: narad:SignalBinding
  Beamline:
    name: Beamline
    definition_uri: https://example.org/narad_linkml/schema/narad/Beamline
    description: A top-level NARAD-system for an ordered sequence of beamline elements
      defining a beam path.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - pals:BeamLine
    is_a: NamedThing
    slots:
    - name
    - description
    - multipass
    - length
    - zero_point
    - periodic
    - line
    class_uri: narad:Beamline
  BeamlineElement:
    name: BeamlineElement
    definition_uri: https://example.org/narad_linkml/schema/narad/BeamlineElement
    description: A single element in a beamline with its kind and optional NARAD capability
      annotations.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - pals:Element
    is_a: NamedThing
    slots:
    - name
    - description
    - BeamlineElement_is_instance_of
    - length
    - BeamlineElement_is_observed_by
    - param_set
    slot_usage:
      is_instance_of:
        name: is_instance_of
        range: ElementKindEnum
        multivalued: false
      is_observed_by:
        name: is_observed_by
        range: InstanceSignalBinding
    class_uri: narad:BeamlineElement
  System:
    name: System
    definition_uri: https://example.org/narad_linkml/schema/narad/System
    description: 'A physical, logical, or cyber-physical system involved in sensing,
      monitoring, control, or actuation. Broadly aligned to ssn:System.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:System
    is_a: NamedThing
    slots:
    - name
    - description
    - system_type
    - System_has_sub_system
    - System_has_system_capability
    slot_usage:
      has_sub_system:
        name: has_sub_system
        range: System
        inlined_as_list: true
      has_system_capability:
        name: has_system_capability
        range: SystemCapability
        multivalued: true
        inlined: true
    class_uri: narad:System
  DeployedSystem:
    name: DeployedSystem
    definition_uri: https://example.org/narad_linkml/schema/narad/DeployedSystem
    description: 'A deployed system, with an identified facility, that is the subject
      of a NARAD configuration.  This is the child of the target of the narad_config.deployed_system
      slot. In the SSN graph a DeployedSystem is a broad mapping to the ssn:Deployment
      and also is equivalent to the signal_layers.facilities entries.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - ssn:Deployment
    - ssn-system:System
    is_a: System
    slots:
    - name
    - description
    - System_has_sub_system
    - facility_identifier
    - DeployedSystem_has_control_system
    - DeployedSystem_system_type
    - DeployedSystem_has_system_capability
    slot_usage:
      system_type:
        name: system_type
        description: High-level system type for classification and querying - set
          to Facility for all DeployedSystem instances.
        range: SystemTypeEnum
      has_control_system:
        name: has_control_system
        required: false
      has_system_capability:
        name: has_system_capability
        required: true
        multivalued: true
    class_uri: narad:DeployedSystem
  ControlSystem:
    name: ControlSystem
    definition_uri: https://example.org/narad_linkml/schema/narad/ControlSystem
    description: 'A control system (e.g. EPICS) that manages device process variables.
      In the SSN graph a ControlSystem is a subsystem of the Facility.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:System
    is_a: System
    slots:
    - name
    - description
    - ControlSystem_has_naming_convention
    - ControlSystem_system_type
    - ControlSystem_has_sub_system
    - ControlSystem_has_system_capability
    slot_usage:
      has_naming_convention:
        name: has_naming_convention
        range: NamingConvention
        multivalued: true
        inlined: true
      system_type:
        name: system_type
        description: High-level system type for classification and querying - set
          to ControlSystem for all ControlSystem instances.
        range: SystemTypeEnum
      has_sub_system:
        name: has_sub_system
        required: false
      has_system_capability:
        name: has_system_capability
        required: false
    class_uri: narad:ControlSystem
  Device:
    name: Device
    definition_uri: https://example.org/narad_linkml/schema/narad/Device
    description: 'A system representing a beam diagnostic instrument, magnet, or other
      non-magnet device. It represents the instrument as a whole rather than the control
      system for that instrument. In the SSN graph a Device is a subsystem of the
      Facility and a sibling to the ControlSystem. Also used in the SignalLayer to
      group signal bindings by device type. Aligned to ssn:System.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:System
    broad_mappings:
    - pals:Element
    is_a: System
    slots:
    - name
    - description
    - system_type
    - Device_device_type
    - has_sub_system
    - subclass_of
    - has_system_capability
    - Device_is_observed_by
    - Device_has_sub_system
    - Device_has_system_capability
    slot_usage:
      device_type:
        name: device_type
        required: true
      is_observed_by:
        name: is_observed_by
        multivalued: true
        inlined: true
      has_sub_system:
        name: has_sub_system
        range: System
        multivalued: true
        inlined_as_list: true
      has_system_capability:
        name: has_system_capability
        range: SystemCapability
        multivalued: false
        inlined: false
    class_uri: narad:Device
  NamingConventionExample:
    name: NamingConventionExample
    definition_uri: https://example.org/narad_linkml/schema/narad/NamingConventionExample
    description: 'An example of a control system naming convention, illustrating how
      the template is used to generate full control system PV names from semantic
      signal names and device instance information.  This can be used to provide concrete
      examples of the expected PV naming convention for different device types and
      signals based on the defined NamingConvention template.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - NamingConventionExample_example
    - description
    slot_usage:
      example:
        name: example
        identifier: true
    class_uri: narad:NamingConventionExample
  Instrument:
    name: Instrument
    definition_uri: https://example.org/narad_linkml/schema/narad/Instrument
    description: A generic beam diagnostic instrument.
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn:System
    is_a: System
    slots:
    - name
    - description
    - system_type
    - System_has_sub_system
    - System_has_system_capability
    class_uri: narad:Instrument
  SystemCapability:
    name: SystemCapability
    definition_uri: https://example.org/narad_linkml/schema/narad/SystemCapability
    description: 'A capability of a system. SystemCapability describes what a system
      can expose, monitor, control, or actuate with respect to one or more signals.
      Aligned to ssn-system:SystemCapability; linked from System instances via ssn-system:hasSystemCapability,
      and from Signals via ssn:forProperty. Profile-level inheritance (shared vs.
      type-specific signals) is expressed in CapabilityProfile, not here.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    exact_mappings:
    - ssn-system:SystemCapability
    is_a: NamedThing
    slots:
    - name
    - description
    - SystemCapability_for_property
    - device_type
    slot_usage:
      for_property:
        name: for_property
        multivalued: true
    class_uri: narad:SystemCapability
  NamingConvention:
    name: NamingConvention
    definition_uri: https://example.org/narad_linkml/schema/narad/NamingConvention
    description: 'A template for constructing facility-specific signal names from
      a semantic signal name and a control-system-specific suffix.  The template is
      used to generate the full control system PV name for a given device instance
      and semantic signal by substituting the device name and signal code suffix into
      the template.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: NamedThing
    slots:
    - name
    - description
    - template
    - template_components
    - full_pattern
    - examples
    class_uri: narad:NamingConvention
  TemplateComponent:
    name: TemplateComponent
    definition_uri: https://example.org/narad_linkml/schema/narad/TemplateComponent
    description: 'A component of a naming convention template, representing a variable
      part of the control system PV name that is substituted based on the device instance
      and signal definition.  For example, in the template "{device_name}{signal_code_suffix}",
      "device_name" and "signal_code_suffix" would be TemplateComponents that are
      replaced with the actual device name and signal code suffix for each specific
      binding.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    is_a: NamedThing
    slots:
    - name
    - description
    - required
    - pattern
    class_uri: narad:TemplateComponent
  TemplateExample:
    name: TemplateExample
    definition_uri: https://example.org/narad_linkml/schema/narad/TemplateExample
    description: 'An example of a control system PV name generated from a naming convention
      template, along with a description of what it represents.  This can be used
      to illustrate how the template works in practice and to provide concrete examples
      of the expected PV naming convention for different device types and signals.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    slots:
    - TemplateExample_example
    - description
    slot_usage:
      example:
        name: example
        identifier: true
    class_uri: narad:TemplateExample
  Signal:
    name: Signal
    definition_uri: https://example.org/narad_linkml/schema/narad/Signal
    description: 'Domain term for a control-system signal. A Signal represents an
      identifiable quantity, state, setpoint, readback, limit, or status. In SSN/SOSA
      alignment, NARAD Signals are treated as properties of systems (ssn:forProperty).
      The concrete facility binding is captured in SignalBinding.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    aliases:
    - epics_pv
    - pv
    - process_variable
    - EPICS Process Variable
    - control signal
    - control-system signal
    broad_mappings:
    - sosa:Property
    - ssn:Property
    - qudt:QuantityKind
    is_a: NamedThing
    slots:
    - name
    - description
    - role
    - data_type
    - units
    - units_uri
    class_uri: narad:Signal
  ObservableSignal:
    name: ObservableSignal
    definition_uri: https://example.org/narad_linkml/schema/narad/ObservableSignal
    description: 'A NARAD signal that is read, monitored, observed, or exposed by
      a system. Examples: current_readback, status, horizontal_beam_position, gradient_readback.
      Aligned to sosa:ObservableProperty.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - sosa:ObservableProperty
    is_a: Signal
    slots:
    - name
    - description
    - role
    - data_type
    - units
    - units_uri
    class_uri: narad:ObservableSignal
  ActuatableSignal:
    name: ActuatableSignal
    definition_uri: https://example.org/narad_linkml/schema/narad/ActuatableSignal
    description: 'A NARAD signal that can be commanded, set, or acted upon. Examples:
      current_setpoint, strength_setpoint, kick_setpoint, field_setpoint, current_min,
      current_max, gradient_setpoint. Aligned to sosa:ActuatableProperty.

      '
    from_schema: https://w3id.org/narad_linkml/schema/narad/system
    broad_mappings:
    - sosa:ActuatableProperty
    is_a: Signal
    slots:
    - name
    - description
    - role
    - data_type
    - units
    - units_uri
    class_uri: narad:ActuatableSignal
  InstanceSignalBinding:
    name: InstanceSignalBinding
    definition_uri: https://example.org/narad_linkml/schema/narad/InstanceSignalBinding
    description: "A facility-specific binding between a NARAD Signal and an implementation\
      \ interface (e.g. an EPICS process variable). Modeled as sosa:Sensor because\
      \ it describes how a signal is observed, monitored, or actuated. ssn:forProperty\
