 syntax="proto3";
 package
// metamodel_version: 1.7.0
// A NARAD signal that can be commanded, set, or acted upon. Examples: current_setpoint, strength_setpoint, kick_setpoint, field_setpoint, current_min, current_max, gradient_setpoint. Aligned to sosa:ActuatableProperty.
// 
message ActuatableSignal
 {
  string name = 0
  string description = 0
  signalRoleEnum role = 0
  dataTypeEnum dataType = 0
  string units = 0
  uriorcurie unitsUri = 0
 }
// An ordered sequence of beamline elements defining a beam path.
message Beamline
 {
  string name = 0
  string description = 0
  string beamlineKind = 0
 repeated  beamlineElement line = 0
 }
// A single element in a beamline with its kind and optional NARAD capability annotations.
message BeamlineElement
 {
  string name = 0
  string description = 0
  elementKindEnum elementKind = 0
  float length = 0
  controlProfileFamily capabilityProfileFamily = 0
  capabilityProfile capabilityProfile = 0
 repeated  instanceSignalBinding instanceSignalBindings = 0
 repeated  elementParamSet paramSet = 0
  facilityParamSet facilityParamSet = 0
 }
// A Beam Position Monitor.
message BPM
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// BPM-specific capability with horizontal and vertical position readback signals.
message BPMCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// BPM-specific signal bindings.
message BPMSignalSet
 {
  signalBinding horizontalBeamPosition = 0
  signalBinding verticalBeamPosition = 0
  signalBinding status = 0
 }
// A named, shared grouping of semantically related signals for a control aspect (e.g. MagnetCurrentControlCapability).
message Capability
 {
  string name = 0
  string description = 0
 repeated  signal signals = 0
 }
// Capability-layer container for control profile families.
message CapabilityLayer
 {
 repeated  controlProfileFamily profiles = 0
 }
// A device-type profile that reuses shared capabilities and adds type-specific ones (e.g. QuadrupoleProfile).
message CapabilityProfile
 {
  string name = 0
  string description = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 repeated  capability inheritsSharedCapabilities = 0
 repeated  typeSpecificCapability typeSpecificCapabilities = 0
 }
// RF cavity capability with gradient control, readback, and status signals.
message CavityGradientCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// A reusable family of control profiles sharing common semantics and structure (e.g. MagnetCurrentControlProfileFamily).
message ControlProfileFamily
 {
  string name = 0
  string description = 0
  deviceDomainEnum deviceDomain = 0
 repeated  capability sharedCapabilities = 0
 repeated  capabilityProfile typeProfiles = 0
 }
// A control system (e.g. EPICS) that manages device process variables. In the SSN graph a ControlSystem is a subsystem of the Facility.
// 
message ControlSystem
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// A dipole corrector magnet for orbit correction.
message Corrector
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// Corrector-specific capability extending MagnetCapability with kick signals.
message CorrectorCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// Corrector-specific signal bindings.
message CorrectorSignalSet
 {
  signalBinding kickSetpoint = 0
 }
// A dipole bending magnet.
message Dipole
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// Dipole-specific capability extending MagnetCapability with bend-field signals.
message DipoleCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// Dipole-specific signal bindings.
message DipoleSignalSet
 {
  signalBinding fieldSetpoint = 0
 }
// Named physics-parameter block for a beamline element. The name identifies the block type (e.g. RFP, BendP, MagneticMultipoleP, SolenoidP).
message ElementParamSet
 {
  string name = 0
  string description = 0
  float frequency = 0
  float voltage = 0
  float phase = 0
  float angleRef = 0
  float e1 = 0
  float e2 = 0
  float kn1 = 0
  float ksol = 0
 }
// Facility-specific signal binding configuration.
message FacilityConfig
 {
  string name = 0
  string description = 0
 repeated  facilityIdentifier facilityIdentifier = 0
  string controlSystem = 0
  string namingConvention = 0
  signalDefinitions signalDefinitions = 0
 }
// A globally unique identifier for an entity (e.g., facility), with a specified type (e.g. DOI, ROR, ARK, local).
message FacilityIdentifier
 {
  identifierTypeEnum identifierType = 0
  string identifierValue = 0
 }
// Facility-specific element parameters block for beamline elements.
message FacilityParamSet
 {
  string facilityElementType = 0
  string modeledAs = 0
  anyValue properties = 0
 }
// A facility-specific binding between a NARAD Signal and an implementation interface (e.g. an EPICS process variable). Modeled as sosa:Sensor because it describes how a signal is observed, monitored, or actuated. ssn:forProperty → Signal; narad:isInstanceOf → the capability class.
// 
message InstanceSignalBinding
 {
  string name = 0
  string description = 0
 repeated  uriorcurie isInstanceOf = 0
 repeated  uriorcurie isHostedBy = 0
  uriorcurie isPropertyOf = 0
  string pvName = 0
 }
// A generic beam diagnostic instrument.
message Instrument
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// Generic instrument capability (position readback and status signals).
message InstrumentCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// A powered magnet device (generic supertype for all magnet kinds).
message Magnet
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// Generic magnet capability (current control and readback signals).
message MagnetCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// Shared magnet signal bindings.
message MagnetSignalSet
 {
  signalBinding currentSetpoint = 0
  signalBinding currentReadback = 0
  signalBinding currentMin = 0
  signalBinding currentMax = 0
  signalBinding status = 0
 }
// A zero-length reference point, drift space, or survey marker.
message Marker
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// NARAD configuration block: capability layer + signal layer.
message NaradConfig
 {
  string schemaVersion = 0
  string intent = 0
  capabilityLayer capabilityLayer = 0
  string facility = 0
  string controlSystem = 0
  signalLayer signalLayer = 0
 }
// Top-level NARAD document container.
message NaradModel
 {
  naradConfig naradConfig = 0
 repeated  beamline beamlines = 0
 repeated  beamlineElement elements = 0
 }
// A NARAD signal that is read, monitored, observed, or exposed by a system. Examples: current_readback, status, horizontal_beam_position, gradient_readback. Aligned to sosa:ObservableProperty.
// 
message ObservableSignal
 {
  string name = 0
  string description = 0
  signalRoleEnum role = 0
  dataTypeEnum dataType = 0
  string units = 0
  uriorcurie unitsUri = 0
 }
// A quadrupole focusing/defocusing magnet.
message Quadrupole
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// Quadrupole-specific capability extending MagnetCapability with strength signals.
message QuadrupoleCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// Quadrupole-specific signal bindings.
message QuadrupoleSignalSet
 {
  signalBinding strengthSetpoint = 0
 }
// A radio-frequency accelerating or bunching cavity.
message RFCavity
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// RF cavity-specific signal bindings.
message RFCavitySignalSet
 {
  signalBinding gradientSetpoint = 0
  signalBinding gradientReadback = 0
  signalBinding status = 0
 }
// Domain term for a control-system signal. A Signal represents an identifiable quantity, state, setpoint, readback, limit, or status. In SSN/SOSA alignment, NARAD Signals are treated as properties of systems (ssn:forProperty). The concrete facility binding is captured in SignalBinding.
// 
message Signal
 {
  string name = 0
  string description = 0
  signalRoleEnum role = 0
  dataTypeEnum dataType = 0
  string units = 0
  uriorcurie unitsUri = 0
 }
// A named EPICS suffix definition for one semantic signal.
message SignalBinding
 {
  string description = 0
  string controlSystemSuffix = 0
 }
// EPICS signal suffix templates keyed by device type or device domain. Domain-level keys (e.g. Magnet, RFCavity) cover signals shared across all types in that domain; device-type keys are type-specific.
message SignalDefinitions
 {
  typeSignalSet typeSignalSets = 0
 }
// Signal-layer container for facility-specific signal bindings.
message SignalLayer
 {
 repeated  facilityConfig facilities = 0
 }
// A solenoid magnet.
message Solenoid
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// Solenoid-specific capability extending MagnetCapability with focusing signals.
message SolenoidCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// A physical, logical, or cyber-physical system involved in sensing, monitoring, control, or actuation. Broadly aligned to ssn:System.
// 
message System
 {
  string name = 0
  string description = 0
 repeated  system hasSubSystem = 0
 repeated  systemCapability hasSystemCapability = 0
 }
// A capability of a system. SystemCapability describes what a system can expose, monitor, control, or actuate with respect to one or more signals. Aligned to ssn-system:SystemCapability; linked from System instances via ssn-system:hasSystemCapability, and from Signals via ssn:forProperty. Profile-level inheritance (shared vs. type-specific signals) is expressed in CapabilityProfile, not here.
// 
message SystemCapability
 {
  string name = 0
  string description = 0
 repeated  signal forProperty = 0
  elementKindEnum deviceType = 0
  boolean isAbstract = 0
 }
// Explicit signal binding groups keyed by device domain or device type.
message TypeSignalSet
 {
  magnetSignalSet magnetSignals = 0
  quadrupoleSignalSet quadrupoleSignals = 0
  correctorSignalSet correctorSignals = 0
  dipoleSignalSet dipoleSignals = 0
  bPMSignalSet bpmSignals = 0
  rFCavitySignalSet rfcavitySignals = 0
 }
// An inline capability declared within a device-type profile that extends a generic shared Capability. The explicit link to the shared Capability being extended is given by inherits_from. Adds type-specific signals on top of those already defined in the referenced shared Capability.
message TypeSpecificCapability
 {
  string name = 0
  string description = 0
 repeated  signal signals = 0
 }
