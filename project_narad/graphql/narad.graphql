# metamodel_version: 1.7.0
# version: 0.1.0
enum DataTypeEnum
  {
    None
    int
    float
    double
    string
    boolean
    boolean_non_null
    date
    coded_value
  }

enum DeviceDomainEnum
  {
    Magnet
    Instrument
    RFCavity
  }

enum ElementKindEnum
  {
    Drift
    Marker
    BPM
    Corrector
    Dipole
    Quadrupole
    Solenoid
    RFCavity
    Instrument
  }

enum IdentifierTypeEnum
  {
    doi
    ark
    handle
    url
    local
    other
  }

enum NodeTypeEnum
  {
    Device
    CapabilityFamily
    Profile
    Capability
    TypeSpecificCapability
    Signal
    Facility
    ControlSystem
    SignalBinding
  }

enum RelationshipTypeEnum
  {
    has_shared_capability
    has_type_profile
    inherits_capability
    has_type_specific_capability
    has_signal
    implemented_by
    binds_to
    located_in
    controlled_by
    before
    after
  }

enum SignalRoleEnum
  {
    control
    readback
    constraint
    status
    interlock
    diagnostic
  }

scalar AnyValue

type Beamline
  {
    beamlineName: String!
    kind: String
    line: [String]
  }

type BeamlineElement
  {
    name: String!
    kind: ElementKindEnum
    length: Float
    rFP: RFParams
    bendP: BendParams
    magneticMultipoleP: MagneticMultipoleParams
    solenoidP: SolenoidParams
    narad: ElementNaradRef
    facilityParams: FacilityParams
  }

type BendParams
  {
    angleRef: Float
    e1: Float
    e2: Float
  }

type Capability implements CapabilityMixin
  {
    name: String!
    description: String
    signals: [Signal]
  }

type CapabilityLayer
  {
    defaultGraphProjection: GraphProjection
    profiles: [ControlProfileFamily]
  }

interface CapabilityMixin
  {
    description: String
    signals: [Signal]
  }

type CapabilityProfile
  {
    name: String!
    deviceType: ElementKindEnum
    description: String
    isAbstract: Boolean
    inheritsSharedCapabilities: [Capability]
    typeSpecificCapabilities: [TypeSpecificCapability]
  }

type ControlProfileFamily
  {
    name: String!
    deviceDomain: DeviceDomainEnum
    description: String
    sharedCapabilities: [Capability]
    typeProfiles: [CapabilityProfile]
    graphProjection: GraphProjection
  }

type DeviceTypeSignalSet
  {
    name: String!
    signalBindings: [SignalBinding]
  }

type ElementNaradRef
  {
    capabilityProfileFamily: ControlProfileFamily
    capabilityProfile: CapabilityProfile
    signalBindings: [PVBinding]
  }

type Facility
  {
    name: String!
    identifier: [Identifier]
    controlSystem: String
    namingConvention: String
    signalDefinitions: SignalDefinitions
  }

type FacilityParams
  {
    facilityElementType: String
    modeledAs: String
    properties: AnyValue
  }

type GraphProjection
  {
    nodeLabels: NodeLabels
    relationships: [Relationship]
  }

type Identifier
  {
    identifierType: IdentifierTypeEnum
    identifierValue: String
  }

type MagneticMultipoleParams
  {
    kn1: Float
  }

type NaradConfig
  {
    schemaVersion: String
    intent: String
    capabilityLayer: CapabilityLayer
    facility: String
    controlSystem: String
    signalLayer: SignalLayer
  }

type NaradModel
  {
    narad: NaradConfig
    beamlines: [Beamline]
    elements: [BeamlineElement]
  }

type NodeLabels
  {
    capabilityFamily: String
    profile: String
    capability: String
    signal: String
  }

type PVBinding
  {
    name: String!
    facility: String
    controlSystem: String
    pv: String
  }

type Relationship
  {
    id: String!
    domain: NodeTypeEnum
    range: NodeTypeEnum!
    subpropertyOf: [Relationship]
    inverseOf: Relationship
    symmetric: Boolean
    transitive: Boolean
    asymmetric: Boolean
    irreflexive: Boolean
    rangeTarget: String!
  }

type RFParams
  {
    frequency: Float
    voltage: Float
    phase: Float
  }

type Signal
  {
    name: String!
    role: SignalRoleEnum
    dataType: DataTypeEnum
    units: String
    unitsUri: String
    description: String
  }

type SignalBinding
  {
    name: String!
    epicsSuffix: String
    description: String
  }

type SignalDefinitions
  {
    typeSignalSets: [DeviceTypeSignalSet]
  }

type SignalLayer
  {
    facilities: [Facility]
  }

type SolenoidParams
  {
    ksol: Float
  }

type TypeSpecificCapability implements CapabilityMixin
  {
    id: String!
    capabilityClass: String
    classCurie: String
    description: String
    signals: [Signal]
  }
