      - magnet current readback
      - current feedback
      - readback
    description: Measured magnet current.
    observes: 
      - HCorrector
      - VCorrector
    has_signal_role: Readback
    has_canonical_signal_type: MagnetCurrentReadback
    has_quantity_kind: ElectricCurrent
    has_data_type: Float
    has_unit: A
  current_min:
    type: ControlSystemSignal
    has_synonyms:
      - magnet current min
      - min current
      - minimum current
      - minimum current limit
      - min limit
      - limit
    description: Minimum allowed magnet current.
    observes: 
      - HCorrector
      - VCorrector
    has_signal_role: Limit
    has_canonical_signal_type: MagnetCurrent
    has_quantity_kind: ElectricCurrent
    has_data_type: Float
    has_unit: A
  current_max:
    type: ControlSystemSignal
    has_synonyms:
      - magnet current max
      - max current
      - maximum current
      - maximum current limit
      - max limit
      - limit
    description: Maximum allowed magnet current.
    observes: 
      - HCorrector
      - VCorrector
    has_signal_role: Limit
    has_canonical_signal_type: MagnetCurrent
    has_quantity_kind: ElectricCurrent
    has_data_type: Float
    has_unit: A
  magnet_status:
    type: ControlSystemSignal
    has_synonyms:
      - corrector_status
