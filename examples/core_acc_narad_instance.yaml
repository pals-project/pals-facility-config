    has_beamline_relation: Inline
    has_function: Mark
    has_parameters: # need to add these
      - SegMask
      - pCentral
signals:
  kick_setpoint:
    type: ControlSystemSignal
    has_synonyms:
      - integrated field setpoint
      - integrated kick setpoint
      - setpoint
      - kick
      - corrector strength
      - setting
    description: Desired integrated corrector kick or equivalent model quantity.
    observes: 
      - HCorrector # DM: should this be the LinkML Classes (e.g. Corrector), the physical_component in this yaml file (e.g. HCorrector), or the specific component instances like MBHK101H?
      - VCorrector # SM: Same question for this one
    has_signal_role: Setpoint
    has_canonical_signal_type: IntegratedFieldSetpoint
    has_quantity_kind: IntegratedMagneticField
    has_data_type: Float
    has_unit: T_m
  strength_setpoint:
    type: ControlSystemSignal
    has_synonyms:
      - strength setpoint
      - setpoint
      - strength
      - magnet strength
      - setting
    description: Desired magnet strength setpoint, such as k1 for a quadrupole.
    observes: 
      - Quadrupole
    has_signal_role: Setpoint
    has_canonical_signal_type: MagnetCurrentSetpoint
    has_quantity_kind: ElectricCurrent
    has_data_type: Float
    has_unit: G_per_cm # I added this to the UnitEnum. Is this correct?
  field_setpoint:
    type: ControlSystemSignal
    has_synonyms:
      - field setpoint
      - setpoint
      - field
      - field strength
      - magnetic field
      - setting
    description: Desired magnetic field setpoint, such as for a dipole.
    observes: 
      - Dipole # DM: should this be the LinkML Classes (e.g. Magnet, unless we add Multipole/Dipole), the physical_component in this yaml file (e.g. Dipole), or the specific component instances like MDSK201?
    has_signal_role: Setpoint
    has_canonical_signal_type: MagnetFieldSetpoint
    has_quantity_kind: MagneticField
    has_data_type: Float
    has_unit: unit:PER-T-M 
  current_setpoint:
    type: ControlSystemSignal
    has_synonyms:
      - magnet_current_setpoint
      - current_command
    description: Desired magnet current command.
    observes: 
      - HCorrector
      - VCorrector
    has_signal_role: Setpoint
    has_canonical_signal_type: MagnetCurrentSetpoint
    has_quantity_kind: ElectricCurrent
    has_data_type: Float
    has_unit: A
  current_readback:
    type: ControlSystemSignal
