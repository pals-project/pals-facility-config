beamlines:
  GUN_thru_MV:
    type: Beamline
    multipass: false
    line:
    - RF_LASER
    - D0
    - S_IS_20CM:
      type: VirtualComponentBinding
      in_region: K1
      description: >-
        Virtual component representing the location of the 20 cm diagnostic screen in the G
        UN_thru_MV beamline at the UITF. This is a virtual component because it doesn't correspond to a physical device, but it is important for understanding the beamline structure and for defining the locations of signals and other components in relation to the beamline.
      instance_of_component: Marker
      has_parameter_bindings:
        SegMask:
          type: ParameterBinding
          instance_of_parameter: SegMask
          value: S_UITF+S_KV+A_UITF+A_KV
        pCentral:
          type: ParameterBinding
          instance_of_parameter: PCentral
          has_data_type: Float
          value: .465144443755972 # changed the value from an explicit string to float
    - D1
    - IPMK101:
        type: PhysicalComponentBinding
        in_region: K1
        description: >-
          IPMK101 BPM monitor in the K1 region of the GUN_thru_MV beamline at the UITF.
          Is in the KV section of the beamline.
        instance_of_component: BeamPositionMonitor
        has_signal_bindings:
          - horizontal_beam_position:
              type: SignalBinding
              instance_of_signal: horizontal_beam_position
              native_identifier: IPMK101.XPOS
              source_system: EPICS
              native_description: >-
                EPICS PV for the horizontal beam position readback signal from the IPMK101 BPM in the GUN_thru_MV beamline at the UITF.
              native_unit: mm
              access_protocol:
              archive_identifier:
          - vertical_beam_position:
              type: SignalBinding
              instance_of_signal: vertical_beam_position
              native_identifier: IPMK101.YPOS
              source_system: EPICS
              native_description: >-
