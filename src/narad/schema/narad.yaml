id: https://w3id.org/accelerator-core
name: accelerator_core
title: Accelerator Core Ontology
description: >-
  A lightweight LinkML schema for facility-agnostic accelerator components,
  their beamline relationships, and associated control-system signals.
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  narad: https://example.org/narad/
  linkml: https://w3id.org/linkml/
  acc: https://example.org/accelerator-core/
  unit: http://qudt.org/vocab/unit/
  quantitykind: http://qudt.org/vocab/quantitykind/
  sosa: http://www.w3.org/ns/sosa/
  RO: http://purl.obolibrary.org/obo/RO_
  BFO: http://purl.obolibrary.org/obo/BFO_
  saref: https://saref.etsi.org/core/v4.1.1/
  pals: https://pals-project.readthedocs.io/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: narad # DM: changed to narad
default_range: string

imports:
  - linkml:types

# NOTE WHEN GENERATING RDF/OWL:
# mixins vs. is_a: by default, both edges look identical in plain OWL 
# — there's no structural distinction between "true" taxonomic parent and mixin trait unless you intervene. 
# This is why the --mixins-as-expressions argument exists: 
# it keeps the subClassOf backbone limited to pure is_a edges, 
# and re-expresses mixin relationships as existential restrictions (mixins some HasAssetInfo) via GCI axioms instead. 
# Otherwise, mixins change the shape of the class graph, and you have a generator flag to control which shape you get.

# REGARDING the unit for parameters: this will need to be a step in the alignment because UITF parameter units may not match PALS expected units
# Example is pCentral which may be MeV (UITF) or GeV (CEBAF) but PALS expects eV. This is a known issue and will need to be addressed in the future.

slots:
  id:
    identifier: true
    required: true
    range: string
    slot_uri: narad:id
    description: A unique identifier for the instance.

  type:
    required: true
    range: Component
    slot_uri: narad:type
    description: The LinkML class name of this instance.
  
  subject:
    relational_role: SUBJECT
    slot_uri: rdf:subject
    required: true

  predicate:
    relational_role: PREDICATE
    slot_uri: rdf:predicate
    required: true

  object:
    relational_role: OBJECT
    slot_uri: rdf:object
    required: true

classes:

  #---- Root Class ----------------------------------------------------------
  NARAD:
    description: Root container for accelerator core components, semantic signals, and local bindings.
    tree_root: true
    attributes:
      description:
        description: Human-readable description for the representation of a particle accelerator and its operations.
        range: string
      physical_components:
        description: A list of physical components in the accelerator system.
        range: PhysicalComponent
        multivalued: true
        inlined_as_list: true
      virtual_components:
        description: A list of virtual components in the accelerator system.
        range: VirtualComponent
        multivalued: true
        inlined_as_list: true
      beamlines:
        description: A list of beamlines in the accelerator system.
        range: Beamline
        multivalued: true
        inlined_as_list: true
      supporting_facility_components:
        description: A list of supporting facility components in the accelerator system.
        range: SupportingFacilityComponent
        multivalued: true
        inlined_as_list: true
      signals:
        description: A list of signals in the accelerator system.
        range: Signal
        multivalued: true
        inlined_as_list: true
      signal_bindings:
        description: A list of signal bindings in the accelerator system (Component <-> Signal relationships).
        range: SignalBinding
        multivalued: true
        inlined_as_list: true
      component_relations:
        description: A list of component relations in the accelerator system (Component <-> Component relationships).
        range: ComponentRelation
        multivalued: true
        inlined_as_list: true
    slots:
      - type
  
  # --- Mixin classes ----------------------------------------------------------
  MetaP:
    mixin: true
    description: Mixin class for metadata parameters that are aligned with PALS MetaP (Metadata Parameters) for interoperability with the Particle Accelerator Language Standard (PALS).
    attributes:
      description:
        description: Human-readable description.
        range: string
        slot_uri: pals:description
      label:
        description: A label string. 
        range: string
        slot_uri: pals:label
      alias:
        description: An alternative name or identifier for the instance.
        range: string
        slot_uri: pals:alias
      additional_metadata:
        description: Additional metadata or annotations for the instance.
        range: MetadataEntry
        multivalued: true
        inlined_as_list: true
        inlined: true
    broad_mappings:
      - pals:MetaP
  
  FloorP:
    mixin: true
    description: >-
      Mixin class for floor plan parameters that are aligned with PALS FloorP (Floor Plan Parameters) 
      for interoperability with the Particle Accelerator Language Standard (PALS).
    attributes:
      x:
        description: Global X coordinate in the facility floor plan.
        range: float
        slot_uri: pals:x
        aliases:
          - x_coordinate
          - ModelX
          - x coordinate
      y:
        description: Global Y coordinate in the facility floor plan.
        range: float
        slot_uri: pals:y
        aliases:
          - y_coordinate
          - ModelY
          - y coordinate
      z:
        description: Global Z coordinate in the facility floor plan.
        range: float
        slot_uri: pals:z
        aliases:
          - z_coordinate
          - ModelZ
          - z coordinate
      theta:
        description: Orientation angle around the Y-axis in the facility floor plan.
        range: float
        slot_uri: pals:theta
        aliases:
          - theta_angle
          - ModelYaw
          - Model_Yaw
      phi:
        description: Rotation around the X-axis in the facility floor plan.
        range: float
        slot_uri: pals:phi
        aliases:
          - phi_angle
          - ModelPitch
          - Model_Pitch
      psi:
        description: Rotation around the Z-axis in the facility floor plan.
        range: float
        slot_uri: pals:psi
        aliases:
          - psi_angle
          - Model_Roll
          - Rotation
    broad_mappings:
      - pals:FloorP
  
  BodyShiftP:
    mixin: true
    description: >-
      Mixin class for floor plan shift parameters that are aligned with PALS BodyShiftP (Floor Plan Shift Parameters) 
      for interoperability with the Particle Accelerator Language Standard (PALS).
    attributes:
      x_offset:
        description: Shift in the X direction in the facility floor plan.
        range: float
        slot_uri: pals:x_offset
        aliases:
          - delta_x
          - x_shift
          - GlobalOffsetX
      y_offset:
        description: Shift in the Y direction in the facility floor plan.
        range: float
        slot_uri: pals:y_offset
        aliases:
          - delta_y
          - y_shift
          - GlobalOffsetY
      z_offset:
        description: Shift in the Z direction in the facility floor plan.
        range: float
        slot_uri: pals:z_offset
        aliases:
          - delta_z
          - z_shift
          - GlobalOffsetZ
      x_rot:
        description: Rotation around the X-axis in the facility floor plan.
        range: float
        slot_uri: pals:x_rot
        aliases:
          - delta_phi
          - phi_shift
          - GlobalOffsetPhi
      y_rot:
        description: Rotation around the Y-axis in the facility floor plan.
        range: float
        slot_uri: pals:y_rot
        aliases:
          - delta_theta
          - theta_shift
          - GlobalOffsetTheta
      z_rot:
        description: Rotation around the Z-axis in the facility floor plan.
        range: float
        slot_uri: pals:z_rot
        aliases:
          - delta_psi
          - psi_shift
          - GlobalOffsetPsi
    broad_mappings:
      - pals:BodyShiftP
  
  HasLongitudinalPlacement:
    mixin: true
    description: >-
      Mixin for an element's extent and position along the longitudinal (beam-direction, "s") axis. 
      
      Corresponds to PALS's ungrouped element parameters `length` and `s_position`.

      One (or both) `length` or `s_position` must be present.
    attributes:
      length:
        description: Length of the element (arc length for bends).
        range: float
        slot_uri: pals:length
        unit:
          ucum_code: m
      s_position:
        description: Longitudinal position of the element along the beamline.
        range: float
        slot_uri: pals:s_position
        unit:
          ucum_code: m
    rules:
      - description: "An element must have a length and/or a position along the beamline."
        preconditions:
          slot_conditions:
            id:
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                length:
                  value_presence: PRESENT
            - slot_conditions:
                s_position:
                  value_presence: PRESENT
  
  ReferenceP:
    mixin: true
    description: >-
      Mixin for reference parameters that are aligned with PALS ReferenceP (Reference Parameters) 
      for interoperability with the Particle Accelerator Language Standard (PALS).
    attributes:
      species_ref:
        description: A reference to a species or particle type, such as an ion, electron, or proton.
        range: string
        slot_uri: pals:species_ref
      pc_ref:
        description: "[momentum*c] Reference momentum times speed of light." # PALS asked for eV, doesn't matc UITF/CEBAF data.
        range: float
        slot_uri: pals:pc_ref
        aliases:
          - pCentral
      E_tot_ref:
        description: "[eV] Reference total energy"
        range: float
        slot_uri: pals:E_tot_ref
        unit:
          ucum_code: eV # DM: leaving this here, this is PALS standard
        aliases:
          - ETotal
      time_ref:
        description: "[s] Reference time"
        range: float
        unit:
          ucum_code: s
        slot_uri: pals:time_ref
        aliases:
          - tRef

    broad_mappings:
      - pals:ReferenceP

  # ---- Mixins for specific element/component types ------------------------------------------------
  SolenoidP:
    mixin: true
    description: Mixin for solenoid-specific parameters.
    attributes:
      Ksol:
        description: Normalized solenoid strength.
        range: float
        slot_uri: pals:Ksol
      Bsol:
        description: Solenoid field.
        range: float
        slot_uri: pals:Bsol
        unit:
          ucum_code: T
    rules:
      - description: "A solenoid must have one of, and exactly one of, Ksol or Bsol." # check this rule
        preconditions:
          slot_conditions:
            id:
              value_presence: PRESENT
        postconditions:
          exactly_one_of:
            - slot_conditions:
                Ksol:
                  value_presence: PRESENT
            - slot_conditions:
                Bsol:
                  value_presence: PRESENT
    exact_mappings:
      - pals:SolenoidP

  TwissP:
    description: >-
      Mixin for Twiss parameters, which can be used to describe the beam optics of an accelerator element.
    mixin: true
    broad_mappings:
      - pals:TwissP
    attributes:
      alpha_a:
        description: Twiss alpha parameter in the horizontal plane.
        range: float
        slot_uri: pals:alpha_a
        aliases:
          - alpha_x
          - alphax
      alpha_b:
        description: Twiss alpha parameter in the vertical plane.
        range: float
        slot_uri: pals:alpha_b
        aliases:
          - alpha_y
          - alphay
      beta_a:
        description: Twiss beta parameter in the horizontal plane.
        range: float
        slot_uri: pals:beta_a
        aliases:
          - beta_x
          - betax
      beta_b:
        description: Twiss beta parameter in the vertical plane.
        range: float
        slot_uri: pals:beta_b
        aliases:
          - beta_y
          - betay
      eta_x:
        description: Twiss dispersion parameter in the horizontal plane.
        range: float
        slot_uri: pals:eta_x
        aliases:
          - etax
      eta_y:
        description: Twiss dispersion parameter in the vertical plane.
        range: float
        slot_uri: pals:eta_y
        aliases:
          - etay
      etap_x:
        description: Twiss dispersion slope parameter in the horizontal plane.
        range: float
        slot_uri: pals:etap_x
        aliases:
          - etapx
      etap_y:
        description: Twiss dispersion slope parameter in the vertical plane.
        range: float
        slot_uri: pals:etap_y
        aliases:
          - etapy
      phi_a:
        description: Twiss phase advance parameter in the horizontal plane.
        range: float
        slot_uri: pals:phi_a
        aliases:
          - phi_x
          - phix
          - psi_x
          - psix
      phi_b:
        description: Twiss phase advance parameter in the vertical plane.
        range: float
        slot_uri: pals:phi_b
        aliases:
          - phi_y
          - phiy
          - psi_y
          - psiy


  ElectricMultipoleP:
    description: >-
      Mixin for electric multipole parameters, 
      
      which can be used to describe the electric field components of an accelerator element.

      This mixin is aligned with PALS ElectricMultipoleP for interoperability with the Particle Accelerator Language Standard (PALS).

      Example with three multipole components (N=0,1,2):
      ```yaml
      components:
      - order: 7
        tilt: 0.7
      - order: 3
        En: 27.3
      - order: 2
        EnL: 3.47e1
      ```
    mixin: true
    exact_mappings:
      - pals:ElectricMultipoleP
    attributes:
      components:
        description: Electric multipole components, one per order N.
        range: MultipoleComponent
        multivalued: true
        inlined_as_list: true
    broad_mappings:
      - pals:ElectricMultipoleP
  
  MagneticMultipoleP:
    description: >-
      Mixin for magnetic multipole parameters, 
      
      which can be used to describe the magnetic field components of an accelerator element.

      This mixin is aligned with PALS MagneticMultipoleP for interoperability with the Particle Accelerator Language Standard (PALS).

      Example with three multipole components (N=0,1,2):
      ```yaml
      components:
      - order: 7
        tilt: 0.7
      - order: 3
        Bn: 27.3
      - order: 2
        BnL: 3.47e1
      - order: 1
        Kn: 0.85     # normalized form, e.g. a quadrupole's k1-like strength
      ```
    mixin: true
    attributes:
      components:
        description: Magnetic multipole components, one per order N.
        range: MultipoleComponent
        multivalued: true
        inlined_as_list: true
    broad_mappings:
      - pals:MagneticMultipoleP
  
  BendP:
    description: >-
      Mixin for bend parameters, which can be used to describe the bending properties of an accelerator element.

      This mixin is aligned with PALS BendP for interoperability with the Particle Accelerator Language Standard (PALS).
    mixin: true
    attributes:
      angle_ref:
        description: Reference bend angle.
        range: float
        slot_uri: pals:angle_ref
        unit:
          ucum_code: rad
      bend_field_ref:
        description: Reference bend field.
        range: float
        slot_uri: pals:bend_field_ref
        unit:
          ucum_code: T
      bend_field_actual:
        description: Actual bend field.
        range: float
        slot_uri: pals:bend_field_actual
        unit:
          ucum_code: T
      e1:
        description: Entrance end pole face rotation with respect to a sector geometry.
        range: float
        slot_uri: pals:e1
        unit:
          ucum_code: rad
      e2:
        description: Exit end pole face rotation with respect to a sector geometry.
        range: float
        slot_uri: pals:e2
        unit:
          ucum_code: rad
      e1_rect:
        description: Entrance end pole face rotation with respect to a rectangular geometry.
        range: float
        slot_uri: pals:e1_rect
        unit:
          ucum_code: rad
      e2_rect:
        description: Exit end pole face rotation with respect to a rectangular geometry.
        range: float
        slot_uri: pals:e2_rect
        unit:
          ucum_code: rad
      edge1_int:
        description: Entrance end fringe field integral.
        range: float
        slot_uri: pals:edge1_int
        unit:
          ucum_code: T.m
      edge2_int:
        description: Exit end fringe field integral.
        range: float
        slot_uri: pals:edge2_int
        unit:
          ucum_code: T.m
      g_ref:
        description: Reference bend strength = 1/radius_ref
        range: float
        slot_uri: pals:g_ref
        unit:
          ucum_code: 1/m
      g_actual:
        description: Actual bend strength = 1/radius_actual
        range: float
        slot_uri: pals:g_actual
        unit:
          ucum_code: 1/m
      h1:
        description: Entrance end pole face curvature
        range: float
        slot_uri: pals:h1
        unit:
          ucum_code: 1/m
      h2:
        description: Exit end pole face curvature
        range: float
        slot_uri: pals:h2
        unit:
          ucum_code: 1/m
      L_chord:
        description: Chord length of the bend.
        range: float
        slot_uri: pals:L_chord
        unit:
          ucum_code: m
      L_sagitta:
        description: Output parameter. Sagitta length.
        range: float
        slot_uri: pals:L_sagitta
        unit:
          ucum_code: m
      L_rectangle:
        description: Rectangular length. 
        range: float
        slot_uri: pals:L_rectangle
        unit:
          ucum_code: m
      multipole_geometry:
        description: Multipole geometry type. Must be `follows_ref_geometry`.
        range: MultipoleGeometryEnum
        slot_uri: pals:multipole_geometry
      ref_geometry:
        description: Reference geometry type. Must be `arc`.
        range: ReferenceGeometryEnum
        slot_uri: pals:ref_geometry
      rho_ref:
        description: Reference bend radius.
        range: float
        slot_uri: pals:rho_ref
        unit:
          ucum_code: m
      tilt_ref:
        description: Reference tilt of the bend.
        range: float
        slot_uri: pals:tilt_ref
        unit:
          ucum_code: rad
    rules:
      - description: "multipole_geometry must be follows_ref_geometry"
        postconditions:
          slot_conditions:
            multipole_geometry:
              equals_expression: follows_ref_geometry
      - description: "ref_geometry must be arc"
        postconditions:
          slot_conditions:
            ref_geometry:
              equals_expression: arc
    exact_mappings:
      - pals:BendP

  MultipoleComponent:
    description: >-
      A single order's electric (or magnetic) multipole component.

      Only the fields supporting Electric Multipoles 
      OR the fields for Magnetic Multipoles should be present, not both.

      Not a mixin, but a class used in the ElectricMultipoleP and MagneticMultipoleP mixins to represent individual multipole components.
    attributes:
      order:
        description: Multipole order N (0 = dipole, 1 = quadrupole, etc.)
        range: integer
        required: true
      tilt:
        description: Tilt of the Nth multipole.
        range: float
        unit:
          ucum_code: rad
        broad_mappings:
          - pals:tilt
      En:
        description: Normal component of the field.
        range: float
        broad_mappings:
          - pals:EnN
      Es:
        description: Skew component of the field.
        range: float
        broad_mappings:
          - pals:EsN
      EnL:
        description: Length-integrated normal component.
        range: float
        broad_mappings:
          - pals:EnNL
      EsL:
        description: Length-integrated skew component.
        range: float
        broad_mappings:
          - pals:EsNL
      Bn:
        description: Normal component of the magnetic field.
        range: float
        broad_mappings:
          - pals:BnN
      Bs:
        description: Skew component of the magnetic field.
        range: float
        broad_mappings:
          - pals:BsN
      Kn:
        description: Normalized normal component.
        range: float
        broad_mappings:
          - pals:KnN
      Ks:
        description: Normalized skew component.
        range: float
        broad_mappings:
          - pals:KsN
    rules:
      - description: "If Es is present, then Bn, Bs, Kn, Ks should NOT be present"
        preconditions:
          slot_conditions:
            Es:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            Bn:
              value_presence: ABSENT
            Bs:
              value_presence: ABSENT
            Kn:
              value_presence: ABSENT
            Ks:
              value_presence: ABSENT
      - description: "If En is present, then Bn, Bs, Kn, Ks should NOT be present"
        preconditions:
          slot_conditions:
            En:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            Bn:
              value_presence: ABSENT
            Bs:
              value_presence: ABSENT
            Kn:
              value_presence: ABSENT
            Ks:
              value_presence: ABSENT
      - description: "If EnL is present, then Bn, Bs, Kn, Ks should NOT be present"
        preconditions:
          slot_conditions:
            EnL:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            Bn:
              value_presence: ABSENT
            Bs:
              value_presence: ABSENT
            Kn:
              value_presence: ABSENT
            Ks:
              value_presence: ABSENT
      - description: "If EsL is present, then Bn, Bs, Kn, Ks should NOT be present"
        preconditions:
          slot_conditions:
            EsL:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            Bn:
              value_presence: ABSENT
            Bs:
              value_presence: ABSENT
            Kn:
              value_presence: ABSENT
            Ks:
              value_presence: ABSENT  
      - description: "If Bn is present, then En, Es, EnL, EsL should NOT be present"
        preconditions:
          slot_conditions:
            Bn:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            En:
              value_presence: ABSENT
            Es:
              value_presence: ABSENT
            EnL:
              value_presence: ABSENT
            EsL:
              value_presence: ABSENT
      - description: "If Bs is present, then En, Es, EnL, EsL should NOT be present"
        preconditions:
          slot_conditions:
            Bs:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            En:
              value_presence: ABSENT
            Es:
              value_presence: ABSENT
            EnL:
              value_presence: ABSENT
            EsL:
              value_presence: ABSENT
      - description: "If Kn is present, then En, Es, EnL, EsL should NOT be present"
        preconditions:
          slot_conditions:
            Kn:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            En:
              value_presence: ABSENT
            Es:
              value_presence: ABSENT
            EnL:
              value_presence: ABSENT
            EsL:
              value_presence: ABSENT
      - description: "If Ks is present, then En, Es, EnL, EsL should NOT be present"
        preconditions:
          slot_conditions:
            Ks:
              value_presence: PRESENT 
        postconditions:
          slot_conditions:
            En:
              value_presence: ABSENT
            Es:
              value_presence: ABSENT
            EnL:
              value_presence: ABSENT
            EsL:
              value_presence: ABSENT

  # ---- High-level component classes ------------------------------------------------
  Component:
    description: A general class for accelerator components, which can be specialized into more specific types like AcceleratorDevice, Magnet, etc.
    abstract: true
    mixins:
      - MetaP
    attributes:
      native_types: # This can be the home for Elegant, MAD-X, or other source-system-specific types and aliases, which can be used to identify the component across different source systems.
        description: The native type of the component in the source system, which can be used to identify the component across different source systems.
        multivalued: true
        range: string
    slots:
      - id
      - type
    broad_mappings:
      - pals:Element
  
  PhysicalComponent:
    is_a: Component
    mixins:
      - FloorP
      - HasLongitudinalPlacement
    description: >-
      A physical item that participates in or supports accelerator operation. 
      This can be used to capture physical components, such as magnets, cavities, diagnostics, vacuum devices, and racks
      that are important for understanding the structure and function of the accelerator system.
    attributes:
      functions:
        description: >-
          The function of the physical component, 
          which can be used to identify the component across different source systems.
        required: true
        multivalued: true
        slot_uri: narad:physical_function
        range: PhysicalFunctionEnum
      beamline_relation:
        description: >-
          The relationship of the physical component to the beamline, 
          which can be used to identify the component across different source systems.
        required: true
        slot_uri: narad:physical_beamline_relation
        range: PhysicalRelationEnum
    broad_mappings:
      - pals:Element

  VirtualComponent:
    is_a: Component
    mixins:
      - FloorP
    description: >-
      A virtual or logical component that represents a concept, function, or role in the accelerator 
      beamline operation but does not have a physical instantiation. 
      This can be used to capture abstract components, such as Markers, BeamlineSections, and FacilitySpaces
      that are important for understanding the structure and function of the accelerator system but are not physical devices.
    attributes:
      functions:
        description: >-
          The function of the virtual component, 
          which can be used to identify the component across different source systems.
        required: true
        multivalued: true
        slot_uri: narad:virtual_function
        range: VirtualFunctionEnum
      beamline_relation:
        description: >-
          The relationship of the virtual component to the beamline, 
          which can be used to identify the component across different source systems.
        required: true
        slot_uri: narad:virtual_beamline_relation
        range: VirtualRelationEnum
    broad_mappings:
      - pals:Element
      - pals:BookkeepingElement

  # ---- High-level Beamline and beamline element classes ------------------------------------------------
  Beamline:
    is_a: VirtualComponent
    description: "A top-level NARAD-system for an ordered sequence of beamline elements defining a beam path."
    attributes:
      multipass:
        description: >-
          Indicates whether the beamline is a multipass beamline, where the beam passes through the same physical elements multiple times.

          If not provided, the default assumption is that the beamline is single-pass.
        range: boolean
        slot_uri: pals:multipass
      length:
        description: >-
          The total length of the beamline.

          For pals interoperability, use m as the unit of length.
        range: float
        slot_uri: pals:length
      zero_point:
        description: >-
          Name of a line item used as a reference point when
          the BeamLine is used as a subline.
        range: string
      periodic:
        description: >-
          Indicates whether orbit and Twiss parameters periodic.

          If not provided, the default assumption is that the beamline is not periodic.
        range: boolean
        slot_uri: pals:periodic
      repeat:
        description: >-
          Repetition count. If not provided, the default assumption is that the beamline is not repeated and the value is 1.

          If value is greater than 1, the beamline is repeated that many times.
        range: integer
        slot_uri: pals:repeat
      direction:
        description: >-
          Beam direction along the beamline: +1 or -1. 
          
          Longitudinal orientation. Default is +1.
        range: integer
        slot_uri: pals:direction
      # placement
      # inherit
    exact_mappings:
      - pals:BeamLine

  # ---- Signal class ------------------------------------------------
  Signal:
    description: Semantic meaning of a control-system signal associated with a component.
    mixins:
      - MetaP
    attributes:
      signal_role:
        description: The role of the signal in the control system, such as setpoint, readback, status, command, or limit.
        required: true
        range: SignalRoleEnum
      source_system:
        description: The source system from which the signal originates, such as EPICS, PALS-Ext, MYA, an element database, a channel database, or a simulation service.
        required: true
        range: SourceSystemEnum
      native_description:
        description: A human-readable description of the signal in the source system.
        range: string
      canonical_signal_type:
        description: The canonical semantic meaning of the signal.
        required: true
        range: CanonicalSignalTypeEnum
      quantity_kind:
        description: The physical quantity kind of the signal.
        required: true
        range: QuantityKindEnum
      native_data_type:
        description: >-
          The native data type of the signal in the source system, 
          such as String, Integer, Float, or Boolean.
        required: true
        range: DataTypeEnum
      native_unit:
        description: >-
          The native unit of the signal in the source system.
        required: true
        range: UnitEnum
      access_protocol:
        description: >-
          The protocol used to access the signal in the source system, 
          such as EPICS Channel Access, PALS-Ext, MYA, or a simulation service.
        range: string
      archive_identifier:
        description: The identifier used to reference the signal in an archival system.
        range: string
    slots:
      - id
      - type
    broad_mappings:
      - sosa:Sensor
      - sosa:Actuator

  #---- Subclass component classes ------------------------------------------------
  Magnet:
    description: An accelerator device that produces a magnetic field for beam control.
    abstract: true
    is_a: PhysicalComponent
    mixins:
      - ReferenceP
      - BodyShiftP
      - TwissP
    broad_mappings:
      - pals:Element
  
  Solenoid:
    description: >-
      A magnet with a primarily longitudinal magnetic field used for focusing.

      A solenoid is an element whose magnetic field is dominated by a field whose direction is aligned with the magnetic axis. 
    is_a: Magnet
    mixins:
      - SolenoidP
    exact_mappings:
      - pals:Solenoid

  Multipole: # DM: added Multipole as a general class for magnets with higher-order multipole fields, which can be specialized into specific types like Quadrupole, Sextupole, Octupole, etc., and can capture the number of poles as an important parameter.
    description: >-
      A general magnet with a higher-order multipole field, such as a sextupole or octupole.

      Only one of the electric or magnetic multipole components should be present, not both.
    is_a: Magnet
    mixins:
      - ElectricMultipoleP
      - MagneticMultipoleP
    broad_mappings:
      - pals:Multipole
  
  Bend:
    description: >-
      Dipole magnet used to bend the beam. 2 poles.
      The major difference between this element and other physical elements is that with a Bend 
      the curvilinear coordinate system is an arc with finite curvature 
      and for the other elements the curvilinear coordinate system is straight.
    is_a: Multipole
    aliases:
      - Dipole
    exact_mappings:
      - pals:Bend
  
  Quadrupole:
    description: >-
      A magnet primarily used to focus or defocus the beam. 4 poles.

      Only one of the electric or magnetic multipole components should be present, not both.
    is_a: Multipole
    exact_mappings:
      - pals:Quadrupole

  Octupole:
    description: >-
      A magnet primarily used to focus or defocus the beam. 8 poles.

      Only one of the electric or magnetic multipole components should be present, not both.
    is_a: Multipole
    exact_mappings:
      - pals:Octupole

  Sextupole:
    description: >-
      A magnet primarily used to focus or defocus the beam. 6 poles.

      Only one of the electric or magnetic multipole components should be present, not both.
    is_a: Multipole
    exact_mappings:
      - pals:Sextupole

  Kicker:
    description: >-
      A magnet primarily used to steer the beam.

      Can deflect the beam transversely in both planes, or a single plane, depending on the design and parameters of the kicker. 

      Only one of the electric or magnetic multipole components should be present, not both.
    is_a: Magnet
    mixins:
      - ElectricMultipoleP
      - MagneticMultipoleP
    attributes:
      plane:
        description: The transverse plane in which the kicker operates, either horizontal or vertical.
        range: PlaneEnum
    broad_mappings:
      - pals:Kicker
    aliases:
      - Corrector
      - HCorrector
      - VCorrector
      - VDiagKicker
      - HDiagKicker # DM: made this one up

  ACKicker:
    description: >-
      An ACKicker element simulates a time-dependent kicker. 
      It is like a Kicker element except that the field varies in time. 
      This element requires a user supplied time-dependent expression.
    # DM: what additional parameters/attributes/slots are needed for an ACKicker from a vanilla Kicker?
    is_a: Kicker
    exact_mappings:
      - pals:ACKicker

  DiagnosticDevice:
    description: An accelerator device used to measure beam or machine state.
    is_a: PhysicalComponent
    broad_mappings:
      - pals:Instrument

  BeamPositionMonitor:
    description: A diagnostic device used to measure transverse beam position.
    is_a: DiagnosticDevice
    mixins:
      - ReferenceP
      - BodyShiftP
      - TwissP
    broad_mappings:
      - pals:Instrument

  RadiationMonitor:
    description: A diagnostic device used to monitor radiation dose or dose rate.
    is_a: DiagnosticDevice
    mixins:
      - BodyShiftP
    broad_mappings:
      - pals:Instrument
  
  Cavity:
    description: A cavity used for beam acceleration or manipulation.
    is_a: PhysicalComponent
    abstract: true
    mixins:
      - ReferenceP
      - ElectricMultipoleP
      - MagneticMultipoleP
      - BodyShiftP
      - TwissP
  
  CrabCavity:
    description: A cavity used for transverse beam manipulation, such as crabbing or deflecting.
    is_a: Cavity
    exact_mappings:
      - pals:CrabCavity # Question about this for PALS folks

  RFCavity:
    description: A cavity used for RF acceleration or longitudinal manipulation.
    abstract: true
    is_a: Cavity
    exact_mappings:
      - pals:RFCavity
  
  NormalConductingRFCavity:
    description: A cavity used for RF acceleration or longitudinal manipulation, which is normal conducting.
    is_a: RFCavity
    broad_mappings:
      - pals:RFCavity # DM: not in PALS
  
  SuperConductingRFCavity:
    description: A cavity used for RF acceleration or longitudinal manipulation, which is superconducting.
    is_a: RFCavity
    broad_mappings:
      - pals:RFCavity # DM: not in PALS
  
  SupportingFacilityComponent:
    is_a: PhysicalComponent
    description: >-
      A physical component that supports accelerator operation 
      
      without a specific beam-pipe placement, 
      
      such as a power supply, control rack, or radiation detector.

      These can include Girders, Racks, Power Supplies, 
      
      and other physical infrastructure components that are important for understanding 
      
      the structure and function of the accelerator system but are not inline with the beamline.
    mixins:
      - FloorP
      - HasLongitudinalPlacement
      - BodyShiftP
    attributes:
      functions:
        description: >-
          The function of the supporting facility component, 
          which can be used to identify the component across different source systems.
        required: true
        multivalued: true
        slot_uri: narad:supporting_facility_function
        range: FacilityFunctionEnum
    broad_mappings:
      - pals:StructuralElement
  
  BookkeepingComponent:
    is_a: VirtualComponent
    description: >-
      A virtual component that represents a bookkeeping or organizational role in the accelerator system, 
      
      such as a BeamlineSection, Marker or a Fork.

      These can include BeamlineSections, Markers, Forks, 
      
      and other virtual components that are important for understanding 
      
      the structure and function of the accelerator system but are not physical devices.
    mixins:
      - BodyShiftP
    broad_mappings:
      - pals:BookkeepingElement

  Marker:
    description: A virtual component used as a reference point or marker in the beamline structure.
    is_a: BookkeepingComponent
    mixins:
      - TwissP
    exact_mappings:
      - pals:Marker

  BeamlineSection:
    description: >-
      A virtual component used to represent a section of the beamline for organizational 
      
      or functional grouping of components.
    is_a: BookkeepingComponent
    exact_mappings:
      - pals:BeamlineSection

  # ---- Supporting class for additional metadata ------------------------------------------------
  MetadataEntry:
    description: >-
      A single generic key/value metadata entry, used as a GraphQL-compatible
      replacement for an open-ended (range: Any) field. A list of these
      represents an arbitrary, extensible bag of program-specific metadata.
    attributes:
      key:
        identifier: true
        required: true
        range: string
        description: The metadata field name.
      value:
        required: true
        range: string
        description: The metadata value, serialized as a string.
      datatype:
        range: DataTypeEnum
        description: >-
          Hint for the value's original type, so consumers can parse it back
          (e.g. float, integer, boolean) rather than treating everything as
          an opaque string.

  # ---- Relationships: SignalBindings and Component Relations ------------------------------------------------

  Relationship:
    abstract: true
    represents_relationship: true
    description: Abstract base for subject-predicate-object associations.
    slots:
      - id
      - subject
      - predicate
      - object
  
  SignalBinding:
    is_a: Relationship
    description: >-
      Association between a PhysicalComponent and one of its Signals,
      e.g. QUAD1.QUAD1_STATUS_binding.
    slot_usage:
      subject:
        range: PhysicalComponent
      predicate:
        range: SignalBindingPredicateEnum
      object:
        range: Signal

  ComponentRelation:
    is_a: Relationship
    description: >-
      Association between two Components (Physical or Virtual), with supporting
      contextual/qualifying information about how and where the relationship holds.
    slot_usage:
      subject:
        range: Component
      predicate:
        range: ComponentRelationPredicateEnum
      object:
        range: Component
    attributes:
      context:
        range: RelationContextEnum
        description: The frame of reference / domain in which this relationship is asserted to hold.
      beamline_context:
        range: Beamline
        description: The specific Beamline this relationship is defined with respect to (relevant when context=beamline_order).
      reference_frame:
        range: ReferenceFrameEnum
      distance_value:
        range: float
      distance_unit:
        range: UnitEnum
      axis:
        range: AxisEnum
      direction:
        range: DirectionEnum
      tolerance_value:
        range: float
      tolerance_unit:
        range: UnitEnum

# ---- Enums ---------------------------------------------------------------
enums:
  SourceSystemEnum:
    description: Controlled values for facility-local source systems.
    permissible_values:
      EPICS:
        description: EPICS control system.
      EPICS_ChannelAccess:
        description: EPICS Channel Access source.
      PALS_Ext:
        description: PALS-Ext or middle-layer channel/export system.
      MYA:
        description: MYA archive or historical channel service.
      ElementDatabase:
        description: Facility element database.
      ChannelDatabase:
        description: Facility channel database.
      Simulation:
        description: Simulation or model-derived signal source.
      Other:
        description: Other source system.

  PhysicalRelationEnum:
    description: Controlled values for physical relation to the beamline.
    permissible_values:
      Inline:
        description: Beam passes through the physical component or beamline aperture. The physical component is physically on the beamline.
      AttachedToPipe:
        description: Mechanically attached to the beam pipe or vacuum envelope.
      NearBeamline:
        description: Near and operationally associated with the beamline.
      SupportingFacility:
        description: Supports accelerator operation without a specific beam-pipe placement.

  VirtualRelationEnum: # Chris and Todd need to evaluate this idea and ontology
    description: Controlled values for virtual relation to the beamline.
    permissible_values:
      Inline:
        description: >-
          Beam passes through the virtual component.
          Used for virtual components like Markers that represent important locations on the beamline but don't have a physical instantiation.
      AssociatedWithBeamline:
        description: >-
          Not inline with the beamline but still operationally associated with it. 
          Used for virtual components that are important for understanding the beamline structure and function but don't have a direct physical relationship to the beam path, 
          such as BeamlineSections or Markers that are not inline with the beam.
      NotAssociatedWithBeamline:
        description: >-
          Not inline with the beamline and not operationally associated with it. 
          Used for virtual components that are more abstract and don't have a specific relationship 
          to the beamline, such as a virtual component representing a control system function 
          or role that is important for understanding the overall accelerator system but doesn't have a direct relationship to the beamline structure.


  PhysicalFunctionEnum:
    description: Broad device-level functions.
    permissible_values:
      Focusing:
        description: Focuses or defocuses the beam.
      Steering:
        description: Steers the beam in a transverse plane.
      BeamPositionMeasurement:
        description: Measures transverse beam position.
      VacuumGeneration:
        description: Generates or maintains vacuum.
      RadiationMonitoring:
        description: Monitors radiation dose or dose rate.
      Measurement:
        description: Measures beam or machine state.
      BeamAcceleration:
        description: Accelerates the beam.
      BeamLossDetection:
        description: Detects beam loss.
      BeamCurrentMeasurement:
        description: Measures beam current or intensity.
      BeamProfileMeasurement:
        description: Measures beam profile.
      MachineProtection:
        description: Supports machine protection.
      TimingSynchronization:
        description: Supports timing or synchronization.

  FacilityFunctionEnum:
    description: Broad structural or support functions.
    permissible_values:
      Support:
        description: Provides mechanical support for accelerator operations.
      Alignment:
        description: Supports alignment of accelerator components.
      PowerSupply:
        description: Provides electrical power to accelerator components.
      ControlRack:
        description: Houses control electronics for accelerator components.
      Cooling:
        description: Provides cooling for accelerator components.
      Diagnostics:
        description: >-
          Provides diagnostic capabilities for accelerator components, such as monitoring or measurement.
      Detection:
        description: >-
          Provides detection capabilities for accelerator components, such as radiation or particle detection.

  VirtualFunctionEnum: # Chris and Todd need to evaluate this idea and ontology
    description: Broad virtual component functions or roles.
    permissible_values:
      BeamlineSection:
        description: >-
          A section of the beamline used for organizational or functional grouping of components, such as a linac section, transfer line, or ring sector.
        meaning: pals:Beamline
      Mark:
        description: >-
          A virtual component representing an important location on the beamline, 
          such as a reference point for beam-based alignment, a location of a known aperture restriction, 
          or a location of a critical diagnostic device.
        meaning: pals:Marker
      Fork:
        description: >-
          A virtual component representing a branching point in the beamline, 
          such as a beamline fork or switchyard.
        meaning: pals:Fork
      Control:
        description: >-
          A virtual component representing a control system function or role
          that is important for understanding the overall accelerator system 
          but doesn't have a direct relationship to the beamline structure, 
          such as the EPICS control system that manages device process variables across the accelerator.

  PlaneEnum:
    description: Controlled values for transverse plane.
    permissible_values:
      Horizontal:
        description: Horizontal transverse plane.
      Vertical:
        description: Vertical transverse plane.

  SignalRoleEnum:
    description: Roles for control-system signals.
    permissible_values:
      Setpoint:
        description: Requested or configured value.
        meaning: sosa:ActuatableProperty
      Readback:
        description: Measured or reported value.
        meaning: sosa:ObservableProperty
      Status:
        description: State or condition indicator.
      Command:
        description: Command or action trigger.
        meaning: sosa:ActuatableProperty
      MinimumLimit:
        description: Minimum allowed signal value.
        meaning: xsd:minInclusive
      MaximumLimit:
        description: Maximum allowed signal value.
        meaning: xsd:maxInclusive

  CanonicalSignalTypeEnum:
    description: Portable semantic meanings for important signals.
    permissible_values:
      HorizontalBeamPosition:
        description: Horizontal beam position signal.
      VerticalBeamPosition:
        description: Vertical beam position signal.
      HorizontalBeamPositionOffset:
        description: Horizontal beam position offset signal.
      VerticalBeamPositionOffset:
        description: Vertical beam position offset signal.
      BeamIntensity:
        description: Beam intensity or current signal.
      DeviceStatus:
        description: Device status signal.
      GradientSetpoint:
        description: Cavity accelerating gradient setpoint signal.
      GradientReadback:
        description: Cavity accelerating gradient readback signal.
      MagnetCurrentSetpoint:
        description: Magnet current setpoint signal.
      MagnetCurrentReadback:
        description: Magnet current readback signal.
      MagnetFieldSetpoint:
        description: Magnet field setpoint signal.
      IntegratedFieldSetpoint:
        description: Integrated magnetic field setpoint signal.
      IntegratedFieldReadback:
        description: Integrated magnetic field readback signal.
      VacuumPressure:
        description: Vacuum pressure signal.
      IonPumpCurrent:
        description: Ion pump current signal.
      IonPumpVoltage:
        description: Ion pump voltage signal.
      GammaDoseRate:
        description: Gamma radiation dose-rate signal.
      NeutronDoseRate:
        description: Neutron radiation dose-rate signal.
      Status: # DM: Added a generic DeviceStatus canonical signal type for status signals that don't fit into more specific categories, such as corrector status, BPM device status, etc.
        description: Generic status signal for a device.

  QuantityKindEnum:
    description: Physical quantity kinds for signals.
    permissible_values:
      BeamPosition:
        description: Beam transverse position.
      State:
        description: Device state or condition.
        meaning: sosa:ObservableProperty
      ElectricCurrent:
        description: Electric current.
        meaning: quantitykind:ElectricCurrent
      IntegratedMagneticField:
        description: Integrated magnetic field.
        meaning: quantitykind:MagneticFluxPerLength
      MagneticField:
        description: Magnetic field.
        meaning: quantitykind:MagneticFluxDensity
      Pressure:
        description: Gas or vacuum pressure.
        meaning: quantitykind:Pressure
      DoseRate:
        description: Radiation dose rate.
        meaning: quantitykind:AbsorbedDoseRate
      Voltage:
        description: Electric potential difference.
        meaning: quantitykind:Voltage
      Power:
        description: Power.
        meaning: quantitykind:Power
      CavityPhase:
        description: Cavity phase.
        meaning: quantitykind:PhaseAngle
      CavityGradient:
        description: Cavity accelerating gradient.
        meaning: quantitykind:ElectricFieldStrength

  UnitEnum:
    description: >-
      Engineering units using ASCII-safe enum names. Values map to QUDT unit
      IRIs with the LinkML meaning field when an exact QUDT unit is available.
    permissible_values:
      A:
        description: ampere
        meaning: unit:A
      degree:
        description: degree
        meaning: unit:DEG
      eV:
        description: electron volt
        meaning: unit:EV
      eV_per_c:
        description: momentum in electron volts per speed of light
      eV_per_c2:
        description: mass in electron volts per speed of light squared
      fundamental_charge:
        description: fundamental charge
        meaning: unit:????
      G_per_cm:
        description: gauss per centimeter
      Hz:
        description: hertz
        meaning: unit:HZ
      kW:
        description: kilowatt
        meaning: unit:KiloW
      m:
        description: meter
        meaning: unit:M
      mm:
        description: millimeter
        meaning: unit:MilliM
      mrem_per_h:
        description: >-
          millirem per hour. Kept as a local accelerator unit value because
          QUDT publishes related radiation units but no exact millirem-per-hour
          unit in the checked vocabulary.
        meaning: unit:MREM-PER-H
      MV_per_m:
        description: megavolt per meter
        meaning: unit:MegaV-PER-M
      PA:
        description: pascal
        meaning: unit:PA
      randians_pi2:
        description: radians divided by 2 pi - angles and phases
      rem_per_h:
        description: >-
          rem per hour. Kept as a local accelerator unit value because QUDT
          publishes rem and rem-per-second but no exact rem-per-hour unit in
          the checked vocabulary.
      seconds:
        description: second
        meaning: unit:SEC
      T:
        description: tesla
        meaning: unit:T
      T_M:
        description: tesla meter
        meaning: unit:T-M
      Torr:
        description: torr
        meaning: unit:TORR
      V:
        description: volt
        meaning: unit:V
      V_per_m:
        description: volt per meter
        meaning: unit:V-PER-M
      unitless:
        description: dimensionless numeric value
        meaning: unit:NUM
      none:
        description: no unit or not applicable

  DataTypeEnum:
    description: Data types for parameter values.
    permissible_values:
      String:
        description: string data type
        meaning: xsd:string
      Integer:
        description: integer data type
        meaning: xsd:integer
      Float:
        description: floating-point data type
        meaning: xsd:float
      Boolean:
        description: boolean data type
        meaning: xsd:boolean

  ComponentRelationPredicateEnum:
    permissible_values:
      precedes:
        description: Subject occurs immediately before object in the sequence/beamline order.
        meaning: BFO:0000063
      follows:
        description: Subject occurs after object in the sequence/beamline order.
        meaning: BFO:0000062
      contains:
        description: Subject spatially or mereologically contains object.
        meaning: BFO:0000051
      contained_in:
        description: Subject is spatially or mereologically contained in object.
        meaning: BFO:0000050
      connected_to:
        description: >-
          Subject and object are physically connected.
          a is connected to b if and only if a and b are discrete structure, 
          and there exists some connecting structure c, such that c connects a and b
        meaning: RO:0002170
      controls:
        description: Subject controls the state or behavior of object.
        meaning: saref:controls
      is_controlled_by:
        description: Subject is controlled by object.
        meaning: saref:isControlledBy
      is_part_of:
        description: Subject is a part of object.
        meaning: BFO:0000050
      has_part:
        description: Subject has part object.
        meaning: BFO:0000051
      adjacent_to:
        description: Subject and object are spatially adjacent, without overlapping.
        meaning: RO:0002220
      overlaps:
        description: Subject and object share at least one part in common.
        meaning: RO:0002131
      mounted_on:
        description: Subject is mounted on object.
        meaning: narad:mounted_on
      intersects:
        description: Subject intersects with object.
        meaning: narad:intersects
      nearest_to:
        description: Subject is nearest to object.
        meaning: narad:nearest_to
      
  
  SignalBindingPredicateEnum:
    description: Controlled predicates for Component-to-Signal bindings.
    permissible_values:
      has_signal:
        description: >-
          Generic association between a component and one of its signals.
          The specific role (setpoint, readback, status, etc.) is carried
          by the Signal's own signal_role field, not the predicate.
      has_status_signal:
        description: Subject has the given signal as its status indicator.
      has_setpoint_signal:
        description: Subject has the given signal as its setpoint.
      has_readback_signal:
        description: Subject has the given signal as its readback.
      has_command_signal:
        description: Subject has the given signal as a command trigger.
      has_limit_signal:
        description: Subject has the given signal as a limit/constraint value.
  
  RelationContextEnum:
    permissible_values:
      beamline_order:
      Euclidean_3D:
      Euclidean_2D:
      floorplan:
      containment:
      installation_mounting:

  ReferenceFrameEnum:
    permissible_values:
      beam_direction:
      facility_coordinates:
      local_component_frame:
      tunnel_stationing:

  AxisEnum:
    permissible_values:
      x:
      y:
      z:
      s:

  DirectionEnum:
    permissible_values:
      upstream:
      downstream:
      positive:
      negative:

  MultipoleGeometryEnum:
    description: >-
      The geometric configuration of the multipole field. 
      Sets the geometry used to calculate multipoles.
    permissible_values:
      follows_ref_geometry:
        description: Use geometry equivalent to the setting of `ref_geometry`.
      vertically_pure:
        description: Vertically pure multipoles with arc geometry.
      horizontally_pure:
        description: Horizontally pure multipoles with arc geometry.
      chord:
        description: Z-axis is the chord connecting the entrance origin point to the exit origin point.
      entrance_coords:
        description: Rectangular coordinates commensurate with the entrance coordinates.
      exit_coords:
        description: Rectangular coordinates commensurate with the exit coordinates.

  ReferenceGeometryEnum:
    description: >-
      The reference geometry used to calculate multipoles. 
      Sets the geometry used to calculate multipoles.
    permissible_values:
      arc:
        description: Default. Reference are the curvelinear arc coordinates.
      chord:
        description: Z-axis is the chord connecting the entrance origin point to the exit origin point.
      entrance_coords:
        description: Rectangular coordinates commensurate with the entrance coordinates.
      exit_coords:
        description: Rectangular coordinates commensurate with the exit coordinates.