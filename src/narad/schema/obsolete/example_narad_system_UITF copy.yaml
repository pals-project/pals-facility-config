narad_config:
  schema_version: '0.1'
  facility: UITF
  control_system: epics
  capability_layer:
    profiles:
      MagnetCurrentControlProfileFamily:
        device_domain: Magnet
        description: Reusable NARAD magnet profile family separating shared current-oriented semantic signals from magnet-type-specific
          strength semantics.
        shared_capabilities:
          MagnetCurrentControlCapability:
            description: Shared current-control semantics for powered magnets.
            signals:
            - name: current_setpoint
              role: control
              data_type: float
              units: A
              units_uri: si-unit:A
              description: Desired magnet current command.
            - name: current_readback
              role: readback
              data_type: float
              units: A
              units_uri: si-unit:A
              description: Measured magnet current.
            - name: current_min
              role: constraint
              data_type: float
              units: A
              units_uri: si-unit:A
              description: Minimum allowed current setting.
            - name: current_max
              role: constraint
              data_type: float
              units: A
              units_uri: si-unit:A
              description: Maximum allowed current setting.
            - name: status
              role: status
              data_type: string
              units: null
              description: Power-supply or device state summary.
        type_profiles:
          QuadrupoleProfile:
            device_type: Quadrupole
            description: Quadrupole magnet profile built from shared current-control semantics plus quadrupole-specific strength
              semantics.
            inherits_shared_capabilities:
            - MagnetCurrentControlCapability
            type_specific_capabilities:
            - name: quadrupole_focusing_control
              capability_class: QuadrupoleStrengthCapability
              description: Control and observe the normalized quadrupole strength.
              inherits_from: MagnetCurrentControlCapability
              signals:
              - name: strength_setpoint
                role: control
                data_type: float
                units: G/cm
                description: Desired integrated quadrupole strength or equivalent model quantity.
          CorrectorProfileTemplate:
            device_type: Corrector
            is_abstract: true
            description: Template for corrector magnets reusing shared current-control semantics while defining corrector-specific
              strength or kick signals.
            inherits_shared_capabilities:
            - MagnetCurrentControlCapability
            type_specific_capabilities:
            - name: corrector_kick_control
              capability_class: CorrectorKickCapability
              description: Template capability for corrector kick control.
              inherits_from: MagnetCurrentControlCapability
              signals:
              - name: kick_setpoint
                role: control
                data_type: float
                units: T*m
                units_uri: si-unit:T-M
                description: Desired integrated corrector kick or equivalent model quantity.
          CorrectorProfile:
            device_type: Corrector
            description: Corrector magnet profile built from shared current-control semantics plus corrector-specific kick
              semantics.
            inherits_shared_capabilities:
            - MagnetCurrentControlCapability
            type_specific_capabilities:
            - name: corrector_kick_control
              capability_class: CorrectorKickCapability
              description: Control and observe the corrector kick.
              inherits_from: MagnetCurrentControlCapability
              signals:
              - name: kick_setpoint
                role: control
                data_type: float
                units: T*m
                units_uri: si-unit:T-M
                description: Desired integrated corrector kick or equivalent model quantity.
          DipoleProfileTemplate:
            device_type: Dipole
            is_abstract: true
            description: Template for dipole magnets reusing shared current-control semantics while defining dipole-specific
              bend-field signals.
            inherits_shared_capabilities:
            - MagnetCurrentControlCapability
            type_specific_capabilities:
            - name: dipole_bend_control
              capability_class: DipoleFieldCapability
              description: Template capability for dipole bend field control.
              inherits_from: MagnetCurrentControlCapability
              signals:
              - name: field_setpoint
                role: control
                data_type: float
                units: T*m
                units_uri: si-unit:T-M
                description: Desired dipole bend field or equivalent model quantity.
          DipoleProfile:
            device_type: Dipole
            description: Dipole magnet profile built from shared current-control semantics plus dipole-specific bend-field
              semantics.
            inherits_shared_capabilities:
            - MagnetCurrentControlCapability
            type_specific_capabilities:
            - name: dipole_bend_control
              capability_class: DipoleFieldCapability
              description: Control and observe the dipole bend field.
              inherits_from: MagnetCurrentControlCapability
              signals:
              - name: field_setpoint
                role: control
                data_type: float
                units: T*m
                description: Desired dipole bend field or equivalent model quantity.
      BPMInstrumentProfileFamily:
        device_domain: Instrument
        description: Reusable NARAD instrument profile family for beam position monitors.
        shared_capabilities:
          BPMPositionReadbackCapability:
            description: Shared readback semantics for beam position monitor instruments.
            signals:
            - name: horizontal_beam_position
              role: readback
              data_type: float
              units: mm
              units_uri: si-unit:MilliM
              description: Measured horizontal beam position.
            - name: vertical_beam_position
              role: readback
              data_type: float
              units: mm
              units_uri: si-unit:MilliM
              description: Measured vertical beam position.
            - name: status
              role: readback
              data_type: string
              units: null
              description: Beam position monitor status readback.
        type_profiles:
          BPMProfile:
            device_type: BPM
            description: Beam position monitor instrument profile using shared BPM position readback semantics.
            inherits_shared_capabilities:
            - BPMPositionReadbackCapability
      CavityGradientControlProfileFamily:
        device_domain: RFCavity
        description: Reusable NARAD cavity profile family for gradient control and readback semantics.
        shared_capabilities:
          CavityGradientControlCapability:
            description: Shared gradient-control semantics for RF cavities.
            signals:
            - name: gradient_setpoint
              role: control
              data_type: float
              units: MV/m
              units_uri: si-unit:MegaV-PER-M
              description: Requested cavity gradient setpoint.
            - name: gradient_readback
              role: readback
              data_type: float
              units: MV/m
              units_uri: si-unit:MegaV-PER-M
              description: Measured cavity gradient readback.
            - name: status
              role: status
              data_type: string
              units: null
              description: RF cavity status summary.
        type_profiles:
          RFCavityProfile:
            device_type: RFCavity
            description: Generic RF cavity profile using shared gradient semantics.
            inherits_shared_capabilities:
            - CavityGradientControlCapability
  signal_layer:
    facilities:
      UITF:
        control_system: epics
        naming_convention: <device><signal_code>
        signal_definitions:
          type_signal_sets:
            Magnet:
              signal_bindings:
                current_setpoint:
                  epics_suffix: .S
                  description: EPICS current setpoint PV (shared across all magnet types)
                current_readback:
                  epics_suffix: M
                  description: EPICS current readback PV (shared across all magnet types)
                current_min:
                  epics_suffix: .HMIN
                  description: EPICS minimum current limit PV (shared across all magnet types)
                current_max:
                  epics_suffix: .HMAX
                  description: EPICS maximum current limit PV (shared across all magnet types)
                status:
                  epics_suffix: .STAT
                  description: EPICS status PV (shared across all magnet types)
            Quadrupole:
              signal_bindings:
                strength_setpoint:
                  epics_suffix: .BDL
                  description: EPICS quadrupole strength setpoint PV
            Corrector:
              signal_bindings:
                kick_setpoint:
                  epics_suffix: .KICK
                  description: EPICS corrector kick setpoint PV
            Dipole:
              signal_bindings:
                field_setpoint:
                  epics_suffix: .BDL
                  description: EPICS dipole bend field setpoint PV
            BPM:
              signal_bindings:
                horizontal_beam_position:
                  epics_suffix: .XPOS
                  description: EPICS BPM horizontal beam position readback PV
                vertical_beam_position:
                  epics_suffix: .YPOS
                  description: EPICS BPM vertical beam position readback PV
                status:
                  epics_suffix: .STAT
                  description: EPICS BPM status readback PV
            RFCavity:
              signal_bindings:
                gradient_setpoint:
                  epics_suffix: :GSET
                  description: EPICS cavity gradient setpoint PV (shared across all cavity types)
                gradient_readback:
                  epics_suffix: :GMES
                  description: EPICS cavity gradient readback PV (shared across all cavity types)
                status:
                  epics_suffix: :STAT
                  description: EPICS cavity status PV (shared across all cavity types)
