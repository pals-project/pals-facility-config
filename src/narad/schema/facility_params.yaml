id: https://w3id.org/narad_linkml/schema/narad/facility_params
name: facility_params
description: >-
  Facility-specific element parameters schema.
license: CC-BY-4.0
version: 0.1.0

prefixes:
  linkml: "https://w3id.org/linkml/"

imports:
  - linkml:types

classes:
  FacilityParams:
    description: "Facility-specific element parameters: type designation, accelerator model name, and open property map."
    slots:
      - facility_element_type
      - modeled_as
      - properties

slots:
  facility_params:
    range: FacilityParams
    inlined: true
    description: "Facility-specific element parameters block."

  facility_element_type:
    range: string
    aliases:
      - type
    description: >-
      Facility-specific element type designation (e.g. WarmCavity, QW, HCorrector).
      named facility_element_type here to avoid conflict with the
      LinkML metamodel 'type' designator used for polymorphic class selection.

  modeled_as:
    range: string
    description: "Accelerator physics code model element type (e.g. RFCA, KQUAD, HKICK)."

  properties:
    range: AnyValue
    description: "Open-ended key-value property map for element-specific parameters."

  