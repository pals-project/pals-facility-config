id: https://w3id.org/narad_linkml/schema/narad/system
name: narad-system-schema
description: >
  LinkML schema for representing NARAD control-system semantics, facility-level
  signal templates, and facility-specific instance bindings aligned with SSN,
  SSN-System, and SOSA ontologies. 

  Main modeling layers:
    - NaradModel — top-level document containing NaradConfig, beamlines, and elements
      - NaradConfig — top-level NARAD-system container for the capability layer and signal layer
        - ControlCapabilityLayer — reusable control-profile families, shared capabilities
        - InstrumentLayer — facility-specific instrument definitions -> their  capabilities
        - SignalLayer — facility-specific signal suffix templates for system/device types and instance bindings keyed by semantic signal name, linked to the
          device type
    - Beamline / BeamlineElement — ordered machine layout of the beamline/line
    - Element instances — individual beamline elements with applied profiles and instance signal
      bindings, parameters, and optional facility-specific parameters

  System hierarchy:
    - System
      - ControlSystem
      - Magnet
        - Quadrupole, Corrector, Dipole, Solenoid
      - Instrument
        - BPM
      - RFCavity
      - Marker
      - Drift

  Control Capability hierarchy:
    - SystemCapability
      - MagnetCapability
        - QuadrupoleCapability, CorrectorKickCapability, DipoleCapability
      - InstrumentCapability
      - BPMCapability
      - CavityGradientCapability

  Signal modeling:
    - Signal — abstract control-system quantity
      - ObservableSignal — readback, constraint, and status quantities
      - ActuatableSignal — writable/control setpoints
    - SignalBinding — signal template or suffix definition in the signal layer
    - InstanceSignalBinding — facility-specific PV binding attached to a beamline element

  Serialization conventions:
    - beamlines are keyed by beamline name
    - signals are keyed by semantic signal name
    - signal bindings are created through the is_observed_by relationship to  and are keyed by semantic signal name
  
  Alignments with PALS (Particle Accelerator Language Standard):
    - Beamline aligns with pals:BeamLine
    - BeamlineElement aligns with pals:Element
    - Instrument aligns with pals:Instrument
    - Dipole aligns with pals:Multipole
    - Quadrupole aligns with pals:Quadrupole
    - Solenoid aligns with pals:Solenoid
    - RFCavity aligns with pals:RFCavity

  Additional Notes on Usage:
  1. On Signal, and InstanceSignalBinding: These classes represent different levels of abstraction in the signal modeling. 
  Signal defines the abstract control-system quantity (e.g. current_readback), SignalBinding captures the control system suffix convention for that signal (e.g. .R for EPICS readback), 
  and InstanceSignalBinding represents the concrete binding of that signal to a specific beamline element instance, for example, MQWK202.S or RK11:GSET, depending on the facility naming convention. 
  The semantic signal name (e.g. current_readback) is the key that links these layers together, while the control-system suffix (e.g. .R) 
  is captured in the InstanceSignalBinding.
  2. On the distinction between is_instance_of, facility_element_type, and device_type:
    - BeamlineElement.is_instance_of identifies the element’s semantic class, device_type classifies capability or signal-definition scope, and facility_element_type records facility-local designation.
    - facility_element_type (FacilityParamSet.facility_element_type) is an optional slot for recording the facility-specific type designation for this element, if it differs from the generic element_kind. 
    - device_type (Capability.device_type) is the generic element type used for capability profile matching 
    and signal definition scoping, while facility_element_type captures the facility-specific type designation that may be used in the control system naming convention 
    or for other facility-specific purposes.
    For example, a facility might have its own naming convention for magnet types that doesn't align one-to-one with the ElementKindEnum values.
  3. Expected CURIE usage for is_instance_of, is_hosted_by, and is_property_of: 
    - is_instance_of typically points to the semantic class instantiated by the binding or element, using a CURIE such as narad:CavityGradientCapability if that is your intended convention.
    - is_hosted_by typically points to the FacilitySystem this binding belongs to, e.g. narad:UITF.
    - is_property_of typically points to the ControlSystem that implements this binding, e.g. narad:epics.
  4. Open and constrained vocabularies:
    - ElementKindEnum provides a controlled vocabulary for key classification slots, but the schema is designed to be extensible 
    with new enum values as needed.
    - SystemTypeEnum is a high-level classification for systems that can be used for querying and filtering, 
    but it is not intended to capture all the nuance of device types or capabilities.
    - DataTypeEnum and SignalRoleEnum provide a controlled vocabulary for signal data types and roles, 
    but the schema allows for additional values to be added as needed.
    - IdentifierTypeEnum provides a controlled vocabulary for types of identifiers used in FacilityIdentifier, 
    but it can be extended to apply to other entities, and with additional identifier types as needed.
    - The properties slot in FacilityParamSet allows for open-ended key-value pairs to capture any additional 
    facility-specific parameters that don't fit into the predefined schema structure.

  Needed Custom Validations:
    - Validation to ensure that the element_kind of a BeamlineElement matches the device_type of the Device it is an instance of.
    - Validation to ensure that the value of is_property_of in InstanceSignalBinding matches one of the control systems listed in narad_config.has_sub_system.
    - Validation that each signal_layer -> facilities -> FacilitySystem -> control_system value has a corresponding entry in narad_config.has_sub_system to ensure that all control systems referenced in the signal layer are defined in the capability layer.
    - Validation that the signal_bindings defined for a given device_type in the signal layer align with the signals defined in the capability profiles and instrument systems for that device type.

prefixes:
  linkml: https://w3id.org/linkml/
  narad: https://example.org/narad_linkml/schema/narad/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  owl: http://www.w3.org/2002/07/owl#
  ssn: http://www.w3.org/ns/ssn/
  ssn-system: http://www.w3.org/ns/ssn/systems/
  sosa: http://www.w3.org/ns/sosa/
  schema: http://schema.org/
  qudt: http://qudt.org/schema/qudt/
  si-unit: http://qudt.org/vocab/unit/
  ncit: http://purl.obolibrary.org/obo/ncit.owl
  pals: https://pals-project.readthedocs.io/en/latest/
  acc-core: https://example.org/acc-core/schema/acc-core/

default_prefix: narad
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------

classes:

  # ---- Abstract base -------------------------------------------------------

  NamedThing:
    abstract: true
    description: "Abstract base class providing identity and human-readable metadata."
    slots:
      - name
      - description

  # ---- Top-level document container ----------------------------------------

  NaradModel:
    description: "Top-level NARAD document container."
    tree_root: true
    slots:
      - narad_config
      - beamlines
      - elements

  # ---------------------------------------------------------------------------
  # Configuration containers
  # (semantics drawn from narad_narad; defined inline here to stay standalone)
  # ---------------------------------------------------------------------------

  NaradConfig:
    description: "A top-level NARAD-system container for the: capability layer + signal layer."
    slots:
      - schema_version
      - intent
      - deployed_system
      - control_system 
      - capability_layer
      - device_layer
      - signal_layer
    broad_mappings:
      - ssn:Deployment
    slot_usage:
      schema_version:
        range: string
        required: true
        description: "Version of the NARAD schema used in this document."
      deployed_system:
        range: DeployedSystem
        required: true
        multivalued: false
        inlined: true
        description: "Identifier of the deployed system this configuration describes."
      control_system:
        range: ControlSystem
        required: true
        multivalued: false
        description: "Identifier of the control system (e.g. epics) this configuration describes."
      device_layer:
        range: Device
        required: true
        multivalued: true
        inlined: true
        description: "Device Capability definitions keyed by capability name."
      signal_layer:
        required: true
        range: SignalLayer
        inlined: false
        description: "Signal-layer container for facility-specific signal bindings."

  CapabilityLayer:
    description: "Capability-layer container for control profile families."
    slots:
      - capabilities
   

  Capability:
    is_a: NamedThing
    description: >-
      A reusable device-type control profile that extends a generic shared
      capability with type-specific signals (e.g. QuadrupoleCurrentControlProfile).
    slots:
      - device_type
      - subclass_of
      - has_signal
      - is_property_of
    slot_usage:
      has_signal:
        required: true
      is_property_of:
        range: ControlSystem
        inlined: false
        multivalued: false
        description: "Links the capability layer to the control systems it applies to via ssn:isPropertyOf."
      subclass_of:
        range: Capability
        inlined: false
        multivalued: false
        description: "Links a type-specific capability to the generic capability it extends via rdfs:subClassOf."

  SignalLayer:
    description: "Signal-layer container for facility-specific signal bindings."
    slots:
      - facilities

  FacilitySystem:
    is_a: System
    description: "Facility-specific signal binding configuration."
    slots:
      - has_control_system
      - hosts_device
  
  FacilityIdentifier:
    description: "A globally unique identifier for an entity (e.g., facility), with a specified type (e.g. DOI, ROR, ARK, local)."
    slots:
      - identifier_type
      - identifier_value
      
  SignalBinding:
    is_a: NamedThing
    description: "A named control system suffix definition for one semantic signal. The suffix is used within in a template naming convention to construct the full control system PV name for a given device instance."
    slots:
      - signal_code_suffix
  
  # ---------------------------------------------------------------------------
  # Beamline and BeamlineElement
  # ---------------------------------------------------------------------------

  Beamline:
    is_a: NamedThing
    description: "A top-level NARAD-system for an ordered sequence of beamline elements defining a beam path."
    slots:
      - multipass
      - length
      - zero_point
      - periodic
      - line
    exact_mappings:
      - pals:BeamLine

  BeamlineElement:
    is_a: NamedThing
    description: >-
      A single element in a beamline with its kind and optional NARAD
      capability annotations.
    broad_mappings:
      - pals:Element
    slots:
      - is_instance_of
      - length
      - is_observed_by
      - param_set
    slot_usage:
      is_instance_of:
        range: ElementKindEnum
        multivalued: false
      is_observed_by:
        range: InstanceSignalBinding
  # ---- System hierarchy (SSN alignment) ------------------------------------

  System:
    is_a: NamedThing
    description: >
      A physical, logical, or cyber-physical system involved in sensing,
      monitoring, control, or actuation. Broadly aligned to ssn:System.
    exact_mappings:
      - ssn:System
    slots:
      - system_type
      - has_sub_system
      - has_system_capability
    slot_usage:
      has_sub_system:
        range: System
        inlined_as_list: true
      has_system_capability:
        range: SystemCapability
        multivalued: true
        inlined: true
  
  DeployedSystem:
    is_a: System
    description: >
      A deployed system, with an identified facility, that is the subject of a NARAD configuration. 
      This is the child of the target of the narad_config.deployed_system slot. In the SSN graph a
      DeployedSystem is a broad mapping to the ssn:Deployment and also is equivalent to the signal_layers.facilities entries.
    broad_mappings:
      - ssn:Deployment
      - ssn-system:System
    slots:
      - facility_identifier
      - has_control_system
    slot_usage:
      system_type: 
        range: SystemTypeEnum
        description: "High-level system type for classification and querying - set to Facility for all DeployedSystem instances."
      has_control_system:
        required: false
      has_system_capability:
        multivalued: true
        required: true

  ControlSystem:
    is_a: System
    description: >
      A control system (e.g. EPICS) that manages device process variables.
      In the SSN graph a ControlSystem is a subsystem of the Facility.
    exact_mappings:
      - ssn:System
    slots:
      - has_naming_convention
    slot_usage:
      has_naming_convention:
        range: NamingConvention
        multivalued: true
        inlined: true
      system_type:
        range: SystemTypeEnum
        description: "High-level system type for classification and querying - set to ControlSystem for all ControlSystem instances."
      has_sub_system:
        required: false
      has_system_capability:
        required: false
  
  Device:
    is_a: System
    description: >
      A system representing a beam diagnostic instrument, magnet, or other non-magnet device.
      It represents the instrument as a whole rather than the
      control system for that instrument. In the SSN graph a Device is
      a subsystem of the Facility and a sibling to the ControlSystem.
      Also used in the SignalLayer to group signal bindings by device type. Aligned to ssn:System.
    exact_mappings:
      - ssn:System
    broad_mappings:
      - pals:Element
    slots:
      - device_type
      - has_sub_system
      - subclass_of
      - has_system_capability
      - is_observed_by
    slot_usage:
      device_type:
        required: true
      is_observed_by:
        multivalued: true
        inlined: true  
      has_sub_system:
        range: System
        multivalued: true
        inlined_as_list: true
      has_system_capability:
        range: SystemCapability
        multivalued: false
        inlined: false
  
  NamingConventionExample:
    description: >
      An example of a control system naming convention, illustrating how the template is used to generate full control system PV names from semantic signal names and device instance information. 
      This can be used to provide concrete examples of the expected PV naming convention for different device types and signals based on the defined NamingConvention template.
    slots:
      - example
      - description
    slot_usage:
      example:
        identifier: true
 
  # ---- Physical device subclasses ------------------------------------------
  # These are the nodes labelled [Cls. Magnet], [Cls. Instrument] etc. in the
  # controls_scehma_SOSA_SSN diagram. Each is a ssn:System subtype that
  # ssn-system:hasSystemCapability its associated capability class.

  Instrument:
    is_a: System
    description: "A generic beam diagnostic instrument."
    exact_mappings:
      - ssn:System

  SystemCapability:
    is_a: NamedThing
    description: >
      A capability of a system. SystemCapability describes what a system can
      expose, monitor, control, or actuate with respect to one or more signals.
      Aligned to ssn-system:SystemCapability; linked from System instances via
      ssn-system:hasSystemCapability, and from Signals via ssn:forProperty.
      Profile-level inheritance (shared vs. type-specific signals) is expressed
      in CapabilityProfile, not here.
    exact_mappings:
      - ssn-system:SystemCapability
    slots:
      - for_property
      - device_type
    slot_usage:
      for_property:
        multivalued: true

  # ---- Naming Convention ---------------------------------------------------------------
  NamingConvention:
    is_a: NamedThing
    description: >
      A template for constructing facility-specific signal names from a semantic signal name and a control-system-specific suffix. 
      The template is used to generate the full control system PV name for a given device instance and semantic signal by substituting the device name and signal code suffix into the template.
    slots:
      - template
      - template_components
      - full_pattern
      - examples
   
  
  TemplateComponent:
    is_a: NamedThing
    description: >
      A component of a naming convention template, representing a variable part of the control system PV name that is substituted based on the device instance and signal definition. 
      For example, in the template "{device_name}{signal_code_suffix}", "device_name" and "signal_code_suffix" would be TemplateComponents that are replaced with the actual device name and signal code suffix for each specific binding.
    slots:
      - required
      - pattern

  TemplateExample:
    description: >
      An example of a control system PV name generated from a naming convention template, along with a description of what it represents. 
      This can be used to illustrate how the template works in practice and to provide concrete examples of the expected PV naming convention for different device types and signals.
    slots:
      - example
      - description
    slot_usage:
      example:
        identifier: true

  # ---- Signal hierarchy (SOSA/SSN alignment) --------------------------------
  # In SSN/SOSA, a sosa:Property / ssn:Property describes a feature of interest.
  # NARAD Signals are broad-mapped to sosa:Property because they represent
  # control-system quantities (setpoints, readbacks, limits, status) that
  # characterise beam devices. ObservableSignal aligns to sosa:ObservableProperty
  # and ActuatableSignal aligns to sosa:ActuatableProperty.

  Signal:
    is_a: NamedThing
    description: >
      Domain term for a control-system signal. A Signal represents an
      identifiable quantity, state, setpoint, readback, limit, or status.
      In SSN/SOSA alignment, NARAD Signals are treated as properties of systems
      (ssn:forProperty). The concrete facility binding is captured in SignalBinding.
    broad_mappings:
      - sosa:Property
      - ssn:Property
      - qudt:QuantityKind
    aliases:
      - epics_pv
      - pv
      - process_variable
      - EPICS Process Variable
      - control signal
      - control-system signal
    slots:
      - role
      - data_type
      - units
      - units_uri

  ObservableSignal:
    is_a: Signal
    description: >
      A NARAD signal that is read, monitored, observed, or exposed by a system.
      Examples: current_readback, status, horizontal_beam_position,
      gradient_readback. Aligned to sosa:ObservableProperty.
    broad_mappings:
      - sosa:ObservableProperty

  ActuatableSignal:
    is_a: Signal
    description: >
      A NARAD signal that can be commanded, set, or acted upon.
      Examples: current_setpoint, strength_setpoint, kick_setpoint,
      field_setpoint, current_min, current_max, gradient_setpoint.
      Aligned to sosa:ActuatableProperty.
    broad_mappings:
      - sosa:ActuatableProperty

  # ---- InstanceSignalBinding (SOSA:Sensor alignment) ----------------------------
  # sosa:Sensor describes *how* a property is observed or actuated.
  # SignalBinding is the facility/control-system binding template fragment for that semantic signal, 
  # and InstanceSignalBinding is the fully instantiated binding on an element.

  InstanceSignalBinding:
    is_a: NamedThing
    description: >
      A facility-specific binding between a NARAD Signal and an implementation
      interface (e.g. an EPICS process variable). Modeled as sosa:Sensor
      because it describes how a signal is observed, monitored, or actuated.
      ssn:forProperty → Signal; narad:isInstanceOf → the capability class.
    slots:
      - pv_name
      - is_instance_of
      - for_property
      - is_hosted_by
      - is_property_of
    broad_mappings:
      - rdf:type
      - sosa:Sensor
    slot_usage:
      is_instance_of:
        range: Signal
        multivalued: false
      is_hosted_by:
        range: string
        multivalued: false
      is_property_of:
        range: ControlSystem
        multivalued: false
      for_property:
        range: SignalBinding
        multivalued: false
  
  # -------- Element Parameters and Facility Parameters --------------------------------
  # ElementParamSet holds named physics-parameter blocks (RFP, BendP, etc.).
  # FacilityParamSet holds facility-specific metadata (type designation, model name,
  # and an open-ended property map).

  ElementParamSet:
    description: >-
      Named physics-parameter block for a beamline element. The name identifies
      the block type (e.g. RFP, BendP, MagneticMultipoleP, SolenoidP).
    slots:
      - frequency
      - voltage
      - phase
      - angle_ref
      - e1
      - e2
      - Kn1
      - Ksol
      - facility_param_set

  FacilityParamSet:
    description: "Facility-specific element parameters block for beamline elements. Differs from an ElementParamSet in that it captures facility-specific metadata about the element (e.g. type designation, model name) rather than physics parameters."
    slots:
      - facility_element_type
      - modeled_as
      - properties

  AnyValue:
    class_uri: linkml:Any
    description: "Unconstrained type — accepts any YAML/JSON value (string, number, object, list, etc.)."

# ---------------------------------------------------------------------------
# Subsets
# ---------------------------------------------------------------------------
subsets:
  # Subsets of narad classes for documentation and enabling validation of partial graphs. 
  # These are not intended to be used as types for slot range constraints, 
  # but rather as a way to document and validate expected usage patterns in the graph. 
  physical_device:
    description: "Physical beamline devices that interact with the beam, including magnets and instruments."
  relationship:
    description: "Relationships between systems, capabilities, and signals, including system decomposition and capability assignment."
  base_class:
    description: "Base classes that are not intended to be instantiated directly but provide shared properties for subclasses."
  instance:
    description: "Instances of systems, capabilities, and signals that represent concrete entities in the graph."
  label:
    description: "Slots that serve as labels or properties of base classes or instances rather than relationships between entities."


# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------

enums:

  ElementKindEnum:
    description: >-
      Controlled vocabulary for beamline element types, shared between the
      capability layer (CapabilityProfile.device_type) and the element layer
      (BeamlineElement.kind). Keeping the enum here keeps profile device_type
      values in sync with element kind values without circular imports.
      Values must stay aligned with CapabilityProfile.device_type.
      NOTE: The kind of a BeamlineElement must match the device_type
      of the Device referenced by is_instance_of.
    permissible_values:
      Drift:
        description: "A field-free drift space between elements."
        exact_mappings:
          - pals:Drift
      Marker:
        description: "A zero-length reference point or survey marker."
        exact_mappings:
          - pals:Marker
      BPM:
        description: "Beam Position Monitor."
        broad_mappings:
          - pals:Instrument
      Corrector:
        description: "Dipole corrector magnet for orbit correction."
      Dipole:
        description: "Dipole bending magnet."
        broad_mappings:
          - pals:Multipole
      Quadrupole:
        description: "Quadrupole focusing/defocusing magnet."
        exact_mappings:
          - pals:Quadrupole
      Solenoid:
        description: "Solenoid magnet."
        exact_mappings:
          - pals:Solenoid
      CavityGradient:
        description: "Accelerating or bunching cavity."
      RFCavity:
        description: "Radio-frequency accelerating or bunching cavity."
        exact_mappings:
          - pals:RFCavity
      Instrument:
        description: "Generic beam diagnostic instrument (halo monitor, viewer, etc.)."
        exact_mappings:
          - pals:Instrument
      Magnet:
        description: "Generic powered magnet device (supertype for all magnet kinds)."

  SystemTypeEnum:
    description: >-
      High-level system type for classification and querying. This is a broad
      categorization that can be used for filtering or grouping systems without
      needing to traverse the has_sub_system and has_system_capability edges.
    inherits: 
      - ElementKindEnum
    permissible_values:
      Facility:
        description: "A physical facility or installation (e.g. BTA, CEBAF, or UITF)."
      ControlSystem:
        description: "A control system (e.g. epics) that manages device process variables."
      Magnet:
        description: "A powered magnet device/system (generic supertype for all magnet kinds)."
      
  DataTypeEnum:
    description: "Allowed data types for signal values."
    permissible_values:
      int:
        description: "Integer."
        meaning: ncit:C47840
      float:
        description: "Single-precision floating-point."
        meaning: ncit:C48150
      double:
        description: "Double-precision floating-point."
        meaning: ncit:C48870
      string:
        description: "Text string."
        meaning: ncit:C45253
      boolean:
        description: "True/false value."
        meaning: ncit:C45254
      coded_value:
        description: "A code referenced from an external coding system."
        meaning: ncit:C95637
        
  SignalRoleEnum:
    description: "Controlled vocabulary for the semantic role of a signal within a capability."
    permissible_values:
      control:
        description: "A writable signal that commands a device setpoint."
        broad_mappings:
          - sosa:ActuatableProperty
      readback:
        description: "A readable signal that reports a measured or monitored quantity. Differs from status in that it typically indicates a continuous measurement (e.g. current readback, beam position) rather than discrete states."
        broad_mappings:
          - sosa:ObservableProperty
      constraint:
        description: "A signal that defines an operational limit or boundary on a control quantity."
      status:
        description: "A signal reporting the device or system operational state. Differs from readback in that it typically indicates discrete states (e.g. fault, standby, ready) rather than a continuous measurement."
        broad_mappings:
          - sosa:ObservableProperty

  IdentifierTypeEnum:
    description: "Allowed identifier types for facilities and other entities."
    permissible_values: # doi | ark | handle | url | local | other
      doi:
        description: "Digital Object Identifier (DOI)."
      ark:
        description: "Archival Resource Key (ARK)."
      handle:
        description: "Handle System identifier."
      url:
        description: "Uniform Resource Locator (URL)."
      local:
        description: "Local identifier unique within a specific context or namespace."
      other:
        description: "Any other type of identifier not covered by the above categories."

# ===========================================================================
# Slots
# ===========================================================================

slots:

  name:
    identifier: true
    required: true
    range: string
    in_subset:
      - label
    description: "Human-readable name or local string key for the entity."

  description:
    range: string
    in_subset:
      - label
    description: "Detailed description of the entity."

  # ---- SSN/SSN-System relationship slots -----------------------------------

  has_sub_system:
    description: >
      Relates a System to one of its subsystems (SSN alignment).
      Use for facility → control-system, facility → device, and
      device → component decomposition.
    in_subset:
      - relationship
    exact_mappings:
      - ssn-system:hasSubSystem
    domain: System
    range: System
    multivalued: true

  has_control_system:
    description: >
      Relates a System to one of its control systems (SSN alignment to sub system).
      Use for facility → control-system, facility → device, and
      device → component decomposition.
    in_subset:
      - relationship
    broad_mappings:
      - ssn-system:hasSubSystem
    domain: System
    range: ControlSystem
    multivalued: false

  capability:
    range: Capability
    in_subset:
      - base_class
    inlined: false
    description: "Cross-reference to the specific control capability applied to this element."

  has_system_capability:
    description: >
      Relates a System to a SystemCapability it supports (SSN-System alignment).
      Prefer this over directly attaching signals to systems when capability
      context matters.
    in_subset:
      - relationship
    exact_mappings:
      - ssn-system:hasSystemCapability
    domain: System
    range: SystemCapability
    multivalued: true

  for_property:
    description: >
      SystemCapability → Signal: the capability can expose, monitor, control,
      or actuate that signal.
    in_subset:
      - relationship
    exact_mappings:
      - ssn:forProperty
    multivalued: true

  is_property_of:
    range: ControlSystem
    description: >
      Inverse of for_property: links the Class Signal to the Class of SignalBinding Procedure that implements it.
      This can also link the Instance of a SignalBinding to the ControlSystem that implements it.
      This is the edge that connects the signal definitions to the facility-specific bindings in the graph.
      Values are typically the ControlSystem that implements this binding, e.g. narad:epics (for EPICS control system).
      NOTE: The value of this slot must match one of the values in narad_config.has_sub_system.
    in_subset:
      - relationship
    multivalued: false
    broad_mappings:
      - ssn:isPropertyOf
  
  is_hosted_by:
    description: >
      Links an InstanceSignalBinding to the FacilitySystem it belongs to.
      This is the edge that connects the facility-specific bindings to the Facility node in the graph.
    in_subset:
      - relationship
    range: DeployedSystem
    multivalued: false
    broad_mappings:
      - ssn-system:hasSubSystem
      - ssn:isHostedBy

  # ---- NARAD-specific slots ------------------------------------------------

  is_instance_of:
    description: >
      NARAD alias for rdf:type. Links a facility-specific instance node to
      the LinkML class or semantic class it instantiates.
      In the graph this edge is labelled narad:isInstanceOf.
      Values are typically the rdf:type of the Class that implements the signal binding.
    in_subset:
      - relationship
    exact_mappings:
      - rdf:type
    range: string
    multivalued: true

  subclass_of:
    description: ->
      NARAD alias for rdfs:subClassOf. Links a type-specific capability to the
      generic capability it extends. In the graph this edge is labelled
      narad:subclassOf.
    in_subset:
      - relationship
    exact_mappings:
      - rdfs:subClassOf
    range: System
    multivalued: false

  pv_name:
    description: >
      Fully-resolved facility-specific process variable name,
      e.g. MQWK202:STAT or MQWK202:BDL.
    range: string
    in_subset:
      - label

  signal_code_suffix:
    description: >
      Facility-specific control-system (e.g. EPICS) naming suffix used to
      derive or interpret the signal binding, e.g. .S, M, :GSET.
    range: string
    in_subset:
      - label

  beamlines:
    range: Beamline
    multivalued: true
    inlined: true
    description: "A top-level NARAD-system container for the ordered beamline definitions keyed by beamline name. Serializes as a keyed map by beamline name."

  elements:
    range: BeamlineElement
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: "Beamline element definitions referenced by name from beamline sequences. Serializes as a keyed map by element name."

  narad_config:
    range: NaradConfig
    inlined: true
    description: "Top-level NARAD configuration block (capability_layer + signal_layer)."
    aliases:
      - narad

  schema_version:
    range: string
    in_subset:
      - label
    description: "Version of the NARAD schema used in this document."

  deployed_system:
    range: DeployedSystem
    in_subset:
      - instance
    required: true
    multivalued: false
    description: "Identifier of the deployed system this configuration describes."

  system_type:
    range: SystemTypeEnum
    in_subset:
      - label
    description: "High-level system type for classification and querying."

  control_system:
    range: ControlSystem
    in_subset:
      - instance
    inlined: true
    description: "Identifier of the control system (e.g. epics)."

  has_naming_convention:
    range: NamingConvention
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: >-
      Signal naming conventions used by this control system defined in a machine actionable manner. 
      This is where you would capture the patterns/templates for how control system PVs or signals are constructed for this control system, 
      for example, the EPICS convention of using suffixes like .R, .S, :GSET to indicate readback, status, and setpoint signals.
      Multiple naming conventions can be captured if a control system uses more than one convention for different device types or domains.

  template:
    range: string
    in_subset:
      - label
    description: "A template string for constructing control system PV names based on the semantic signal name and device instance. This can include placeholders for the device name and signal suffix, e.g. {device_name}{signal_suffix}."

  template_components:
    range: TemplateComponent
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: >-
      Structured components of the naming convention template, for capturing the template in a more machine-actionable way than a raw string. 
      For example, you could have components for the device name, signal suffix, and any fixed parts of the naming convention.

  required:
    range: boolean
    in_subset:
      - label
    description: "Indicates whether this configuration element is required for a valid configuration."

  pattern:
    range: string
    in_subset:
      - label
    description: "A regex pattern that the value of this slot must match for validation."

  full_pattern:
    range: string
    in_subset:
      - label
    description: "A regex pattern that the full resolved value (e.g. after template substitution) must match for validation."

  examples:
    range: NamingConventionExample
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: "Examples of how this naming convention is applied to specific device instances and signals."

  example:
    range: string
    in_subset:
      - label
    description: "A single example of how this naming convention is applied to a specific device instance and signal."

  capability_layer:
    range: Capability
    required: true
    multivalued: true
    inlined: true
    description: "Control Capability definitions for this facility."
  
  capabilities:
    range: Capability
    inlined: true
    multivalued: true

  device_layer:
    range: Device
    multivalued: true
    inlined: true
    description: "Device definitions for this facility."

  facilities:
    range: FacilitySystem
    multivalued: true
    inlined: true
    description: "Facility-specific signal binding configurations keyed by facility name."

  signal_layer:
    range: SignalLayer
    description: "Signal suffix templates for this facility."
  
  hosts_device:
    domain: FacilitySystem
    range: Device
    in_subset:
      - relationship
    multivalued: true
    inlined: true
    description: "Structured container for facility-specific signal suffix templates."

  is_observed_by:
    range: SignalBinding
    in_subset:
      - relationship
    multivalued: true
    inlined: true
    description: >-
      Control-system-specific, e.g. EPICS, suffix definitions keyed by signal name within a device/domain set.
      Can also be used to link a BeamlineElement instance to the signal bindings that observe or actuate it, 
      since the instance of the element is directly observed or controlled through a Device.
      Facility-specific bindings of signals to control-system interfaces (e.g.
      EPICS PVs) for a specific beamline element instance.
      These are the keyed by the semantic signal name (e.g. current_readback)
      rather than the control-system suffix, which is captured in the SignalBinding.
      The semantic signal name links the instance binding to the abstract Signal
      definition and its place in the capability profile, while the SignalBinding
      captures the concrete implementations of the abstract SignalBindings
      referenced by the element's capability profile.

  capability_class:
    range: string
    in_subset:
      - base_class
    aliases:
      - class
    description: >-
      Semantic class label for a type-specific capability
      (e.g. QuadrupoleStrengthCapability). Serialized as 'class' in source YAML.

  has_signal:
    range: Signal
    in_subset:
      - relationship
    multivalued: true
    inlined: true
    description: "Signals within a capability, keyed by a semantic signal name."

  device_type:
    range: ElementKindEnum
    in_subset:
      - label
    description: >-
      Represents the generic, semantic class of the device (e.g., "Quadrupole", "BPM") and is
      used for capability, instrument, and signal profile matching.

  role:
    range: SignalRoleEnum
    in_subset:
      - label
    description: "The semantic role of the signal within its capability."

  data_type:
    range: DataTypeEnum
    in_subset:
      - label
    description: "The data type of the signal's value."

  units:
    range: string
    in_subset:
      - label
    description: "Conventional unit symbol (e.g. A, MV/m, T*m, G/cm)."

  units_uri:
    range: string
    in_subset:
      - label
    description: >-
      Machine-resolvable QUDT unit reference (e.g. si-unit:A for Ampere).
      The si-unit: prefix maps to http://qudt.org/vocab/unit/.

  line:
    range: BeamlineElement
    multivalued: true
    inlined: false
    description: "Ordered sequence of beamline elements in this beamline. Serializes as a list of element names (BeamlineElement names) referencing the keys in the elements map This is not a direct containment slot; the actual element definitions are in the top-level elements map."

  multipass:
    range: boolean
    in_subset:
      - label
    description: "Indicates whether this beamline is a multipass recirculating line (true) or a single-pass line (false)."
  
  zero_point:
    range: BeamlineElement
    in_subset:
      - label
    multivalued: false
    inlined: false
    description: >-
      Name of a line item used as a reference point when 
      the beamline is used as a subline."
  
  periodic:
    range: boolean
    in_subset:
      - label
    description: "For a beamline, indicates whether the orbit and Twiss parameters are periodic (true) or non-periodic (false)."
  
  length:
    range: float
    in_subset:
      - label
    description: "Physical length of the element in meters."

  param_set:
    range: ElementParamSet
    multivalued: false
    inlined: true
    description: "Named physics-parameter blocks for this element (e.g. RFP, BendP, MagneticMultipoleP)."

  facility_param_set:
    range: FacilityParamSet
    inlined: true
    description: "Facility-specific element parameters (type designation, model name, open property map)."

  properties:
    range: AnyValue
    description: "Intentionally open-ended key-value property map for element-specific or facility-specific parameters."

  modeled_as:
    range: string
    in_subset:
      - label
    description: "Accelerator physics code model element type (e.g. RFCA, KQUAD, HKICK)."

  facility_element_type:
    range: string
    in_subset:
      - label
    aliases:
      - type
    description: >-
      capture the facility-specific or local designation (e.g., "QW", "WarmCavity", "HCorrector"). 
      Isused for local naming, inventory, or legacy mapping of instances of facility elements (within elements:) 
      to the facility-specific type designations used in the control system or elsewhere at the facility.

  frequency:
    range: float
    in_subset:
      - label
    description: "RF frequency in Hz."

  voltage:
    range: float
    in_subset:
      - label
    description: "RF voltage in volts."

  phase:
    range: float
    in_subset:
      - label
    description: "RF phase in degrees."

  angle_ref:
    range: float
    in_subset:
      - label
    description: "Reference bend angle in radians."

  e1:
    range: float
    in_subset:
      - label
    description: "Entry edge angle in radians."

  e2:
    range: float
    in_subset:
      - label
    description: "Exit edge angle in radians."

  Kn1:
    range: float
    in_subset:
      - label
    description: "First-order magnetic multipole coefficient (quadrupole strength)."

  Ksol:
    range: float
    in_subset:
      - label
    description: "Solenoid integrated field strength."

  facility_identifier:
    range: FacilityIdentifier
    multivalued: true
    inlined: false
    description: "Globally unique identifier for the facility, with specified type and value."

  identifier_type:
    range: IdentifierTypeEnum
    in_subset:
      - label
    description: "The type of identifier used in the identifier slot (e.g. DOI, ARK, URL, local)."

  identifier_value:
    range: string
    in_subset:
      - label
    description: "The value of the identifier (e.g. the DOI string, ARK string, URL string, or local ID)."

  intent:
    range: string
    in_subset:
      - label
    description: "A human-readable statement of the intended use or purpose of this NARAD configuration."