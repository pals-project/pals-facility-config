narad_config:
  schema_version: '0.1'
  intent: NARAD extension for capability-layer semantics and facility-specific signal
    bindings
  deployed_system: CEBAF
  has_sub_system:
  - epics
  control_capability_layer:
    MagnetCapability:
      description: Shared current-control semantics for powered magnets.
      device_type: Magnet
      signals:
        current_setpoint:
          role: control
          data_type: float
          units: A
          units_uri: si-unit:A
          description: Desired magnet current command.
        current_readback:
          role: readback
          data_type: float
          units: A
          description: Measured magnet current.
        current_min:
          role: constraint
          data_type: float
          units: A
          units_uri: si-unit:A
          description: Minimum allowed current setting.
        current_max:
          role: constraint
          data_type: float
          units: A
          units_uri: si-unit:A
          description: Maximum allowed current setting.
        magnet_status:
          role: status
          data_type: string
          units: null
          description: Power-supply or device state summary.
    QuadrupoleCapability:
      description: Control and observe the normalized quadrupole strength.
      device_type: Quadrupole
      subclass_of: MagnetCapability
      signals:
        strength_setpoint:
          role: control
          data_type: float
          units: G/cm
          units_uri: si-unit:Gs
          description: Desired integrated quadrupole strength or equivalent model
            quantity.
    DipoleCapability:
      description: Control and observe the dipole bend field.
      device_type: Dipole
      subclass_of: MagnetCapability
      signals:
        field_setpoint:
          role: control
          data_type: float
          units: T*m
          units_uri: si-unit:T-M
          description: Desired dipole bend field or equivalent model quantity.
    CorrectorKickCapability:
      description: Control and observe the corrector kick.
      device_type: Corrector
      subclass_of: MagnetCapability
      signals:
        kick_setpoint:
          role: control
          data_type: float
          units: T*m
          units_uri: si-unit:T-M
          description: Desired integrated corrector kick or equivalent model quantity.
    SolenoidCapability:
      description: Control and observe the solenoid integrated field strength.
      device_type: Solenoid
      subclass_of: MagnetCapability
      signals:
        solenoid_setpoint:
          role: control
          data_type: float
          units: T*m
          units_uri: si-unit:T-M
          description: Desired solenoid integrated field strength (Ksol) or equivalent
            model quantity.
    CavityGradientCapability:
      description: Shared gradient-control semantics for CavityGradient devices.
      device_type: CavityGradient
      signals:
        gradient_setpoint:
          role: control
          data_type: float
          units: MV/m
          description: Requested cavity gradient setpoint.
        gradient_readback:
          role: readback
          data_type: float
          units: MV/m
          description: Measured cavity gradient readback.
        cavity_status:
          role: status
          data_type: string
          units: null
          description: Cavity status summary.
    RFCavityCapability:
      description: Shared gradient-control semantics for RF cavity devices.
      device_type: RFCavity
      subclass_of: CavityGradientCapability
      signals: {}
    InstrumentCapability:
      description: Shared readback semantics generic instruments.
      device_type: Instrument
      signals:
        status:
          role: readback
          data_type: string
          units: null
          description: generic instrument status readback.
    BPMCapability:
      description: Shared readback semantics for beam position monitor instruments.
      device_type: BPM
      subclass_of: InstrumentCapability
      signals:
        horizontal_beam_position:
          role: readback
          data_type: float
          units: mm
          units_uri: si-unit:MilliM
          description: Measured horizontal beam position.
        vertical_beam_position:
          role: readback
          data_type: float
          units: mm
          units_uri: si-unit:MilliM
          description: Measured vertical beam position.
    FaradayCupCapability:
      description: Shared readback semantics for Faraday cup beam current monitors.
      device_type: FaradayCup
      signals:
        beam_current:
          role: readback
          data_type: float
          units: uA
          units_uri: si-unit:MicroA
          description: Beam current measured by Faraday cup.
  device_layer:
    Magnet:
      device_type: Magnet
      has_sub_system:
      - name: Quadrupole
      - name: Dipole
      - name: Corrector
      - name: Solenoid
      has_system_capability: MagnetCapability
    Quadrupole:
      device_type: Quadrupole
      subclass_of: Magnet
      has_system_capability: QuadrupoleCapability
    Dipole:
      device_type: Dipole
      subclass_of: Magnet
      has_system_capability: DipoleCapability
    Corrector:
      device_type: Corrector
      subclass_of: Magnet
      has_system_capability: CorrectorKickCapability
    Solenoid:
      device_type: Solenoid
      subclass_of: Magnet
      has_system_capability: SolenoidCapability
    CavityGradient:
      device_type: CavityGradient
      has_sub_system:
      - name: RFCavity
      has_system_capability: CavityGradientCapability
    RFCavity:
      device_type: RFCavity
      subclass_of: CavityGradient
      has_system_capability: RFCavityCapability
    Instrument:
      device_type: Instrument
      has_sub_system:
      - name: BPM
      - name: FaradayCup
      has_system_capability: InstrumentCapability
    BPM:
      device_type: BPM
      subclass_of: Instrument
      has_system_capability: BPMCapability
    FaradayCup:
      device_type: FaradayCup
      subclass_of: Instrument
      has_system_capability: FaradayCupCapability
  signal_layer:
    facilities:
      CEBAF:
        control_system:
          name: epics
          naming_convention: <device><signal_code>
        signal_definitions:
          magnet_signals:
            device_type: Magnet
            signal_bindings:
              current_setpoint:
                description: EPICS current setpoint PV
                control_system_suffix: .S
              current_readback:
                description: EPICS current readback PV
                control_system_suffix: M
              current_min:
                description: EPICS minimum current limit PV
                control_system_suffix: .HMIN
              current_max:
                description: EPICS maximum current limit PV
                control_system_suffix: .HMAX
              magnet_status:
                description: EPICS status PV
                control_system_suffix: .STAT
          quadrupole_signals:
            device_type: Quadrupole
            signal_bindings:
              strength_setpoint:
                description: EPICS quadrupole strength setpoint PV
                control_system_suffix: .BDL
          corrector_signals:
            device_type: Corrector
            signal_bindings:
              kick_setpoint:
                description: Template EPICS corrector kick setpoint PV
                control_system_suffix: .KICK
          dipole_signals:
            device_type: Dipole
            signal_bindings:
              field_setpoint:
                description: Template EPICS dipole bend field setpoint PV
                control_system_suffix: .BDL
          solenoid_signals:
            device_type: Solenoid
            signal_bindings:
              solenoid_setpoint:
                description: EPICS solenoid integrated field strength setpoint PV
                control_system_suffix: .BDL
          bpm_signals:
            device_type: BPM
            signal_bindings:
              horizontal_beam_position:
                description: EPICS BPM horizontal beam position readback PV
                control_system_suffix: .XPOS
              vertical_beam_position:
                description: EPICS BPM vertical beam position readback PV
                control_system_suffix: .YPOS
              bpm_status:
                description: EPICS BPM status readback PV
                control_system_suffix: .STAT
          faradaycup_signals:
            device_type: FaradayCup
            signal_bindings:
              beam_current:
                description: EPICS Faraday cup beam current readback PV
                control_system_suffix: FCUPK
          rfcavity_signals:
            device_type: RFCavity
            signal_bindings:
              gradient_setpoint:
                description: EPICS cavity gradient setpoint PV
                control_system_suffix: GSET
              gradient_readback:
                description: EPICS cavity gradient readback PV
                control_system_suffix: GMES
              cavity_status:
                description: EPICS cavity status PV
                control_system_suffix: STAT
