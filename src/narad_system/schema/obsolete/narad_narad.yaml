id: https://w3id.org/narad_linkml/schema/narad/narad_narad
name: narad_narad
description: >-
  NARAD capability-layer semantics: profiles, capabilities, signals, and facility signal bindings.
license: CC-BY-4.0
version: 0.1.0

prefixes:
  linkml: "https://w3id.org/linkml/"
  schema: "http://schema.org/"
  sosa: "http://www.w3.org/ns/sosa/"
  qudt: "http://qudt.org/schema/qudt/"
  si-unit: "http://qudt.org/vocab/unit/"
  ncit: "http://purl.obolibrary.org/obo/NCIT_"
  ro: "http://purl.obolibrary.org/obo/RO_"
  owl: "http://www.w3.org/2002/07/owl#"
  swo: "http://purl.obolibrary.org/obo/swo.owl"
  narad: "https://w3id.org/narad_linkml/schema/narad/"

imports:
  - linkml:types

classes:
  NaradConfig:
    description: "NARAD configuration block containing the capability layer."
    slots:
      - schema_version
      - intent
      - capability_layer
      - facility
      - control_system
      - signal_layer

  CapabilityLayer:
    description: "Capability-layer container for profile families and a shared default graph projection."
    slots:
      - default_graph_projection
      - profiles

  SignalLayer:
    description: "Signal-layer container for facility-specific signal bindings."
    slots:
      - facilities

  Facility:
    description: "A facility with specific signal bindings."
    slots:
      - name
      - identifier
      - control_system
      - naming_convention
      - signal_definitions

  SignalDefinitions:
    description: >-
      EPICS signal suffix templates keyed by device type or device domain.
      Use a domain-level key (e.g. Magnet, RFCavity) for signals shared across
      all types in that domain; use a device-type key (e.g. Quadrupole, BPM)
      for type-specific signals. New device types require no schema changes.
    slots:
      - type_signal_sets

  SignalBinding:
    description: "A named EPICS suffix definition for one semantic signal."
    slots:
      - name
      - epics_suffix
      - description

  DeviceTypeSignalSet:
    description: "Signal binding set scoped to a device type (for example, Quadrupole or BPM)."
    slots:
      - name
      - signal_bindings

  CapabilityMixin:
    description: "Shared structure common to all capability types: a description and an ordered list of signals."
    mixin: true
    slots:
      - description
      - signals

  Signal:
    description: "A named semantic signal used by a capability."
    class_uri: sosa:ObservableProperty
    aliases:
      - epics_pv
      - pv
      - process_variable
      - EPICS Process Variable
    broad_mappings:
      - qudt:QuantityKind
    slots:
      - name
      - role
      - data_type
      - units
      - units_uri
      - description

  Capability:
    description: "A named, shared grouping of semantically related signals for a control aspect."
    mixins:
      - CapabilityMixin
    slots:
      - name

  TypeSpecificCapability:
    description: >-
      An inline capability declared within a device-type profile, with its own identifier,
      a semantic class label, a description, and a list of signals. Distinct from the
      shared capabilities referenced by name; these are profile-local definitions.
    mixins:
      - CapabilityMixin
    slots:
      - id
      - capability_class
      - class_curie

  CapabilityProfile:
    description: "A device-type profile that reuses shared capabilities and adds specific capabilities."
    slots:
      - name
      - device_type
      - description
      - is_abstract
      - inherits_shared_capabilities
      - type_specific_capabilities

  NodeLabels:
    description: >-
      Static node-type label strings for the graph projection, covering all node
      categories except Device. The device label is derived from
      ControlProfileFamily.device_domain and need not be repeated here.
    slots:
      - capability_family
      - profile
      - capability
      - signal

  GraphProjection:
    description: "Graph projection metadata for node labels and edge categories."
    slots:
      - node_labels
      - relationships

  Relationship:
    description: >-
      A directed edge type in the NARAD graph projection, modelled after the
      OBO Relation Ontology (RO) ObjectProperty metamodel. Each relationship
      carries an identifier, human-readable label, natural-language description,
      and explicit domain/range node-type constraints.
    class_uri: owl:ObjectProperty
    slots:
      - id
      - domain
      - range
      - subproperty_of
      - inverse_of
      - symmetric
      - transitive
      - asymmetric
      - irreflexive
    slot_usage:
      id:
        range: string
        required: true
      range:
        range: NodeTypeEnum
        required: true
      range_target:
        range: string
        required: true

  ControlProfileFamily:
    description: "A reusable family of control profiles sharing common semantics and structure."
    aliases:
      - capability_profile_family
      - control_profile_family
    slots:
      - name
      - device_domain
      - description
      - shared_capabilities
      - type_profiles
      - graph_projection
    slot_usage:
      graph_projection:
        description: >-
          Optional per-family graph projection override. If absent, the
          CapabilityLayer.default_graph_projection applies. Provide only
          when this family genuinely requires a different projection.
  
  Identifier:
    description: "A globally unique identifier for an entity (e.g., facility), with a specified type (e.g. DOI, ROR, ARK, local)."
    slots:
      - identifier_type
      - identifier_value

  AnyValue:
    class_uri: linkml:Any
    description: "Unconstrained type — accepts any YAML/JSON value (string, number, object, list, etc.)."
  

enums:
  DataTypeEnum:
    description: "Allowed data types for signal values."
    permissible_values:
      null:
        description: >-
          A special value that may represent an unknown, missing, not applicable, or undefined value.
        meaning: ncit:C45255
      int:
        description: >-
          A data type comprised of numbers with no fractional part, including negative and positive values.
        meaning: ncit:C47840
      float:
        description: "A number that can have its decimal point in any position."
        meaning: ncit:C48150
      double:
        description: "A 64-bit floating-point value."
        meaning: ncit:C48870
      string:
        description: "A sequence of characters used to represent text."
        meaning: ncit:C45253
      boolean:
        description: "A data type with two possible values: true and false."
        meaning: ncit:C45254
      boolean_non_null:
        description: "A two-value boolean data type that does not include null flavor."
        meaning: ncit:C95630
      date:
        description: "A calendar date (year, month, day)."
        meaning: ncit:C48871
      coded_value:
        description: "A code value referenced from an external coding system or ontology."
        meaning: ncit:C95637

  ElementKindEnum:
    description: >-
      Controlled vocabulary for beamline element types, shared between the
      capability layer (CapabilityProfile.device_type) and the element layer
      (BeamlineElement.kind). Keeping the enum here ensures that profile device_type
      values stay in sync with element kind values without circular imports.
      Kept intentionally small; ADD new values here as the NARAD schema evolves.
    permissible_values:
      Drift:
        description: "A field-free drift space between elements."
      Marker:
        description: "A zero-length reference point or survey marker."
      BPM:
        description: "Beam Position Monitor."
      Corrector:
        description: "Dipole corrector magnet for orbit correction."
      Dipole:
        description: "Dipole bending magnet."
      Quadrupole:
        description: "Quadrupole focusing/defocusing magnet."
      Solenoid:
        description: "Solenoid magnet."
      RFCavity:
        description: "Radio-frequency accelerating or bunching cavity."
      Instrument:
        description: "Generic beam diagnostic instrument (halo monitor, viewer, etc.)."

  SignalRoleEnum:
    description: "Controlled vocabulary for the semantic role of a signal within a capability."
    permissible_values:
      control:
        description: "A writable signal that commands a device setpoint."
        broad_mappings:
          - sosa:ActuatableProperty
      readback:
        description: "A readable signal that reports a measured or monitored quantity."
        broad_mappings:
          - sosa:ObservableProperty
      constraint:
        description: "A signal that defines an operational limit or boundary on a control quantity."
      status:
        description: "A signal reporting the device or system operational state."
      interlock:
        description: "A signal associated with a machine protection or safety interlock condition."
      diagnostic:
        description: "A signal providing diagnostic or debugging information about a device."

  DeviceDomainEnum:
    description: >-
      High-level device domain for a control profile family. Intentionally kept small; 
      ADD new values here as the NARAD schema evolves.
    permissible_values:
      Magnet:
        description: "Magnet devices: dipoles, quadrupoles, correctors, solenoids."
      Instrument:
        description: "Beam diagnostic instruments: BPMs, screens, halos, viewers, etc."
      RFCavity:
        description: "RF cavity and RF-related devices."

  RelationshipTypeEnum:
    description: "Allowed relationship types in the NARAD graph projection; each corresponds to an RO (Relation Ontology)-inspired directed edge."
    permissible_values:
      has_shared_capability:
        description: >-
          A profile family has a shared capability available to all its member profiles.
          Analogous to ro:has_part for capability composition.
        broad_mappings:
          - ro:0001019
      has_type_profile:
        description: >-
          A profile family has a device-type profile (e.g. Quadrupole, BPM).
      inherits_capability:
        description: >-
          A type-specific profile inherits a named shared capability from its family.
          Sub-relation of has_shared_capability.
      has_type_specific_capability:
        description: >-
          A type profile has a locally-declared type-specific capability.
      has_signal:
        description: >-
          A capability has a semantic signal (EPICS PV or equivalent).
          Broad mapping to sosa:hasResult.
        broad_mappings:
          - ro:0002234
      implemented_by:
        description: >-
          A semantic signal or capability is implemented by a concrete facility binding.
        broad_mappings:
          - swo:0000085
      binds_to:
        description: >-
          A PV signal binding is bound to a physical beamline element.
      located_in:
        description: >-
          A element is contained in an element.
        broad_mappings:
          - ro:0001025
      controlled_by:
        description: >-
          An entity is controlled by a control system element.
        broad_mappings:
          - ro:0002334
      before:
        description: >-
          A beamline element is upstream of another in the beam path.
        broad_mappings:
          - ro:0002411
      after:
        description: >-
          A beamline element is downstream of another in the beam path.
        broad_mappings:
          - ro:0002412

  NodeTypeEnum:
    description: "Node types in the NARAD graph projection; used as domain/range values for Relationship."
    permissible_values:
      Device:
        description: "A physical beamline element (BeamlineElement)."
      CapabilityFamily:
        description: "A control profile family (ControlProfileFamily)."
      Profile:
        description: "A device-type capability profile (CapabilityProfile)."
      Capability:
        description: "A shared capability grouping signals."
      TypeSpecificCapability:
        description: "A profile-local type-specific capability."
      Signal:
        description: "An individual semantic signal (EPICS PV or equivalent)."
      Facility:
        description: "A physical accelerator facility."
      ControlSystem:
        description: "The control system (e.g. EPICS) managing device PVs."
      SignalBinding:
        description: "A concrete facility-specific PV binding for a semantic signal."

  IdentifierTypeEnum:
    description: "Allowed identifier types for facilities and other entities."
    permissible_values: # doi | ark | handle | url | local | other
      doi:
        description: "Digital Object Identifier (DOI)."
      ark:
        description: "Archival Resource Key (ARK)."
      handle:
        description: "Handle System identifier."
      url:
        description: "Uniform Resource Locator (URL)."
      local:
        description: "Local identifier unique within a specific context or namespace."
      other:
        description: "Any other type of identifier not covered by the above categories."

slots:
  narad:
    range: NaradConfig
    inlined: true

  schema_version:
    range: string

  intent:
    range: string

  facility:
    range: string

  control_system:
    range: string

  naming_convention:
    range: string

  capability_layer:
    range: CapabilityLayer
    inlined: true

  profiles:
    range: ControlProfileFamily
    multivalued: true
    inlined: true
    description: "Control profile families keyed by family name."

  id:
    identifier: true
    range: string
    description: "Unique identifier for the entity."

  name:
    identifier: true
    range: string
    description: "Name/identifier of the entity."

  description:
    range: string
    description: "Detailed description of the entity."

  capability_class:
    range: string
    aliases:
      - class
    description: >-
      Semantic class label for a type-specific capability (e.g. QuadrupoleStrengthCapability).
      Serialized as 'class' in source YAML; renamed here to avoid conflict with reserved keywords.

  kind:
    range: string
    description: >-
      Generic kind/type label. Used for Beamline entries (e.g. BeamLine).
      For ControlProfileFamily device domain use device_domain: DeviceDomainEnum.
      For CapabilityProfile device type use device_type: ElementKindEnum.
    aliases:
      - type
      - profile_type

  device_type:
    range: ElementKindEnum
    description: >-
      The specific device type this capability profile targets (e.g. Quadrupole,
      Corrector, BPM). Uses ElementKindEnum to stay in sync with BeamlineElement.kind.

  class_curie:
    range: uriorcurie
    description: >-
      Optional machine-resolvable URI or CURIE for a TypeSpecificCapability class.
      Use the narad: prefix for NARAD-defined classes (e.g. narad:QuadrupoleStrengthCapability),
      or any registered prefix for externally defined capability types.
      New capability classes can be introduced freely by using a suitable namespace.

  role:
    description: "The semantic role of the signal within its capability."
    range: SignalRoleEnum

  data_type:
    description: "The data type of the signal's value."
    range: DataTypeEnum
    broad_mappings:
      - ncit:C42645
      - qudt:Datatype

  units:
    description: "Conventional unit symbol (e.g. A, MV/m, T*m, G/cm)."
    range: string
    broad_mappings:
      - si-unit:Unit

  units_uri:
    range: uriorcurie
    description: >-
      Machine-resolvable QUDT unit reference (e.g. si-unit:A for Ampere,
      si-unit:MegaV-PER-M for MV/m, si-unit:T-M for T*m).
      The si-unit: prefix maps to http://qudt.org/vocab/unit/.
      Companion to the human-readable symbol in the units slot.
      Use the narad:CustomUnit for user-defined units not in QUDT; these should be defined in the graph projection with a narad:CustomUnit class and linked to signals via the units_uri slot.
    broad_mappings:
      - si-unit:Unit

  signals:
    range: Signal
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: "Signals within a capability."

  shared_capabilities:
    range: Capability
    multivalued: true
    inlined: true
    description: "Named shared capabilities reused by profile types in a family."

  inherits_shared_capabilities:
    range: Capability
    multivalued: true
    inlined: false
    description: "Shared capabilities inherited by this profile, cross-referenced by name. The validator checks that referenced names exist in the parent family's shared_capabilities."

  type_specific_capabilities:
    range: TypeSpecificCapability
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: "Type-specific capabilities declared directly in a profile, each with an id, class label, description, and signals."

  type_profiles:
    range: CapabilityProfile
    multivalued: true
    inlined: true
    description: >-
      Device-type profile definitions for this family, keyed by profile name.
      New device types are accommodated by adding a new entry without schema changes.

  device_domain:
    range: DeviceDomainEnum
    description: "High-level device domain that this profile family governs."

  is_abstract:
    range: boolean
    ifabsent: "false"
    description: >-
      If true, this profile is a template or abstract definition not intended to be
      directly assigned to a beamline element. Concrete profiles that refine a
      template should set this to false (the default).

  default_graph_projection:
    range: GraphProjection
    inlined: true
    description: >-
      The canonical graph projection for all profile families in this capability layer.
      Defines the full set of possible node labels (except device, which is derived
      from each family's device_domain) and the complete relationship vocabulary.
      Individual families may provide a graph_projection override when needed.

  graph_projection:
    range: GraphProjection
    inlined: true
    description: "Optional graph projection metadata attached to a profile family."

  node_labels:
    range: NodeLabels
    inlined: true
    description: "Node label mapping for the graph projection."

  capability_family:
    range: string
  profile:
    range: string
  capability:
    range: string
  signal:
    range: string

  relationships:
    range: Relationship
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: "Relationship definitions used in the graph projection."

  label:
    range: string
    description: "Human-readable label for the relationship (e.g. 'has shared capability')."

  domain:
    range: NodeTypeEnum
    description: "The node type that can appear as the subject (source) of this relationship."

  range:
    range: NodeTypeEnum
    description: "The node type that can appear as the object (target) of this relationship."

  subproperty_of:
    range: Relationship
    multivalued: true
    inlined: false
    description: "Parent relationships of which this is a more specific sub-relation."

  inverse_of:
    range: Relationship
    inlined: false
    description: "The inverse relationship, if any."

  symmetric:
    range: boolean
    description: "True if the relation is symmetric: if A rel B then B rel A."

  transitive:
    range: boolean
    description: "True if the relation is transitive: if A rel B and B rel C then A rel C."

  asymmetric:
    range: boolean
    description: "True if the relation is asymmetric: if A rel B then NOT B rel A."

  irreflexive:
    range: boolean
    description: "True if no entity can stand in this relation to itself."

  signal_layer:
    range: SignalLayer
    inlined: true
    description: "Signal-layer container for facility-specific signal bindings."

  facilities:
    range: Facility
    multivalued: true
    inlined: true
    description: "Facility identifiers for facility-specific signal bindings."

  signal_definitions:
    range: SignalDefinitions
    inlined: true

  epics_suffix:
    range: string
    description: "Facility-specific EPICS suffix for a semantic signal."

  type_signal_sets:
    range: DeviceTypeSignalSet
    multivalued: true
    inlined: true
    description: >-
      Signal suffix groups keyed by device type or device domain name.
      Domain-level keys (e.g. Magnet, RFCavity) represent signals shared across
      all types in that domain; device-type keys (e.g. Quadrupole, BPM) are
      type-specific. New device types require no schema changes.

  signal_bindings:
    range: SignalBinding
    multivalued: true
    inlined: true
    description: "Signal definitions keyed by signal name within a device type."

  capability_profile_family:
    range: ControlProfileFamily
    inlined: false
    description: "Cross-reference to the control profile family for this element."

  capability_profile:
    range: CapabilityProfile
    inlined: false
    description: "Cross-reference to the specific capability profile applied to this element."
  
  identifier:
    range: Identifier
    multivalued: true
    inlined: false
    description: "Globally unique identifier for the facility, with specified type and value."

  identifier_type:
    range: IdentifierTypeEnum
    description: "The type of identifier used in the identifier slot (e.g. DOI, ARK, URL, local)."

  identifier_value:
    range: string
    description: "The value of the identifier (e.g. the DOI string, ARK string, URL string, or local ID)."
