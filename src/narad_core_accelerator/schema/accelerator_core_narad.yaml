id: https://w3id.org/accelerator-core
name: accelerator_core
title: Accelerator Core Ontology
description: >-
  A lightweight LinkML schema for facility-agnostic accelerator components,
  their beamline relationships, and associated control-system signals.
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  acc: https://w3id.org/accelerator-core/
  narad: https://w3id.org/narad/
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/
  ssn: http://www.w3.org/ns/ssn/
  ssn-system: http://www.w3.org/ns/ssn/systems/
  sosa: http://www.w3.org/ns/sosa/
  pals: https://pals-project.readthedocs.io/

default_prefix: narad # DM: changed to narad
default_range: string

imports:
  - linkml:types

classes:
  # ---- Abstract base -------------------------------------------------------
  IDThing: # DM: added IDedThing as a common parent for all named entities in the schema, to support generic handling of name and description metadata.
    abstract: true
    description: "Abstract base class providing identity and human-readable metadata."
    slots:
      - id
      - description
    slot_usage:
      description:
        required: false

  #---- Root Class ----------------------------------------------------------
  AcceleratorCoreDataset:
    description: Root container for accelerator core components, semantic signals, and local bindings.
    tree_root: true
    slots:
      - type
      - physical_components
      - virtual_components
      - signals
      - properties
      - beamlines
      - non_beamline

  #---- System and Control System classes ------------------------------------------------
  System: # Added System (IDThing) as a general class for physical, logical, or cyber-physical systems involved in accelerator operation, aligned to SSN System.
    is_a: IDThing
    description: >
      A physical, logical, or cyber-physical system involved in sensing,
      monitoring, control, or actuation. Broadly aligned to ssn:System.
    exact_mappings:
      - ssn:System
    slots:
      - system_type
    slot_usage:
      has_sub_system: # System may have subsystems.
        range: System
        inlined_as_list: true


  ControlSystem: # Added ControlSystem as a specific type of System that manages device process variables, aligned to SSN System with a specific system_type value.
    is_a: System
    description: >
      A control and/or monitoring system (e.g. EPICS or MYA) that manages device process variables.
      In the SSN graph a ControlSystem is a subsystem of the Facility.
    exact_mappings:
      - ssn:System
    slots:
      - source_system
      - naming_convention

  # ---- Beamline and beamline element classes ------------------------------------------------
  # DM: added Beamline and BeamlineElement classes to represent the structure of accelerator beamlines and their elements, which can be linked to components and signals to capture their physical relationships to the beam path.
  Beamline:
    is_a: IDThing
    description: "A top-level NARAD-system for an ordered sequence of beamline elements defining a beam path."
    slots:
      - type
      - multipass
      - length
      - zero_point
      - periodic
      - line
    exact_mappings:
      - pals:BeamLine
  
  ComponentBinding: # DM: added ComponentBinding to represent the facility-specific binding of a physical component to a beamline element, which allows for capturing the physical placement of components in the beamline structure.
    is_a: IDThing
    description: >-
      A single element of the beamline that binds a component 
      to a specific location in the beamline sequence. 
      This allows for capturing the physical placement of components in the beamline structure, which is important for understanding their relationship to the beam path and other components.
    broad_mappings:
      - pals:Element
    slots:
      - type
      - in_region
      - instance_of_component
      - has_parameter_binding

  PhysicalComponentBinding: # DM: added PhysicalComponentBinding as a specific type of ComponentBinding that represents the binding of a physical component to a beamline element, which can be used to capture the physical placement of actual devices in the beamline structure.
    is_a: ComponentBinding
    description: >
      A facility-specific binding that describes how a physical accelerator component is placed or located in the beamline structure. 
      This can be used to capture the physical placement of actual devices in the beamline structure, which is important for understanding their relationship to the beam path and other components.
    broad_mappings:
      - pals:Element
    slots:
      - has_signal_binding
    slot_usage:
      instance_of_component:
        range: PhysicalComponent

  VirtualComponentBinding: # DM: added VirtualComponentBinding as a specific type of ComponentBinding that represents the binding of a virtual component to a beamline element, which can be used to capture the placement of abstract components like Markers or BeamlineSections in the beamline structure.
    is_a: ComponentBinding
    description: >
      A facility-specific binding that describes how a virtual component, such as a Marker or BeamlineSection, is placed or located in the beamline structure. 
      This can be used to capture the placement of abstract components in the beamline structure, which is important for understanding the overall structure and function of the accelerator system even for components that don't have a physical instantiation.
    broad_mappings:
      - pals:Element
    slot_usage:
      instance_of_component:
        range: VirtualComponent

  # ---- Element Classes ------------------------------------------------
  # DM: Added specific classes for common accelerator component types such as Magnet, Quadrupole
  ElementLocation:
    is_a: IDThing
    description: Facility-specific location information for beamline elements and components.
    slots:
      - beamline_name
      - section_id
      - girder_id
      - hall_name

  # ---- Accelerator component and signal classes ------------------------------------------------
  Component: # DM: added Component as a general class for accelerator components, which can be specialized into more specific types like AcceleratorDevice, Magnet, etc.
    is_a: IDThing
    description: A general class for accelerator components, which can be specialized into more specific types like AcceleratorDevice, Magnet, etc.
    slots:
      - type
      - name
      - has_synonyms
      - has_beamline_relation # DM: notice Physical and Virtual Components have different Enums
      - has_function # DM: notice that Physical and Virtual Components have different Enums for function, since virtual components may have more abstract functions or roles that don't fit into the physical device function categories.
      - superclass_of # DM: added superclass_of slot to link to more specific component types like Quadrupole, etc.
      - subclass_of # DM: added subclass_of slot to link to more general component types like Magnet, etc.
      - has_parameters # DM: added has_parameters slot to link components to their important properties or attributes that are not captured by the other specific slots in the schema, which allows for capturing important metadata about components that may be relevant for understanding their behavior or operation.
    slot_usage:
      type:
        required: true
      name:
        required: true
      has_beamline_relation:
        required: true
      located_in:
        required: true
    broad_mappings:
      - pals:Element
  
  PhysicalComponent:
    is_a: Component
    slots:
      - has_signals # DM: added has_signals slot to link components to their associated semantic signals, which is important for understanding the operational meaning of the signals in relation to the physical components.
      - located_in
    slot_usage:
      has_beamline_relation:
        range: PhysicalBeamlineRelationEnum
      has_function:
        range: PhysicalFunctionEnum
    broad_mappings:
      - pals:Element
      
    description: A physical item that participates in or supports accelerator operation.

  VirtualComponent:
    is_a: Component
    description: >-
      A virtual or logical component that represents a concept, function, or role in the accelerator beamline operation but does not have a physical instantiation. 
      This can be used to capture abstract components, such as Markers or BeamlineSections, that are important for understanding the structure and function of the accelerator system but are not physical devices.
    slot_usage:
      has_beamline_relation:
        range: VirtualBeamlineRelationEnum
      has_function:
        range: VirtualFunctionEnum
    broad_mappings:
      - pals:Element
      - pals:BookkeepingElement

  ComponentBinding:
    is_a: IDThing
    slots:
      - type
      - instance_of_component
      - in_region
      - has_parameter_binding
    description: >-
      A single element of the beamline that binds a physical or virtual component 
      to a specific facility-specific instance of the component.
      This allows for capturing the physical placement of components in the beamline structure, which is important for understanding their relationship to the beam path and other components.
    slots:
      - type
    
  PhysicalComponentBinding:
    is_a: ComponentBinding
    description: A physical item that participates in or supports accelerator operation.
    slots:
      - has_signal_binding

  VirtualComponentBinding:
    is_a: ComponentBinding
    description: >-
      A virtual or logical component that represents a concept, function, or role in accelerator operation but does not have a physical instantiation. 
      This can be used to capture abstract components, such as Markers or BeamlineSections, that are important for understanding the structure and function of the accelerator system but are not physical devices.

  #AcceleratorDevice:
  #  description: A physical accelerator device, independent of facility-specific naming.
  #  is_a: PhysicalComponent
  #  broad_mappings:
  #    - pals:Element

  Magnet:
    description: An accelerator device that produces a magnetic field for beam control.
    is_a: PhysicalComponent
    broad_mappings:
      - pals:Element
  
  Solenoid: # DM: added Solenoid as a specific type of Magnet with a primarily longitudinal magnetic field used for focusing, which is a common component type in accelerators that has distinct characteristics from other types of magnets like dipoles or quadrupoles.
    description: A magnet with a primarily longitudinal magnetic field used for focusing. # DM: placeholder description
    is_a: Magnet
    slot_usage:
      has_function:
        required: true
    exact_mappings:
      - pals:Solenoid

  Multipole: # DM: added Multipole as a general class for magnets with higher-order multipole fields, which can be specialized into specific types like Quadrupole, Sextupole, Octupole, etc., and can capture the number of poles as an important parameter.
    description: A general magnet with a higher-order multipole field, such as a sextupole or octupole.
    is_a: Magnet
    slots:
      - has_number_poles
    slot_usage:
      has_function:
        required: true
    broad_mappings:
      - pals:Multipole

  Quadrupole:
    description: A magnet primarily used to focus or defocus the beam. 4 poles.
    is_a: Multipole
    slot_usage:
      has_function:
        required: true
    exact_mappings:
      - pals:Quadrupole

  Corrector:
    description: A magnet primarily used to steer the beam in a transverse plane.
    is_a: Magnet
    slots:
      - has_plane # DM: moved has_plane from PhysicalComponent and PhysicalComponentBinding to Corrector since it's more specific to correctors, which can be horizontal or vertical, whereas other magnet types may not have a specific plane association.
    slot_usage:
      has_function:
        required: true
      has_plane:
        required: true
    broad_mappings:
      - pals:Kicker

  DiagnosticDevice:
    description: An accelerator device used to measure beam or machine state.
    is_a: PhysicalComponent
    broad_mappings:
      - pals:Instrument

  BeamPositionMonitor:
    description: A diagnostic device used to measure transverse beam position.
    is_a: DiagnosticDevice
    slot_usage:
      has_function:
        required: true
    broad_mappings:
      - pals:Instrument

  RadiationMonitor:
    description: A diagnostic device used to monitor radiation dose or dose rate.
    is_a: DiagnosticDevice
    slot_usage:
      has_function:
        required: true
  
  Cavity:
    description: A cavity used for beam acceleration or manipulation.
    is_a: PhysicalComponent
    slot_usage:
      has_function:
        required: true
  
  CrabCavity:
    description: A cavity used for transverse beam manipulation, such as crabbing or deflecting.
    is_a: Cavity
    slot_usage:
      has_function:
        required: true
    exact_mappings:
      - pals:CrabCavity

  RFCavity:
    description: A cavity used for RF acceleration or longitudinal manipulation.
    is_a: Cavity
    slot_usage:
      has_function:
        required: true
    exact_mappings:
      - pals:RFCavity

  VacuumDevice:
    description: An accelerator device associated with the vacuum system.
    is_a: PhysicalComponent

  VacuumPump:
    description: A vacuum device used to generate or maintain vacuum.
    is_a: VacuumDevice
    slot_usage:
      has_function:
        required: true
  
  InfrastructureComponent: # DM: added InfrastructureComponent to represent important physical components that support accelerator operation but don't have a specific physical relationship to the beamline structure, which allows for capturing important infrastructure components that are not inline with the beamline but are still critical for accelerator operation.
    is_a: PhysicalComponent
    description: A physical component that supports accelerator operation without a specific beam-pipe placement, such as a power supply, control rack, or radiation detector.
  
  Marker:
    description: A virtual component used as a reference point or marker in the beamline structure.
    is_a: VirtualComponent
    slot_usage:
      has_function:
        required: true
    exact_mappings:
      - pals:Marker

  # ---- Signal and Signal Binding classes ------------------------------------------------
  ControlSystemSignal:
    is_a: IDThing
    description: Semantic meaning of a control-system signal associated with a component.
    slots:
      - type
      - has_synonyms # DM: added synonyms to ControlSystemSignal to allow for alternative labels for signals, which can be important for capturing different naming conventions or aliases used in different facilities or contexts.
      - observes
      - has_signal_role
      - has_canonical_signal_type
      - has_quantity_kind
      - has_data_type
      - has_unit
    slot_usage:
      observes:
        required: true
      has_signal_role:
        required: true
      has_canonical_signal_type:
        required: true
      has_quantity_kind:
        required: true
      has_unit:
        required: true

  SignalBinding:
    description: >
      Facility-specific binding that describes how a semantic ControlSystemSignal
      is locally identified, accessed, or realized in a source system such as EPICS,
      PALS-Ext, MYA, an element database, a channel database, or a simulation service.
    slots:
      - id
      - type
      - instance_of_signal
      - native_identifier
      - source_system
      - native_description
      - native_unit
      - access_protocol
      - archive_identifier

  Parameter:
    is_a: IDThing
    description: >-
      A parameter, property or attribute of a component (physical or virtual) that is important 
      for understanding its behavior, operation, or relationships.
      This allows for capturing important metadata about components 
      that may not be covered by the other specific slots in the schema.
    slots:
      - type
      - has_data_type
      - has_synonyms
      - pals_parameter_group
      - pals_parameter_name
      - parameter_of

  ParameterBinding:
    is_a: IDThing
    description: >-
      A facility-specific binding that describes how a semantic Parameter is 
      locally identified and realized in a source system 
      such as EPICS, PALS-Ext, MYA, an element database, a channel database, or a simulation service.
    slots:
      - type
      - instance_of_parameter
      - value

#---- Subsets ----------------------------------------------------------
  # Subsets of narad classes for documentation and enabling validation of partial graphs. 
  # These are not intended to be used as types for slot range constraints, 
  # but rather as a way to document and validate expected usage patterns in the graph. 
subsets:
  relationship:
    description: Subset of relationships between components, signals, and beamline elements.
  ontological:
    description: Subset of ontological metadata about components and signals, such as function, plane, signal role, canonical signal type, quantity kind, and unit.


slots:
  # --- Common metadata slots ---------------------------------------------------
  id:
    description: Stable identifier for an instance.
    identifier: true
    required: true
    range: string

  type:
    description: Specific LinkML class used for this record, such as BeamPositionMonitor, Quadrupole, ControlSystemSignal, or SignalBinding.
    range: string
    in_subset:
      - ontological # DM: added in_subset to indicate that this is a key ontological metadata slot that specifies the specific type of component or signal being described, which can be used for validation and querying of the graph.

  name:
    description: Human-readable label.
    range: string
    in_subset:
      - ontological # DM: added in_subset to indicate that this is a key ontological metadata slot that specifies the specific type of component or signal being described, which can be used for validation and querying of the graph.

  description:
    description: Human-readable description.
    range: string
    in_subset:
      - ontological # DM: added in_subset to indicate that this is a key ontological metadata slot that specifies the specific type of component or signal being described, which can be used for validation and querying of the graph.

  has_synonyms:
    description: Alternative human-readable labels.
    range: string
    multivalued: true
    in_subset:
      - ontological # DM: added in_subset to indicate that this is a key ontological metadata slot that specifies the specific type of component or signal being described, which can be used for validation and querying of the graph.

  # ---- Beamline definitionslots ------------------------------------------------
  # DM: Added beamlines, elements, and multipass slots
  beamlines:
    range: Beamline
    multivalued: true
    inlined: true
    description: "A top-level NARAD-system container for the ordered beamline definitions keyed by beamline name. Serializes as a keyed map by beamline name."

  multipass:
    range: boolean
    description: "Indicates whether this beamline is a multipass recirculating line (true) or a single-pass line (false)."
    exact_mappings:
      - pals:Multipass

  # ---- Naming Convention slots ------------------------------------------------
  # DM: Added control_system, system_type, naming_convention, 
  # override_naming_convention, template, and template_components 
  # examples, and example slots to ControlSystem to capture the control system instance, its type (Control, Monitoring, or ControlAndMonitoring), the general naming convention template(s) it uses for constructing control system PV names, and any specific override naming convention for exceptions to the general template.
  control_system:
    range: ControlSystem
    multivalued: false
    inlined: true
    description: "Control system definition for control and/or monitoring signals in this dataset, such as EPICS or MYA."
    broad_mappings:
      - ssn:System
  
  system_type:
    range: SystemTypeEnum
    description: "Type of control system, such as Control, Monitoring, or ControlAndMonitoring."
    required: true

  # ---- Component relationship slots ------------------------------------------------
  superclass_of:
    description: Subclasses of this class.
    range: PhysicalComponent
    multivalued: true
    inlined_as_list: true
    in_subset:
      - relationship
  
  subclass_of:
    description: Superclass of this class.
    range: PhysicalComponent
    multivalued: false
    in_subset:
      - relationship

  # ---- Beamline and Beamline Element slots ------------------------------------------------

  multipass:
    range: boolean
    description: "Indicates whether this beamline is a multipass recirculating line (true) or a single-pass line (false)."
    exact_mappings:
      - pals:multipass

  zero_point:
    range: BeamlineElement
    description: >-
      Name of a line item used as a reference point when 
      the beamline is used as a subline."
    exact_mappings:
      - pals:zero_point
  
  periodic:
    range: boolean
    description: "For a beamline, indicates whether the orbit and Twiss parameters are periodic (true) or non-periodic (false)."
    exact_mappings:
      - pals:periodic
  
  length:
    range: float
    description: "Physical length of the element in meters."
    exact_mappings:
      - pals:length

  line:
    range: ComponentBinding
    multivalued: true
    inlined: false
    description: _.
      Ordered sequence of beamline elements in this beamline. 
      Each element represents a specific component binding at a specific location in the beamline sequence, which can be used to capture the physical placement of components in the beamline structure and their relationship to the beam path. 
      The line is ordered according to the beam path, so that the first element in the line corresponds to the first component encountered by the beam, and so on.
    exact_mappings:
      - pals:line

  non_beamline:
    range: ComponentBinding
    multivalued: true
    inlined: false
    description: >
      Components that are not physically (or virtually) on the beamline but are still important for understanding the overall accelerator system, such as power supplies, control racks, radiation detectors, or other infrastructure. 
      This allows for capturing important components that support accelerator operation but don't have a specific physical relationship to the beamline structure.

  instance_of_component:
    description: >
      Links a facility-specific instance element to
      the PhysicalComponent that defines it.

      Broadly maps to rdf:type, but is specifically intended to link a facility-specific instance of a beamline element, 
      or environmental monitor element to the canonical PhysicalComponent, VirtualComponent, or EnvironmentalMonitor class that defines its type.
      Values are typically the specific component or signal type, such as kick_setpoint, or Quadrupole, or BeamPositionMonitor, etc.
    in_subset:
      - relationship
    broad_mappings:
      - rdf:type
    range: Component
    multivalued: false

  in_region:
    description: >
      The region, area, or section of the accelerator facility where this component is located or operates. 
      This can be used to capture location information that is important for understanding the operational context of the component, such as which hall, sector, or region it is in.
    range: string

  has_signal_binding:
    description: Facility-specific bindings for semantic signals associated with this component.
    multivalued: true
    inlined_as_list: true
    is_subset:
      - relationship
    range: SignalBinding
  
  has_parameter_binding:
    description: Facility-specific bindings for semantic parameters associated with this component.
    multivalued: true
    inlined_as_list: true
    in_subset:
      - relationship
    range: ParameterBinding

  components:
    description: Physical accelerator components in the dataset.
    range: PhysicalComponent
    multivalued: true
    inlined_as_list: true
    required: true

  signals:
    description: Semantic control-system signals in the dataset.
    range: ControlSystemSignal
    multivalued: true
    inlined_as_list: true
    required: true

  has_signals:
    description: Signal associated with this physical component.
    range: ControlSystemSignal
    multivalued: true
    in_subset: # DM: added in_subset relationship to indicate that this is a key relationship linking components to their semantic signals, which can be used for validation and querying of the graph.
      - relationship

  instance_of_signal:
    description: >
      The semantic ControlSystemSignal that this local binding realizes or accesses.
    range: ControlSystemSignal
    required: true
    in_subset: # DM: added in_subset relationship to indicate that this is a key relationship linking components to their semantic signals, which can be used for validation and querying of the graph.
      - relationship

  observes:
    description: Physical component that this signal describes or controls.
    range: Component
    multivalued: true # DM: added multivalued to allow a signal to be associated with multiple components if needed, such as corrector_status being associated with both HCorrector and VCorrector.
    in_subset: # DM: added in_subset relationship to indicate that this is a key relationship linking components to their semantic signals, which can be used for validation and querying of the graph.
      - relationship

  has_beamline_relation:
    description: Physical or deployment relationship to the beamline or beam pipe.
    range: PhysicalBeamlineRelationEnum

  has_function:
    description: Broad device-level purpose.
    range: PhysicalFunctionEnum
    multivalued: true

  has_plane:
    description: Transverse plane associated with a component or signal.
    range: PlaneEnum
  
  has_number_poles:
    description: Number of poles for a multipole magnet, such as 2 for a dipole, 6 for a sextupole, 8 for an octupole, etc.
    range: integer
  
  has_parameters:
    description: Important properties or attributes of a component that are not captured by the other specific slots in the schema.
    multivalued: true
    inlined_as_list: true
    range: Parameter
  

  located_in: # Changing this to a Class definition and slot to allow for more structured location information in the future, such as specific areas, regions, or organizational units within a facility, rather than just a free-text string.
    description: Facility-local location, area, region, or organizational placement.
    range: ElementLocation

  location:
    description: Facility-specific location information for beamline elements and components.
    range: ElementLocation

  has_signal_role:
    description: Operational role of a control-system signal.
    range: SignalRoleEnum

  has_canonical_signal_type:
    description: Portable semantic meaning of a control-system signal.
    range: CanonicalSignalTypeEnum

  has_quantity_kind:
    description: Physical quantity represented by a control-system signal.
    range: QuantityKindEnum

  has_unit:
    description: Normalized engineering unit for a semantic control-system signal value.
    range: UnitEnum

  native_name:
    description: Deprecated facility-local native PV, channel, or signal name.
    deprecated: Use SignalBinding.native_identifier instead.
    range: string

  native_identifier:
    description: >
      Facility-local source identifier for the signal in the source system, such as
      an EPICS PV name, PALS-Ext channel name, archiver channel, element database key,
      or simulation signal identifier.
    range: string
    required: true

  source_system:
    description: >
      Source system in which the native identifier is valid.
    range: SourceSystemEnum
    required: true
    in_subset: # DM: added in_subset relationship to indicate that this is a key relationship linking components to their semantic signals, which can be used for validation and querying of the graph.
      - relationship

  native_description:
    description: >
      Optional source-system description or label for the native signal.
    range: string

  native_unit:
    description: >
      Unit reported by the source system before normalization. This may differ from
      the normalized semantic unit recorded on ControlSystemSignal.
    range: UnitEnum

  access_protocol:
    description: >
      Optional access protocol or mechanism used to retrieve the native signal.
    range: string

  archive_identifier:
    description: >
      Optional identifier used by an archive or historical data service, if different
      from the native identifier.
    range: string

  #----- Parameter and ParameterBinding slots ------------------------------------------------
  has_data_type:
    description: Data type of a parameter value, such as string, integer, float, boolean, etc.
    range: DataTypeEnum
    multivalued: false

  pals_parameter_group:
    description: >-
      Optional grouping or category for a parameter based on the Particle Accelerator Language Standard (PALS)
      lattice element parameter groups. Examples include "ApertureP" for Aperture Parameters, and "BendP" for Bend Parameters.
    range: string

  pals_parameter_name:
    description: >-
      Optional standardized parameter name based on the Particle Accelerator Language Standard (PALS) lattice 
      element parameter name. Examples include "rho_ref" for the radian reference bend angle, and
      "aperture_x" for the horizontal aperture size, or
      "alias" for an alternate name of the element.
    range: string

  parameter_of:
    description: The component (physical or virtual) that this parameter describes or is associated with.
    range: Component
    multivalued: true
    inlined_as_list: true

  instance_of_parameter:
    description: >
      Links a facility-specific parameter binding to the canonical Parameter that defines its type and meaning.

      Broadly maps to rdf:type, but is specifically intended to link a facility-specific instance of a parameter binding to the canonical Parameter class that defines its type and meaning.
      Values are typically the specific parameter type, such as horizontal_aperture, or rho_ref, or alias, etc.
    in_subset:
      - relationship
    broad_mappings:
      - rdf:type
    range: Parameter
    multivalued: false

  value:
    description: The value of this parameter binding, which can be a string, number, boolean, or other data type depending on the parameter.
    range: string


# ---- Enums ---------------------------------------------------------------
enums:
  SourceSystemEnum:
    description: Controlled values for facility-local source systems.
    permissible_values:
      EPICS:
        description: EPICS control system.
      EPICS_ChannelAccess:
        description: EPICS Channel Access source.
      PALS_Ext:
        description: PALS-Ext or middle-layer channel/export system.
      MYA:
        description: MYA archive or historical channel service.
      ElementDatabase:
        description: Facility element database.
      ChannelDatabase:
        description: Facility channel database.
      Simulation:
        description: Simulation or model-derived signal source.
      Other:
        description: Other source system.

  SystemTypeEnum:
    description: Controlled values for system types.
    permissible_values:
      Control:
        description: A system that provides control functions for accelerator components, such as EPICS or MYA.
      Monitoring:
        description: A system that provides monitoring functions for accelerator components, such as EPICS or MYA.
      ControlAndMonitoring:
        description: A system that provides control and/or monitoring of accelerator components, such as EPICS or MYA.
      #TimingAndSynchronization:
      #  description: A system that provides timing or synchronization signals for accelerator operation, such as a timing system or event system.
      #MachineProtection:
      #  description: A system that provides machine protection functions, such as a machine protection system or interlock system.

  PhysicalBeamlineRelationEnum:
    description: Controlled values for physical relation to the beamline.
    permissible_values:
      Inline:
        description: Beam passes through the physical component or beamline aperture. The physical component is physically on the beamline.
      AttachedToPipe:
        description: Mechanically attached to the beam pipe or vacuum envelope.
      NearBeamline:
        description: Near and operationally associated with the beamline.
      Infrastructure:
        description: Supports accelerator operation without a specific beam-pipe placement.

  VirtualBeamlineRelationEnum: # Chris and Todd need to evaluate this idea and ontology
    description: Controlled values for virtual relation to the beamline.
    permissible_values:
      Inline:
        description: >-
          Beam passes through the virtual component or beamline aperture. 
          Used for virtual components like Markers that represent important locations on the beamline but don't have a physical instantiation.
      AssociatedWithBeamline:
        description: >-
          Not inline with the beamline but still operationally associated with it. 
          Used for virtual components that are important for understanding the beamline structure and function but don't have a direct physical relationship to the beam path, 
          such as BeamlineSections or Markers that are not inline with the beam.
      NotAssociatedWithBeamline:
        description: >-
          Not inline with the beamline and not operationally associated with it. 
          Used for virtual components that are more abstract and don't have a specific relationship 
          to the beamline, such as a virtual component representing a control system function 
          or role that is important for understanding the overall accelerator system but doesn't have a direct relationship to the beamline structure.


  PhysicalFunctionEnum:
    description: Broad device-level functions.
    permissible_values:
      Focusing:
        description: Focuses or defocuses the beam.
      Steering:
        description: Steers the beam in a transverse plane.
      BeamPositionMeasurement:
        description: Measures transverse beam position.
      VacuumGeneration:
        description: Generates or maintains vacuum.
      RadiationMonitoring:
        description: Monitors radiation dose or dose rate.
      Measurement:
        description: Measures beam or machine state.
#      BeamAcceleration:
#        description: Accelerates the beam.
#      BeamLossDetection:
#        description: Detects beam loss.
#      BeamCurrentMeasurement:
#        description: Measures beam current or intensity.
#      BeamProfileMeasurement:
#        description: Measures beam profile.
#      MachineProtection:
#        description: Supports machine protection.
#      TimingSynchronization:
#        description: Supports timing or synchronization.

  VirtualFunctionEnum: # Chris and Todd need to evaluate this idea and ontology
    description: Broad virtual component functions or roles.
    permissible_values:
      BeamlineSection:
        description: >-
          A section of the beamline used for organizational or functional grouping of components, such as a linac section, transfer line, or ring sector.
      Mark:
        description: >-
          A virtual component representing an important location on the beamline, 
          such as a reference point for beam-based alignment, a location of a known aperture restriction, 
          or a location of a critical diagnostic device.
      ControlFunction:
        description: >-
          A virtual component representing a control system function or role
          that is important for understanding the overall accelerator system 
          but doesn't have a direct relationship to the beamline structure, 
          such as the EPICS control system that manages device process variables across the accelerator.

  PlaneEnum:
    description: Controlled values for transverse plane.
    permissible_values:
      Horizontal:
        description: Horizontal transverse plane.
      Vertical:
        description: Vertical transverse plane.

  SignalRoleEnum:
    description: Operational roles for control-system signals.
    permissible_values:
      Setpoint:
        description: Requested or configured value.
      Readback:
        description: Measured or reported value.
      Status:
        description: State or condition indicator.
      Command:
        description: Command or action trigger.
      Limit: # DM: Added Limit signal role to indicate that a signal represents a constraint such as a minimum or maximum allowed value, which is important for understanding the operational meaning of the signal and how it should be used in monitoring or control.
        description: Minimum, maximum, or other constraints for an allowed value.

  CanonicalSignalTypeEnum:
    description: Portable semantic meanings for important signals.
    permissible_values:
      HorizontalBeamPosition:
        description: Horizontal beam position signal.
      VerticalBeamPosition:
        description: Vertical beam position signal.
      HorizontalBeamPositionOffset:
        description: Horizontal beam position offset signal.
      VerticalBeamPositionOffset:
        description: Vertical beam position offset signal.
      BeamIntensity:
        description: Beam intensity or current signal.
      DeviceStatus:
        description: Device status signal.
      GradientSetpoint: # DM: added this for the RF Cavity setpoint. Is this correct?
        description: Cavity accelerating gradient setpoint signal.
      GradientReadback: # DM: added this for the RF Cavity readback. Is this correct?
        description: Cavity accelerating gradient readback signal.
      MagnetCurrentSetpoint:
        description: Magnet current setpoint signal.
      MagnetCurrentReadback:
        description: Magnet current readback signal.
      MagnetFieldSetpoint: # DM: I added this for the Dipole.
        description: Magnet field setpoint signal.
      IntegratedFieldSetpoint:
        description: Integrated magnetic field setpoint signal.
      IntegratedFieldReadback:
        description: Integrated magnetic field readback signal.
      VacuumPressure:
        description: Vacuum pressure signal.
      IonPumpCurrent:
        description: Ion pump current signal.
      IonPumpVoltage:
        description: Ion pump voltage signal.
      GammaDoseRate:
        description: Gamma radiation dose-rate signal.
      NeutronDoseRate:
        description: Neutron radiation dose-rate signal.
      Status: # DM: Added a generic DeviceStatus canonical signal type for status signals that don't fit into more specific categories, such as corrector status, BPM device status, etc.
        description: Generic status signal for a device.

  QuantityKindEnum:
    description: Physical quantity kinds for signals.
    permissible_values:
      BeamPosition:
        description: Beam transverse position.
#      BeamCurrent:
#        description: Beam current or intensity.
      State:
        description: Device state or condition.
      ElectricCurrent:
        description: Electric current.
      IntegratedMagneticField:
        description: Integrated magnetic field.
      MagneticField:
        description: Magnetic field. # DM: added this for the Dipole field_setpoint. Is this correct?
      Pressure:
        description: Gas or vacuum pressure.
      DoseRate:
        description: Radiation dose rate.
#      Voltage:
#        description: Electric potential difference.
#      Power:
#        description: Power.
#      CavityPhase:
#        description: Cavity phase.
      CavityGradient:
        description: Cavity accelerating gradient.

  UnitEnum:
    description: >-
      Engineering units using ASCII-safe enum names. Values map to QUDT unit
      IRIs with the LinkML meaning field when an exact QUDT unit is available.
    permissible_values:
      mm:
        description: millimeter
        meaning: unit:MilliM
      A:
        description: ampere
        meaning: unit:A
      T_m:
        description: tesla meter
        meaning: unit:T-M
      Pa:
        description: pascal
        meaning: unit:PA
      Torr:
        description: torr
        meaning: unit:TORR
      rem_per_h:
        description: >-
          rem per hour. Kept as a local accelerator unit value because QUDT
          publishes rem and rem-per-second but no exact rem-per-hour unit in
          the checked vocabulary.
      mrem_per_h:
        description: >-
          millirem per hour. Kept as a local accelerator unit value because
          QUDT publishes related radiation units but no exact millirem-per-hour
          unit in the checked vocabulary.
      V:
        description: volt
        meaning: unit:V
      kW:
        description: kilowatt
        meaning: unit:KiloW
      degree:
        description: degree
        meaning: unit:DEG
      MV_per_m:
        description: megavolt per meter
        meaning: unit:MegaV-PER-M
      G_per_cm: # DM: I added this for the Quadrupole setpoint. Is this correct?
        description: gauss per centimeter
        meaning: unit:Gs
      unitless:
        description: dimensionless value
        meaning: unit:NUM

  DataTypeEnum:
    description: Data types for parameter values.
    permissible_values:
      String:
        description: string data type
        meaning: type:STRING
      Integer:
        description: integer data type
        meaning: type:INT
      Float:
        description: floating-point data type
        meaning: type:FLOAT
      Boolean:
        description: boolean data type
        meaning: type:BOOLEAN