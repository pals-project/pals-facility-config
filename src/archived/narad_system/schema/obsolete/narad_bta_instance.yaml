narad_config:
  schema_version: '0.1'
  intent: NARAD extension for capability-layer semantics and facility-specific signal
    bindings
  deployed_system: BTA
  has_sub_system:
    - ado
  control_capability_layer:
    MagnetCapability:
      description: Shared current-control semantics for powered magnets.
      device_type: Magnet
      signals:
        current_setpoint:
          role: control
          data_type: float
          units: A
          units_uri: si-unit:A
          description: Desired magnet current command.
        current_readback:
          role: readback
          data_type: float
          units: A
          description: Measured magnet current.
        current_range:
          role: constraint
          data_type: float
          units: A
          units_uri: si-unit:A
          description: Minimum and Maximum allowed current setting.
        magnet_status:
          role: status
          data_type: string
          description: Power-supply or device state summary.
    QuadrupoleCapability:
      description: Control and observe the normalized quadrupole strength.
      device_type: Quadrupole
      subclass_of: MagnetCapability
      signals:
        strength_setpoint:
          role: control
          data_type: float
          units: G/cm
          units_uri: si-unit:Gs
          description: Desired integrated quadrupole strength or equivalent model quantity.
    DipoleCapability:
      description: Control and observe the dipole bend field.
      device_type: Dipole
      subclass_of: MagnetCapability
      signals:
        field_setpoint:
          role: control
          data_type: float
          units: T*m
          units_uri: si-unit:T-M
          description: Desired dipole bend field or equivalent model quantity.
    CorrectorKickCapability:
      description: Control and observe the corrector kick.
      device_type: Corrector
      subclass_of: MagnetCapability
      signals:
        kick_setpoint:
          role: control
          data_type: float
          units: T*m
          units_uri: si-unit:T-M
          description: Desired integrated corrector kick or equivalent model quantity.
    InstrumentCapability:
      description: Shared readback semantics generic instruments.
      device_type: Instrument
      signals:
        status:
          role: readback
          data_type: string
          units: mm
          units_uri: si-unit:MilliM
          description: generic instrument status readback.
    BPMCapability:
      description: Shared readback semantics for beam position monitor instruments.
      device_type: BPM
      subclass_of: InstrumentCapability
      signals:
        horizontal_beam_position:
          role: readback
          data_type: float
          units: mm
          units_uri: si-unit:MilliM
          description: Measured horizontal beam position.
        vertical_beam_position:
          role: readback
          data_type: float
          units: mm
          units_uri: si-unit:MilliM
          description: Measured vertical beam position.
    MultiwireCapability:
      description: Shared readback semantics for multi-wire beam profile monitor instruments.
      device_type: Multiwire
      subclass_of: InstrumentCapability
      signals:
        horizontal_profile:
          role: readback
          data_type: float
          units: V
          units_uri: si-unit:volt
          description: Measured horizontal beam intensity profile.
        vertical_profile:
          role: readback
          data_type: float
          units: V
          units_uri: si-unit:volt
          description: Measured vertical beam intensity profile.
        insertion_status:
          role: status
          data_type: string
          description: Insertion status of the Multi-wire monitor.
  device_layer:
    Magnet:
      device_type: Magnet
      has_sub_system:
        - name: Quadrupole
        - name: Dipole
        - name: Corrector
      has_system_capability: MagnetCapability
    Quadrupole:
      device_type: Quadrupole
      subclass_of: Magnet
      has_system_capability: QuadrupoleCapability
    Dipole:
      device_type: Dipole
      subclass_of: Magnet
      has_system_capability: DipoleCapability
    Corrector:
      device_type: Corrector
      subclass_of: Magnet
      has_system_capability: CorrectorKickCapability
    Instrument:
      device_type: Instrument
      has_sub_system:
        - name: BPM
        - name: Multiwire
      has_system_capability: InstrumentCapability
  signal_layer:
    facilities:
      BTA:
        facility_identifier:
          - identifier_type: url
            identifier_value: https://jacow.org/PAC2009/papers/TH6PFP014.pdf
        control_system:
          name: ado
          naming_convention: <device><signal_code>
        signal_definitions:
          magnet_signals:
            device_type: Magnet
            signal_bindings:
              current_setpoint:
                description: ADO current setpoint name
                control_system_suffix: :setpointS
              current_readback:
                description: ADO current readback name
                control_system_suffix: :currentM
              current_range:
                description: ADO minimum current range
                control_system_suffix: :rangeC
              magnet_status:
                description: ADO status name
                control_system_suffix: :stateS
          multiwire_signals:
            device_type: Multiwire
            signal_bindings:
              horizontal_profile:
                description: ADO horizontal multi-wire data name
                control_system_suffix: :horInDataM
              vertical_profile:
                description: ADO vertical multi-wire data name
                control_system_suffix: :verInDataM
              insertion_status:
                description: ADO insertion status name
                control_system_suffix: :harpIsM
