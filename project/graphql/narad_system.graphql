# metamodel_version: 1.7.0
enum DataTypeEnum
  {
    int
    float
    double
    string
    boolean
    coded_value
  }

enum ElementKindEnum
  {
    Drift
    Marker
    BPM
    Corrector
    Dipole
    Quadrupole
    Solenoid
    CavityGradient
    RFCavity
    Instrument
    Magnet
  }

enum IdentifierTypeEnum
  {
    doi
    ark
    handle
    url
    local
    other
  }

enum SignalRoleEnum
  {
    control
    readback
    constraint
    status
  }

enum SystemTypeEnum
  {
    Facility
    ControlSystem
    Magnet
  }

type ActuatableSignal
  {
    name: String!
    description: String
    role: SignalRoleEnum
    dataType: DataTypeEnum
    units: String
    unitsUri: String
  }

scalar AnyValue

type Beamline
  {
    name: String!
    description: String
    multipass: Boolean
    length: Float
    zeroPoint: BeamlineElement
    periodic: Boolean
    line: [BeamlineElement]
  }

type BeamlineElement
  {
    name: String!
    description: String
    isInstanceOf: [ElementKindEnum]
    length: Float
    isObservedBy: [InstanceSignalBinding]
    paramSet: ElementParamSet
  }

type Capability
  {
    name: String!
    description: String
    deviceType: ElementKindEnum
    subclassOf: Capability
    hasSignal: [Signal]!
    isPropertyOf: ControlSystem
  }

type CapabilityLayer
  {
    capabilities: [Capability]
  }

type ControlSystem
  {
    name: String!
    description: String
    hasNamingConvention: [NamingConvention]
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
  }

type DeployedSystem
  {
    name: String!
    description: String
    hasSubSystem: [System]
    facilityIdentifier: [FacilityIdentifier]
    hasControlSystem: ControlSystem
    systemType: SystemTypeEnum
    hasSystemCapability: [SystemCapability]!
  }

type Device
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    deviceType: ElementKindEnum!
    hasSubSystem: [System]
    subclassOf: System
    hasSystemCapability: [SystemCapability]
    isObservedBy: [SignalBinding]
  }

type ElementParamSet
  {
    frequency: Float
    voltage: Float
    phase: Float
    angleRef: Float
    e1: Float
    e2: Float
    kn1: Float
    ksol: Float
    facilityParamSet: FacilityParamSet
  }

type FacilityIdentifier
  {
    identifierType: IdentifierTypeEnum
    identifierValue: String
  }

type FacilityParamSet
  {
    facilityElementType: String
    modeledAs: String
    properties: AnyValue
  }

type FacilitySystem
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
    hasControlSystem: ControlSystem
    hostsDevice: [Device]
  }

type InstanceSignalBinding
  {
    name: String!
    description: String
    pvName: String
    isInstanceOf: [Signal]
    forProperty: [SignalBinding]
    isHostedBy: String
    isPropertyOf: ControlSystem
  }

type Instrument
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
  }

interface NamedThing
  {
    name: String!
    description: String
  }

type NamingConvention
  {
    name: String!
    description: String
    template: String
    templateComponents: [TemplateComponent]
    fullPattern: String
    examples: [NamingConventionExample]
  }

type NamingConventionExample
  {
    example: String!
    description: String
  }

type NaradConfig
  {
    schemaVersion: String!
    intent: String
    deployedSystem: DeployedSystem!
    controlSystem: ControlSystem!
    capabilityLayer: [Capability]!
    deviceLayer: [Device]!
    signalLayer: SignalLayer!
  }

type NaradModel
  {
    naradConfig: NaradConfig
    beamlines: [Beamline]
    elements: [BeamlineElement]
  }

type ObservableSignal
  {
    name: String!
    description: String
    role: SignalRoleEnum
    dataType: DataTypeEnum
    units: String
    unitsUri: String
  }

type Signal
  {
    name: String!
    description: String
    role: SignalRoleEnum
    dataType: DataTypeEnum
    units: String
    unitsUri: String
  }

type SignalBinding
  {
    name: String!
    description: String
    signalCodeSuffix: String
  }

type SignalLayer
  {
    facilities: [FacilitySystem]
  }

type System
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
  }

type SystemCapability
  {
    name: String!
    description: String
    forProperty: [String]
    deviceType: ElementKindEnum
  }

type TemplateComponent
  {
    name: String!
    description: String
    required: Boolean
    pattern: String
  }

type TemplateExample
  {
    example: String!
    description: String
  }
