# metamodel_version: 1.7.0
enum DataTypeEnum
  {
    int
    float
    double
    string
    boolean
    coded_value
  }

enum ElementKindEnum
  {
    Drift
    Marker
    BPM
    Corrector
    Dipole
    Quadrupole
    Solenoid
    CavityGradient
    RFCavity
    Instrument
    Magnet
  }

enum IdentifierTypeEnum
  {
    doi
    ark
    handle
    url
    local
    other
  }

enum SignalRoleEnum
  {
    control
    readback
    constraint
    status
  }

enum SystemTypeEnum
  {
    Facility
    ControlSystem
    Magnet
  }

type ActuatableSignal
  {
    name: String!
    description: String
    role: SignalRoleEnum
    dataType: DataTypeEnum
    units: String
    unitsUri: String
  }

scalar AnyValue

type Beamline
  {
    name: String!
    description: String
    multipass: Boolean
    length: Float
    zeroPoint: BeamlineElement
    periodic: Boolean
    line: [BeamlineElement]
  }

type BeamlineElement
  {
    name: String!
    description: String
    isInstanceOf: [String]
    length: Float
    instanceSignalBindings: [InstanceSignalBinding]
    paramSet: ElementParamSet
  }

type CapabilityLayer
  {
    controlCapabilities: [ControlCapability]
  }

type ControlCapability
  {
    name: String!
    description: String
    deviceType: ElementKindEnum
    subclassOf: System
    signals: [Signal]!
  }

type ControlSystem
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
    namingConvention: String
  }

type DeviceSystem
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    deviceType: ElementKindEnum
    hasSubSystem: [System]
    subclassOf: System
    hasSystemCapability: [SystemCapability]
  }

type ElementParamSet
  {
    frequency: Float
    voltage: Float
    phase: Float
    angleRef: Float
    e1: Float
    e2: Float
    kn1: Float
    ksol: Float
    facilityParamSet: FacilityParamSet
  }

type FacilityIdentifier
  {
    identifierType: IdentifierTypeEnum
    identifierValue: String
  }

type FacilityParamSet
  {
    facilityElementType: String
    modeledAs: String
    properties: AnyValue
  }

type FacilitySystem
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
    facilityIdentifier: [FacilityIdentifier]
    controlSystem: ControlSystem
    namingConvention: String
    signalDefinitions: [SignalDefinitions]
  }

type InstanceSignalBinding
  {
    name: String!
    description: String
    pvName: String
    isInstanceOf: [String]
    forProperty: [String]
    isHostedBy: String
    isPropertyOf: String
  }

type Instrument
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
  }

interface NamedThing
  {
    name: String!
    description: String
  }

type NaradConfig
  {
    schemaVersion: String!
    intent: String
    deployedSystem: FacilitySystem!
    hasSubSystem: [ControlSystem]!
    controlCapabilityLayer: [ControlCapability]!
    deviceLayer: [DeviceSystem]!
    signalLayer: SignalLayer!
  }

type NaradModel
  {
    naradConfig: NaradConfig
    beamlines: [Beamline]
    elements: [BeamlineElement]
  }

type ObservableSignal
  {
    name: String!
    description: String
    role: SignalRoleEnum
    dataType: DataTypeEnum
    units: String
    unitsUri: String
  }

type Signal
  {
    name: String!
    description: String
    role: SignalRoleEnum
    dataType: DataTypeEnum
    units: String
    unitsUri: String
  }

type SignalBinding
  {
    name: String!
    description: String
    controlSystemSuffix: String
  }

type SignalDefinitions
  {
    name: String!
    description: String
    deviceType: ElementKindEnum
    signalBindings: [SignalBinding]
  }

type SignalLayer
  {
    facilities: [FacilitySystem]
  }

type System
  {
    name: String!
    description: String
    systemType: SystemTypeEnum
    hasSubSystem: [System]
    hasSystemCapability: [SystemCapability]
  }

type SystemCapability
  {
    name: String!
    description: String
    forProperty: [String]
    deviceType: ElementKindEnum
  }
