 syntax="proto3";
 package
// metamodel_version: 1.7.0
// An ACKicker element simulates a time-dependent kicker.  It is like a Kicker element except that the field varies in time.  This element requires a user supplied time-dependent expression.
message ACKicker
 {
  string id = 0
  string kind = 0
 repeated  string alias = 0
 repeated  string nativeTypes = 0
  metaParamGroup metaP = 0
 repeated  physicalFunctionEnum functions = 0
  physicalRelationEnum beamlineRelation = 0
  floorParamGroup floorP = 0
  longitudinalPlacementParamGroup longitudinalPlacementP = 0
  referenceParamGroup referenceP = 0
  bodyShiftParamGroup bodyShiftP = 0
  twissParamGroup twissP = 0
  planeEnum plane = 0
  electricMultipoleParamGroup electricMultipoleP = 0
  magneticMultipoleParamGroup magneticMultipoleP = 0
 }
// A single generic key/value metadata entry, used as a GraphQL-compatible replacement for an open-ended (range: Any) field. A list of these represents an arbitrary, extensible bag of program-specific metadata.
message AdditionalMetadata
 {
  string key = 0
  string value = 0
  dataTypeEnum datatype = 0
 }
// A relationship indicating that the subject component is adjacent to the object component and not overlapping
//  in a specified context, such as radiation detector and a magnet.
message AdjacentTo
 {
  string id = 0
