message DiagnosticDevice
 {
  string id = 0
  string kind = 0
 repeated  string alias = 0
 repeated  string nativeTypes = 0
  metaParamGroup metaP = 0
 repeated  physicalFunctionEnum functions = 0
  physicalRelationEnum beamlineRelation = 0
  floorParamGroup floorP = 0
  longitudinalPlacementParamGroup longitudinalPlacementP = 0
 }
// A field-free space between beamline components. A Drift is a virtual beamline component whose longitudinal extent preserves the separation between adjacent physical or virtual components.
message Drift
 {
  string id = 0
  string kind = 0
 repeated  string alias = 0
 repeated  string nativeTypes = 0
  metaParamGroup metaP = 0
 repeated  virtualFunctionEnum functions = 0
  virtualRelationEnum beamlineRelation = 0
  floorParamGroup floorP = 0
  longitudinalPlacementParamGroup longitudinalPlacementP = 0
 }
// Mixin for electric multipole parameters,  which can be used to describe the electric field components of an accelerator element. This mixin is aligned with PALS ElectricMultipoleP for interoperability with the Particle Accelerator Language Standard (PALS). Example with three multipole components (N=0,1,2): ```yaml elec_components: - order: 7
//   tilt: 0.7
// - order: 3
//   En: 27.3
// - order: 2
//   EnL: 3.47e1
// ```
message ElectricMultipoleParamGroup
 {
  string id = 0
 repeated  multipoleParameterGroup elecComponents = 0
 }
