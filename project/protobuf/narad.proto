message Facility
 {
 repeated  identifier identifiers = 0
 repeated  component components = 0
 repeated  beamLine beamlines = 0
 repeated  signal signals = 0
 repeated  signalBinding signalBindings = 0
 repeated  componentRelation componentRelations = 0
 }
