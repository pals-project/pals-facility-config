// An ACKicker element simulates a time-dependent kicker.  It is like a Kicker element except that the field varies in time.  This element requires a user supplied time-dependent expression.
message ACKicker
 {
  string id = 0
  string type = 0
 repeated  string nativeTypes = 0
  string description = 0
  string label = 0
  string alias = 0
 repeated  metadataEntry additionalMetadata = 0
 repeated  physicalFunctionEnum functions = 0
  physicalRelationEnum beamlineRelation = 0
  float x = 0
  float y = 0
  float z = 0
  float theta = 0
  float phi = 0
  float psi = 0
  float length = 0
  float sPosition = 0
  string speciesRef = 0
  float pcRef = 0
  float eTotRef = 0
  float timeRef = 0
  float xOffset = 0
  float yOffset = 0
  float zOffset = 0
  float xRot = 0
  float yRot = 0
  float zRot = 0
  float alphaA = 0
  float alphaB = 0
  float betaA = 0
  float betaB = 0
  float etaX = 0
  float etaY = 0
  float etapX = 0
  float etapY = 0
  float phiA = 0
  float phiB = 0
