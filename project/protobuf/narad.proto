  metaParamGroup metaP = 0
 repeated  physicalFunctionEnum functions = 0
  physicalRelationEnum beamlineRelation = 0
  floorParamGroup floorP = 0
  longitudinalPlacementParamGroup longitudinalPlacementP = 0
  referenceParamGroup referenceP = 0
  electricMultipoleParamGroup electricMultipoleP = 0
  magneticMultipoleParamGroup magneticMultipoleP = 0
  bodyShiftParamGroup bodyShiftP = 0
  twissParamGroup twissP = 0
 }
